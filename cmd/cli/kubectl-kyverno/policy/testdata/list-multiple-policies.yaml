apiVersion: v1
kind: List
items:
- apiVersion: policies.kyverno.io/v1alpha1
  kind: ValidatingPolicy
  metadata:
    name: require-labels
  spec:
    validations:
    - expression: "has(object.metadata.labels) && 'app.kubernetes.io/name' in object.metadata.labels"
      message: "The label 'app.kubernetes.io/name' is required."
    matchConstraints:
      resourceRules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
- apiVersion: policies.kyverno.io/v1beta1
  kind: NamespacedValidatingPolicy
  metadata:
    name: namespace-policy
    namespace: default
  spec:
    validations:
    - expression: "object.metadata.annotations['service.beta.kubernetes.io/aws-load-balancer-type'] == 'nlb'"
      message: "Service must have specific annotation"
    matchConstraints:
      resourceRules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["services"]
