apiVersion: v1
kind: List
items:
- apiVersion: policies.kyverno.io/v1alpha1
  kind: ValidatingPolicy
  metadata:
    name: valid-policy
  spec:
    validations:
    - expression: "has(object.metadata.labels) && 'app' in object.metadata.labels"
      message: "Label required"
    matchConstraints:
      resourceRules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
- apiVersion: v1
  kind: ConfigMap
  metadata:
    name: not-a-policy
  data:
    key: value
