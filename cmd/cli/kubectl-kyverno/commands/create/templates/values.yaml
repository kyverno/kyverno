# list of policy values
policies:
{{- range $key, $value := .Policies }}
  - name: {{ .Name }}
{{- with .Rules }}
    rules:
{{- range . }}
      - name: {{ .Name }}
{{- if .Values }}
        values:
{{- range $key, $value := .Values }}
          {{ $key }}: {{ $value }}
{{- end }}
{{- else }}
        values: {}
{{- end }}
{{- end }}
{{- end }}
{{- with .Resources }}
    resources:
{{- range . }}
      - name: {{ .Name }}
{{- if .Values }}
        values:
{{- range $key, $value := .Values }}
          {{ $key }}: {{ $value }}
{{- end }}
{{- else }}
        values: {}
{{- end }}
{{- end }}
{{- end }}
{{- end }}

# list of global values
globalValues:
{{- range $key, $value := .GlobalValues }}
  {{ $key }}: {{ $value }}
{{- end }}

# list of namespace selectors
namespaceSelector:
{{- range .NamespaceSelectors }}
  - name: {{ .Name }}
{{- if .Labels }}
    labels:
{{- range $key, $value := .Labels }}
      {{ $key }}: {{ $value }}
{{- end }}
{{- else }}
    labels: {}
{{- end }}
{{- end }}
