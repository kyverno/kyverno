apiVersion: cli.kyverno.io/v1alpha1
kind: UserInfo
metadata:
  name: {{ printf "%q" .Name }}

# list of roles
roles:
{{- range .Roles }}
  - {{ printf "%q" . }}
{{- end }}

# list of cluster roles
clusterRoles:
{{- range .ClusterRoles }}
  - {{ printf "%q" . }}
{{- end }}

userInfo:
  # user name
  username: {{ printf "%q" .AdmissionUserInfo.Username }}

  # list of groups
  groups:
{{- range .AdmissionUserInfo.Groups }}
    - {{ printf "%q" . }}
{{- end }}
