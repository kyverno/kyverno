apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: {{ .Name }}

# list of policy files
policies:
{{- range .Policies }}
  - {{ . }}
{{- end }}

# list of resource files
resources:
{{- range .Resources }}
  - {{ . }}
{{- end }}

# variables file (optional)
variables: {{ .Values }}

# list of expected results
results:
{{- range .Results }}
  - policy: {{ .Policy }}
    rule: {{ .Rule }}
    resources:
      - {{ if .Namespace }}{{ .Namespace }}/{{ end }}{{ .Resource }}
    kind: {{ .Kind }}
    result: {{ .Result }}
{{- if .PatchedResource }}
    patchedResources: {{ .PatchedResource }}
{{- end }}
{{- end }}
