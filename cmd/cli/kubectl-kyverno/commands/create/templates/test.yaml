# test name
name: {{ .Name }}

# list of policy files
policies:
{{- range .Policies }}
  - {{ . }}
{{- end }}

# list of resource files
resources:
{{- range .Resources }}
  - {{ . }}
{{- end }}

# variables file (optional)
variables: {{ .Values }}

# list of expected results
results:
{{- range .Results }}
  - policy: {{ .Policy }}
    rule: {{ .Rule }}
    resources:
      {{- if .Namespace }}
      - {{ printf "%s/%s" .Namespace .Resource | printf "%q" }}
      {{- else }}
      - {{ printf "%q" .Resource }}
      {{- end }}
    kind: {{ .Kind }}
    {{- if .PatchedResource }}
    patchedResources: {{ printf "%q" .PatchedResource }}
    {{- end }}
    result: {{ .Result }}
{{- end }}
