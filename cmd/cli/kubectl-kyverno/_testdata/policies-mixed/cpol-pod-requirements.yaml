apiVersion: policies.kyverno.io/v1alpha1
kind: ValidatingPolicy
metadata:
  name: pod-requirements
spec:
  validations:
  - expression: "has(object.metadata.labels) && 'account' in object.metadata.labels"
    message: "User pods must include an account for charging"
  matchConstraints:
    resourceRules:
    - operations: ["CREATE", "UPDATE"]
      apiGroups: [""]
      apiVersions: ["v1"]
      resources: ["pods"]
