      "031-background-scan":
        path: "test/conformance/chainsaw/031-background-scan"
        description: "Background scan tests"

# Usage for AI agents:
# Given a changed file path, find matching patterns above and run corresponding test suites.
# Example: changes to pkg/engine/mutate/strategicPreprocessing.go → run "unit" + "conformance:023-mutate"