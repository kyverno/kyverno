id: wrap-errors
language: go
severity: hint
message: "Wrap with context: fmt.Errorf(\"<operation>: %w\", err) instead of a bare errors.New."
note: |
  A bare errors.New($MSG) loses the call-site context a caller further up the stack needs to debug a failure.
  Prefer fmt.Errorf("...: %w", err) when wrapping an existing error, or a descriptive errors.New only for a new,
  standalone error with no underlying cause to wrap.
rule:
  pattern: errors.New($MSG)
