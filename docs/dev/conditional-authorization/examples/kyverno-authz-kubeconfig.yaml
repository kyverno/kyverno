# kubeconfig referenced by AuthorizationConfiguration
# webhook.connectionInfo.kubeConfigFile.
#
# current-context is used for SubjectAccessReview requests.
# The context named in webhook.conditionsReview.kubeConfigContextName is used for
# AuthorizationConditionsReview callbacks. If you do not set
# kubeConfigContextName, point current-context at the combined endpoint
# (https://kyverno-svc.kyverno.svc:443/authz); Kyverno then dispatches on
# apiVersion and kind.
apiVersion: v1
kind: Config
clusters:
  - name: kyverno-sar
    cluster:
      server: https://kyverno-svc.kyverno.svc:443/authz/subjectaccessreview
      certificate-authority: /etc/kubernetes/kyverno-ca.crt
  - name: kyverno-conditions
    cluster:
      server: https://kyverno-svc.kyverno.svc:443/authz/conditionsreview
      certificate-authority: /etc/kubernetes/kyverno-ca.crt
users:
  - name: kube-apiserver
    user: {}
contexts:
  - name: kyverno-sar
    context:
      cluster: kyverno-sar
      user: kube-apiserver
  - name: kyverno-conditions
    context:
      cluster: kyverno-conditions
      user: kube-apiserver
current-context: kyverno-sar
