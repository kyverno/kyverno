apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: image-policy-registry-secret
  namespace: tenant-a
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["registry"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: image-policy-registry-secret
  namespace: tenant-a
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: image-policy-registry-secret
subjects:
- kind: ServiceAccount
  name: kyverno-admission-controller
  namespace: kyverno
- kind: ServiceAccount
  name: kyverno-reports-controller
  namespace: kyverno
