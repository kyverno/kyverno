apiVersion: policies.kyverno.io/v1alpha1
kind: PayloadSchema
metadata:
  name: nono-approval-v1
spec:
  dialect: JSONSchema202012SubsetV1
  compatibilityVersion: "1"
  schema: {"type": "object", "required": ["backend", "request"], "additionalProperties": true, "properties": {"backend": {"type": "string", "maxLength": 128}, "request": {"type": "object", "required": ["capability_type", "request_id", "session_id"], "additionalProperties": true, "properties": {"capability_type": {"type": "string", "enum": ["command", "endpoint"]}, "request_id": {"type": "string", "minLength": 1, "maxLength": 256}, "session_id": {"type": "string", "minLength": 1, "maxLength": 256}, "child_pid": {"type": "integer", "minimum": 0}, "command": {"type": "string", "maxLength": 256}, "caller": {"type": "string", "maxLength": 256}, "args": {"type": "array", "maxItems": 256, "items": {"type": "string", "maxLength": 4096}}, "intercept_rule": {"type": "string", "maxLength": 256}, "method": {"type": "string", "maxLength": 32}, "path": {"type": "string", "maxLength": 8192}, "route_id": {"type": "string", "maxLength": 256}, "upstream": {"type": "string", "maxLength": 512}, "rule_label": {"type": "string", "maxLength": 512}}, "oneOf": [{"required": ["command"], "properties": {"capability_type": {"enum": ["command"]}}}, {"required": ["method", "path"], "properties": {"capability_type": {"enum": ["endpoint"]}}}]}}}
  match:
    requiredPaths: [/backend, /request/capability_type, /request/request_id]
  exposure:
    include: ["/request/**"]
    exclude: []
  # kubectl is an ALLOWLIST, not a denylist: a verb we forgot to list (cordon,
  # exec, drain, ...) must be refused, not granted. args[0] must be the nono shim,
  # and the verb must come straight after it. Global flags before the verb are not
  # supported on purpose: "-n get delete pod x" would fool a "first word" check.
  # This over-denies (kubectl -n prod get pods is refused), never under-denies.
  computed: [{"name": "shimOk", "expression": "has(object.request.args) && size(object.request.args) > 0 && object.request.args[0].endsWith('nono-shim')"}, {"name": "argv", "expression": "!has(object.request.args) || size(object.request.args) <= 1 ? [] : object.request.args.slice(1, size(object.request.args))"}, {"name": "isKubectl", "expression": "object.request.capability_type == 'command' && (object.request.command == 'kubectl' || object.request.command.endsWith('/kubectl'))"}, {"name": "isReadOnlyKubectl", "expression": "derived.shimOk && size(derived.argv) > 0 && derived.argv[0] in ['get','describe','logs','top','explain','api-resources','api-versions','version','cluster-info']"}]
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: nono-kubectl-readonly
spec:
  evaluation:
    mode: Schema
    schemaRef: {name: nono-approval-v1}
  validations:
    - expression: "!derived.isKubectl || derived.isReadOnlyKubectl"
      message: "kubectl is limited to read-only subcommands (get, describe, logs, top, ...) directly after the nono shim"
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: nono-no-secrets-endpoint
spec:
  evaluation:
    mode: Schema
    schemaRef: {name: nono-approval-v1}
  validations:
    - expression: >-
        object.request.capability_type != 'endpoint' ||
        !object.request.path.contains('/secrets')
      message: endpoints under /secrets are not allowed
---
apiVersion: policies.kyverno.io/v1alpha1
kind: PayloadBinding
metadata:
  name: nono-approve
spec:
  route:
    path: /approve
    methods: [POST]
  authorization:
    allowedPrincipals:
      - spiffe://example.com/nono-agent
  selection:
    schemaRef: {name: nono-approval-v1}
  requiredPolicies:
    - name: nono-kubectl-readonly
  enforcement:
    requireApplicablePolicy: true
    defaultOnNoMatch: Deny
  limits:
    maxBodyBytes: 65536
    maxDepth: 16
    timeoutMillis: 100
  response:
    statusCode: 200
    bodyExpression: >-
      decision.allowed
        ? {"decision": "granted"}
        : {"decision": "denied", "reason": decision.message}
