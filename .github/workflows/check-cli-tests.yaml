# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CLI

permissions: {}

on:
  pull_request:
    branches:
      - main
      - release-*
  push:
    branches:
      - main
      - release-*

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: CLI tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: ./.github/actions/go/setup
      - name: Setup TEST_GIT_BRANCH
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "TEST_GIT_BRANCH=$PR_BASE_REF" >> $GITHUB_ENV
          else
            echo "TEST_GIT_BRANCH=$REF_NAME" >> $GITHUB_ENV
          fi
      - name: Test CLI
        run: |
          VERSION=${{ github.ref_name }} make test-cli
      - name: Test CLI (failures)
        run: |
          CLI_PATH=$PWD/cmd/cli/kubectl-kyverno/kubectl-kyverno
          $CLI_PATH test ./test/cli/test-fail/missing-policy && exit 1 || exit 0
          $CLI_PATH test ./test/cli/test-fail/missing-rule && exit 1 || exit 0
          $CLI_PATH test ./test/cli/test-fail/missing-resource && exit 1 || exit 0
      # The PSS fixture check takes minutes, so it runs only on pull requests
      # to main that change something it depends on.
      - name: Detect PSS fixture check changes
        id: pss-fixtures
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          # Read the list first: with pipefail, piping into grep -q can fail
          # with SIGPIPE on a match and skip the check.
          changed_files=$(git diff --name-only "$BASE_SHA" HEAD)
          if grep -qE '^(charts/kyverno-policies/(templates/(baseline|restricted)/[^/]+\.cel\.yaml|templates/_helpers\.tpl|values\.yaml|Chart\.yaml)|scripts/pss-upstream/|scripts/(test-)?verify-policies-pss-fixtures\.py|Makefile$|\.github/workflows/check-cli-tests\.yaml)' <<<"$changed_files"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install helm
        if: steps.pss-fixtures.outputs.changed == 'true'
        uses: ./.github/actions/tools/helm
      - name: Verify PSS policies against upstream PSA fixtures
        if: steps.pss-fixtures.outputs.changed == 'true'
        run: |
          set -e
          python3 -m venv "$RUNNER_TEMP/pss-fixtures"
          "$RUNNER_TEMP/pss-fixtures/bin/python" -m pip install --disable-pip-version-check PyYAML==6.0.3
          "$RUNNER_TEMP/pss-fixtures/bin/python" scripts/test-verify-policies-pss-fixtures.py
          make verify-policies-pss-fixtures PYTHON="$RUNNER_TEMP/pss-fixtures/bin/python"

  sync-issue:
    if: always() && github.event_name == 'push'
    needs:
      - check
    permissions:
      issues: write
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sync issue
        uses: ./.github/actions/workflow/failure-issue
        with:
          conclusion: ${{ contains(needs.*.result, 'failure') && 'failure' || job.status }}
          needs: ${{ toJSON(needs) }}