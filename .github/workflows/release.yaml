name: releaser

permissions: {}

on:
  push:
    tags:
      - v*

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'kyverno/kyverno'
    permissions:
      contents: read
      actions: read
      packages: read
    uses: ./.github/workflows/release-validate.yaml
    with:
      tag: ${{ github.ref_name }}
      sha: ${{ github.sha }}

  publish:
    needs: validate
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
    uses: ./.github/workflows/release-publish.yaml
    with:
      tag: ${{ github.ref_name }}
      sha: ${{ github.sha }}
