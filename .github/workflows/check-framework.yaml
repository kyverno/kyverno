# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: framework tests (envtest)

on:
  pull_request:
    branches:
      - main
      - release-*
    paths-ignore:
      - 'docs/**'
      - 'charts/**'
      - '**/*.md'
  push:
    branches:
      - main
      - release-*

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ENVTEST_VERSION: "v0.24.0" # adjacent to 1.36
  K8S_VERSION: "1.36"

jobs:
  packages:
    name: List framework test packages
    runs-on: ubuntu-slim
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every directory under test/integration except the shared framework is a test package. Listing
      # them here instead of in the matrix means a new package runs on PRs from the day it lands.
      - name: List packages
        id: list
        shell: bash
        run: |
          packages=()
          for dir in test/integration/*/; do
            name=$(basename "$dir")
            if [ "$name" != framework ]; then
              packages+=("\"$name\"")
            fi
          done
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::found no test packages under test/integration"
            exit 1
          fi
          echo "packages=[$(IFS=,; echo "${packages[*]}")]" | tee -a "$GITHUB_OUTPUT"

  tests:
    name: Framework tests
    needs: packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.packages.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          android: true
          docker-images: false
          dotnet: false
          haskell: false
          large-packages: false
          swap-storage: false
          tool-cache: false
      - name: Setup Go
        id: setup-go
        uses: ./.github/actions/go/setup
        with:
          gobuild-cache-prefix: ''

      - name: Cache envtest binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/kubebuilder-envtest
          key: envtest-${{ env.ENVTEST_VERSION }}-${{ env.K8S_VERSION }}

      # todo: turn to a make command
      - name: Install envtest
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@$ENVTEST_VERSION

      - name: Setup envtest binaries
        run: |
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use $K8S_VERSION -p path)" >> $GITHUB_ENV

      - name: Run tests
        env:
          PACKAGE: ${{ matrix.package }}
        run: go test -tags=integration "./test/integration/${PACKAGE}/..."
