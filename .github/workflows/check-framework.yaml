# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: framework tests (envtest)

on:
  pull_request:
    branches:
      - main
      - release-*
    paths-ignore:
      - 'docs/**'
      - 'charts/**'
      - '**/*.md'
  push:
    branches:
      - main
      - release-*

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ENVTEST_VERSION: "v0.24.0" # adjacent to 1.36
  K8S_VERSION: "1.36"

jobs:
  packages:
    permissions:
      contents: read
    name: List framework test packages
    runs-on: ubuntu-slim
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every directory under test/integration except the shared framework is a test package. Listing
      # them here instead of in the matrix means a new package runs on PRs from the day it lands.
      - name: List packages
        id: list
        shell: bash
        run: |
          packages=()
          for dir in test/integration/*/; do
            name=$(basename "$dir")
            if [ "$name" != framework ]; then
              packages+=("\"$name\"")
            fi
          done
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::found no test packages under test/integration"
            exit 1
          fi
          echo "packages=[$(IFS=,; echo "${packages[*]}")]" | tee -a "$GITHUB_OUTPUT"

  tests:
    name: Framework tests
    needs: packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.packages.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record initial disk headroom
        run: |
          echo '### Disk before Go setup' >> "$GITHUB_STEP_SUMMARY"
          df -h . /tmp | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Setup Go
        id: setup-go
        uses: ./.github/actions/go/setup
        with:
          gobuild-cache-prefix: gobuild-framework-${{ matrix.package }}
          gobuild-cache-include-run-id: 'true'

      - name: Cache envtest binaries
        id: cache-envtest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/kubebuilder-envtest
            ~/go/bin/setup-envtest
          key: envtest-tools-${{ env.ENVTEST_VERSION }}-${{ env.K8S_VERSION }}
          restore-keys: |
            envtest-${{ env.ENVTEST_VERSION }}-${{ env.K8S_VERSION }}

      # todo: turn to a make command
      - name: Install envtest
        run: |
          if ! command -v setup-envtest >/dev/null 2>&1; then
            go install sigs.k8s.io/controller-runtime/tools/setup-envtest@$ENVTEST_VERSION
          fi

      - name: Setup envtest binaries
        run: |
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use $K8S_VERSION -p path)" >> $GITHUB_ENV

      - name: Run tests
        env:
          PACKAGE: ${{ matrix.package }}
        run: go test -tags=integration "./test/integration/${PACKAGE}/..."

      - name: Record final disk headroom
        if: always()
        run: |
          echo '### Disk after tests' >> "$GITHUB_STEP_SUMMARY"
          df -h . /tmp | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save gobuild cache
        if: |
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        uses: ./.github/actions/go/save-cache
        with:
          path: ${{ steps.setup-go.outputs.gobuild-cache }}
          cache-prefix: gobuild-framework-${{ matrix.package }}
          include-run-id: 'true'
