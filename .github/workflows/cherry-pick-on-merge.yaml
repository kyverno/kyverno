name: Cherry-pick on PR merge

permissions:
  contents: read

on:
  pull_request:
    types: [closed]

jobs:
  # In case we use the /cherry-pick in unmerged PR, wait for user to merge it
  # look for comments wit cherry-picking slash command
  # and cherry-pick as we would do normally
  cherry-pick:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: Fetch cherry-pick targets from comments
        id: cherry
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100
            });
            
            const branches = new Set();
            for (const comment of comments) {
              const match = (comment.body || '').split(/\r?\n/, 1)[0]
                .match(/^\/cherry-pick[ \t]+([A-Za-z0-9][A-Za-z0-9._/-]*)[ \t]*$/);
              if (!match) {
                continue;
              }
              let permission;
              try {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                  ...context.repo,
                  username: comment.user.login
                });
                permission = data.permission;
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
              if (!['write', 'maintain', 'admin'].includes(permission)) {
                core.warning(`Ignoring unauthorized cherry-pick comment ${comment.id}`);
                continue;
              }
              try {
                await github.rest.repos.getBranch({
                  ...context.repo,
                  branch: match[1]
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
                core.warning(`Ignoring missing cherry-pick target ${match[1]} from comment ${comment.id}`);
                continue;
              }
              branches.add(match[1]);
            }
            return Array.from(branches);
      - name: Checkout repository
        if: steps.cherry.outputs.result != '[]'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Normalize GitHub App private key
        if: steps.cherry.outputs.result != '[]'
        id: normalize-key
        shell: bash
        env:
          RAW_APP_PRIVATE_KEY: ${{ secrets.PR_UPDATER_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          key="$RAW_APP_PRIVATE_KEY"
          # Support secrets saved with escaped newlines.
          key="${key//\\n/$'\n'}"

          if ! printf '%s' "$key" | grep -Eq 'BEGIN (RSA |EC |)PRIVATE KEY'; then
            # Support secrets saved as base64-encoded PEM.
            decoded="$(printf '%s' "$RAW_APP_PRIVATE_KEY" | tr -d '[:space:]' | base64 --decode 2>/dev/null || true)"
            decoded="${decoded//\\n/$'\n'}"
            if printf '%s' "$decoded" | grep -Eq 'BEGIN (RSA |EC |)PRIVATE KEY'; then
              key="$decoded"
            fi
          fi

          if ! printf '%s' "$key" | grep -Eq 'BEGIN (RSA |EC |)PRIVATE KEY'; then
            echo "PR_UPDATER_APP_PRIVATE_KEY does not look like a valid PEM private key." >&2
            exit 1
          fi

          # ::add-mask:: is line-based, mask each line of the key individually.
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done <<< "$key"
          {
            echo "private_key<<EOF"
            printf '%s\n' "$key"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub App token
        if: steps.cherry.outputs.result != '[]'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PR_UPDATER_APP_CLIENT_ID }}
          private-key: ${{ steps.normalize-key.outputs.private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Cherry-pick to each branch
        if: steps.cherry.outputs.result != '[]'
        uses: ./.github/actions/git/cherry-pick
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          source-pr: ${{ github.event.pull_request.number }}
          source-pr-title: ${{ github.event.pull_request.title }}
          target-branches: ${{ join(fromJSON(steps.cherry.outputs.result), ',') }}
          merge-commit: ${{ github.event.pull_request.merge_commit_sha }}
