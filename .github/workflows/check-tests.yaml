# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Tests

# The E2E scheduler (.github/workflows/e2e-scheduler.yaml) and the batch job
# below find the matrix of a run by the suffix of this name. Keep the suffix
# when you change it.
run-name: Tests on ${{ github.ref_name }} (${{ inputs.matrix || 'full' }})

permissions: {}

# The suite doesn't run on push. The E2E scheduler starts it with
# workflow_dispatch on main and the supported release branches, so each run
# tests a batch of commits. You can also start it by hand, for example after a
# fix landed in kyverno/policies or kyverno/sdk. On main and release branches a
# dispatched run updates the tracking issue, which clears the E2E gate. An
# issue with the full-matrix label is cleared by a full run only: see the
# sync-issue job.
on:
  workflow_dispatch:
    inputs:
      matrix:
        description: 'Kubernetes versions to test: full runs every supported version, reduced runs only the oldest and the latest one'
        type: choice
        options:
          - full
          - reduced
        default: full
  # A called run belongs to the calling workflow, so it doesn't update the
  # tracking issue or the E2E gate: both follow runs of this workflow only.
  workflow_call:
    inputs:
      matrix:
        description: 'Kubernetes versions to test: full or reduced'
        type: string
        default: full

concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Build test images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: ./.github/actions/go/setup
      - name: Install Ko
        uses: ./.github/actions/tools/ko
      - name: Build
        shell: bash
        run: |
          set -e
          VERSION=${{ github.ref_name }} make docker-save-image-all
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kyverno.tar
          path: kyverno.tar
          if-no-files-found: error

  cli:
    name: Build test CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: ./.github/actions/go/setup
      - name: Build
        shell: bash
        run: |
          set -e
          VERSION=${{ github.ref_name }} make build-cli
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kubectl-kyverno
          path: cmd/cli/kubectl-kyverno/kubectl-kyverno
          if-no-files-found: error

  conformance-tests:
    name: Conformance tests
    needs:
      - images
      - cli
    permissions:
      packages: read
    uses: ./.github/workflows/tests-conformance.yaml
    with:
      matrix: ${{ inputs.matrix || 'full' }}

  conformance-policy-library-tests:
    name: Conformance tests (policy library)
    needs:
      - images
      - cli
    uses: ./.github/workflows/tests-conformance-policy-library.yaml

  k6-tests:
    name: K6 tests
    needs:
      - images
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/tests-k6.yaml

  perf:
    name: Performance benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: ./.github/actions/go/setup
        with:
          gobuild-cache-prefix: gobuild-unit-tests
          gobuild-cache-include-run-id: 'true'
      - name: Check performance regression
        run: make check-perf

  # Lists the commits this run tests for the first time: those since the last
  # green run on this branch that covers this matrix. When the run fails, the
  # suspects are in this range. Informational only: sync-issue copies the
  # issue-note output into the tracking issue, and never reads the result of
  # this job as a test result.
  batch:
    name: Batch summary
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-')
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      issue-note: ${{ steps.batch.outputs.issue-note }}
    permissions:
      # actions: the job lists the runs of this workflow
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Summarize batch
        id: batch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MATRIX: ${{ inputs.matrix || 'full' }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = context.ref.replace(/^refs\/heads\//, '');
            const head = context.sha;
            const matrix = process.env.MATRIX;
            const MAX_COMMITS = 100;
            // The tracking issue gets a short form of this summary. Its body
            // is capped at 65,536 characters and the log excerpts take most
            // of them, so the list and the mentions are capped.
            const MAX_ISSUE_ENTRIES = 20;
            const MAX_MENTIONS = 10;
            const toIssue = lines =>
              core.setOutput('issue-note', ['### Suspect commits', '', ...lines].join('\n'));

            // Runs from before the matrix input existed have no suffix; they
            // always ran the full matrix.
            const matrixOf = r =>
              (/\((full|reduced)\)$/.exec(r.display_title || '') || [])[1] || 'full';
            // A green full run also covers the reduced matrix.
            const covers = r => matrix === 'reduced' || matrixOf(r) === matrix;

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'check-tests.yaml', branch, status: 'success', per_page: 100
            }, (response, done) => {
              const found = response.data.filter(r => r.id !== context.runId && covers(r));
              if (found.length > 0) done();
              return found;
            });
            const lastGreen = runs[0];

            const summary = core.summary.addHeading(`Batch on ${branch} (${matrix} matrix)`, 2);
            if (!lastGreen) {
              toIssue([`No earlier green ${matrix} run on \`${branch}\`, so the range of suspect commits is unknown.`]);
              await summary.addRaw(`No earlier green ${matrix} run on \`${branch}\`, so the batch range is unknown.`).write();
              return;
            }
            const base = lastGreen.head_sha;
            if (base === head) {
              toIssue([`The [last green run](${lastGreen.html_url}) tested the same commit \`${head.slice(0, 9)}\`, so this run tests no new commit.`]);
              await summary.addRaw(`The [last green run](${lastGreen.html_url}) tested the same commit \`${head.slice(0, 9)}\`.`).write();
              return;
            }

            const commits = await github.paginate(github.rest.repos.compareCommitsWithBasehead, {
              owner, repo, basehead: `${base}...${head}`, per_page: 100
            }, response => response.data.commits);
            const compareUrl = `${context.serverUrl}/${owner}/${repo}/compare/${base}...${head}`;
            const shown = commits.slice(-MAX_COMMITS).reverse();

            const rows = [];
            const authors = new Set();
            // For the tracking issue: one entry per pull request, and the
            // people to mention. Both newest first.
            const entries = new Map();
            const humans = new Set();
            for (const c of shown) {
              let prs = [];
              try {
                ({ data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner, repo, commit_sha: c.sha
                }));
              } catch (err) {
                core.warning(`Could not list pull requests for ${c.sha} (${err.message || String(err)}).`);
              }
              const merged = prs.filter(p => p.merged_at && p.base.ref === branch);
              const author = merged[0]?.user?.login ? merged[0].user : c.author;
              const login = author?.login;
              if (login) authors.add(login);
              // No commit titles in the issue: they are free text, which could
              // mention people or fake the marker that identifies the issue.
              entries.set(
                merged.map(p => `#${p.number}`).join(', ') || c.sha.slice(0, 9),
                login || 'unknown author');
              // Bots can't act on a mention.
              if (login && author.type === 'User') humans.add(login);
              rows.push([
                `<a href="${c.html_url}"><code>${c.sha.slice(0, 9)}</code></a>`,
                merged.map(p => `<a href="${p.html_url}">#${p.number}</a>`).join(', ') || '—',
                login || c.commit.author?.name || '—',
                (c.commit.message.split('\n')[0] || '').replace(/&/g, '&amp;').replace(/</g, '&lt;'),
              ]);
            }

            const range = `${base.slice(0, 9)}..${head.slice(0, 9)}`;

            const listed = [...entries].slice(0, MAX_ISSUE_ENTRIES);
            const mentioned = [...humans].slice(0, MAX_MENTIONS);
            const issueNote = [
              `This run is the first to test [\`${range}\`](${compareUrl}): ${commits.length} commits since the [last green ${matrix === 'full' ? 'full ' : ''}run](${lastGreen.html_url}).`,
              '',
              ...listed.map(([ref, login]) => `- ${ref} by ${login}`),
            ];
            if (entries.size > listed.length || commits.length > shown.length) {
              issueNote.push(`- Only the latest ${listed.length} are listed. The [compare view](${compareUrl}) has all of them.`);
            }
            if (mentioned.length > 0) {
              const more = humans.size - mentioned.length;
              issueNote.push('',
                `${mentioned.map(l => `@${l}`).join(' ')}${more > 0 ? ` and ${more} more` : ''}: this run failed after your changes landed. Please check whether one of them is the cause.`);
            }
            toIssue(issueNote);
            summary
              .addRaw(`Commits since the [last green run](${lastGreen.html_url}): `)
              .addLink(range, compareUrl)
              .addRaw(` (${commits.length} commits).`, true);
            if (commits.length > shown.length) {
              summary.addRaw(`<p>Only the latest ${shown.length} are listed.</p>`, true);
            }
            await summary
              .addRaw(`<p>Authors: ${[...authors].sort().join(', ') || '—'}</p>`, true)
              .addTable([
                [
                  { data: 'Commit', header: true },
                  { data: 'Pull request', header: true },
                  { data: 'Author', header: true },
                  { data: 'Title', header: true },
                ],
                ...rows,
              ])
              .write();

  # A run that was cancelled without a failure says nothing about the tests:
  # it must neither close the tracking issue nor open one, so the issue is
  # left as it is. A failure is still recorded even if other jobs were then
  # cancelled.
  # The batch job is needed for its output only, and its result must never
  # count as a test result. So the steps read the outputs of the Test results
  # step, not needs.*.result. The condition below still reads needs.*.result:
  # a failed batch job may start this job after a cancelled run, and the Plan
  # step then leaves the issue alone. The last clause of that line keeps a
  # cancelled batch job from skipping this job after the tests passed.
  sync-issue:
    if: >-
      always() &&
      (contains(needs.*.result, 'failure') || !contains(needs.*.result, 'cancelled') ||
        needs.batch.result == 'cancelled') &&
      github.workflow == 'Tests' && github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-'))
    needs:
      - images
      - cli
      - conformance-tests
      - conformance-policy-library-tests
      - k6-tests
      - perf
      # Not a test job: see the comment above.
      - batch
    permissions:
      issues: write
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test results
        id: tests
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            // Every needed job except batch is a test job, so a job added to
            // needs counts without a change here.
            const { batch, ...tests } = JSON.parse(process.env.NEEDS);
            const results = Object.values(tests).map(job => job.result);
            core.setOutput('failed', results.includes('failure'));
            core.setOutput('cancelled', results.includes('cancelled'));
            // For the "Job results" table of the issue: the test jobs only,
            // and none of the batch job's outputs.
            core.setOutput('needs', JSON.stringify(Object.fromEntries(
              Object.entries(tests).map(([id, job]) => [id, { result: job.result }]))));
      # A failed first attempt is re-run once by tests-rerun.yaml, which looks
      # for this step by name. The second attempt re-runs this job even though
      # it succeeded, because it depends on the failed jobs ("When you re-run
      # failed jobs or a specific job, GitHub also re-runs the jobs that depend
      # on them"), and then updates the tracking issue. So a flaky test doesn't
      # turn the E2E gate red.
      # Runs with a cancelled job aren't re-run, so they update the issue now.
      - name: Defer to the automatic re-run
        id: defer
        if: >-
          github.repository == 'kyverno/kyverno' &&
          github.workflow == 'Tests' &&
          github.run_attempt == '1' &&
          steps.tests.outputs.failed == 'true' &&
          steps.tests.outputs.cancelled != 'true'
        run: |
          echo "deferred=true" >> "$GITHUB_OUTPUT"
          echo "::notice::This first attempt failed. The Tests re-run workflow re-runs the failed jobs once, and the second attempt updates the tracking issue."
      # Decides what the Sync issue step does. A full run tests every supported
      # Kubernetes version, a reduced run only the oldest and the latest one.
      # A failure that only a full run finds gets the full-matrix label, and a
      # passing reduced run then leaves the issue open: it didn't run the jobs
      # that failed. Only a passing full run closes such an issue.
      #
      # - A full run fails, and every failed job is on a version in between:
      #   the issue gets full-matrix.
      # - A full run fails there and also in a job that reduced runs have: no
      #   label. A later passing reduced run closes the issue, and the next
      #   full run opens a new one with the label if the failure in between
      #   remains.
      # - A reduced run fails while the issue has full-matrix: the issue is
      #   updated as usual. The action only adds labels, so the label stays
      #   and the issue still needs a passing full run.
      # - A reduced run passes: the issue is closed unless it has full-matrix.
      # - A full run passes: the issue is closed.
      # - The first attempt of a failing run: this step doesn't run, see the
      #   step above. The second attempt is judged by the jobs that still fail
      #   after the re-run.
      # - Release branches: the scheduler starts their runs without the matrix
      #   input, so every run there is a full run and closes the issue.
      - name: Plan the issue update
        id: plan
        if: steps.defer.outputs.deferred != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MATRIX: ${{ inputs.matrix || 'full' }}
          FAILED: ${{ steps.tests.outputs.failed }}
          CANCELLED: ${{ steps.tests.outputs.cancelled }}
          BATCH_RESULT: ${{ needs.batch.result }}
          BATCH_NOTE: ${{ needs.batch.outputs.issue-note }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = context.ref.replace(/^refs\/heads\//, '');
            const matrix = process.env.MATRIX;
            const FULL_MATRIX = 'full-matrix';
            // The job of this workflow that passes the matrix input on, by
            // its name: a reduced run skips versions in its jobs only. The
            // other jobs run the same way in both matrices.
            const MATRIX_JOB = 'Conformance tests';
            // The batch job describes the run. It isn't a test.
            const BATCH_JOB = 'Batch summary';

            const versionOf = name => (/\bv\d+\.\d+\.\d+\b/.exec(name) || [])[0];
            const byVersion = (a, b) => a.localeCompare(b, undefined, { numeric: true });
            const labelNames = issue => issue.labels.map(l => (typeof l === 'string' ? l : l.name));

            /**
             * The versions that reduced runs skip, when every failed job of
             * this run is on one of them. Otherwise null.
             *
             * kubernetes-matrix.yaml lists the versions oldest first, and a
             * reduced run keeps the first and the last one of that list. That
             * holds for each list a job may read: versions, beta-versions,
             * stable-versions, and smoke-versions, which is the last version
             * in both matrices. So a reduced run has a job of this run exactly
             * when the job's version is the oldest or the latest one here.
             * The versions come from the job names, so they aren't listed a
             * second time. A job without a version runs in both matrices.
             */
            async function failedOnlyOutsideReduced() {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner, repo, run_id: context.runId, filter: 'latest', per_page: 100
              });
              const inMatrix = job => job.name.startsWith(`${MATRIX_JOB} / `);
              const versions = [...new Set(jobs.filter(inMatrix).map(job => versionOf(job.name)).filter(Boolean))]
                .sort(byVersion);
              const reduced = new Set([versions[0], versions[versions.length - 1]]);
              const outside = new Set();
              for (const job of jobs.filter(j => j.conclusion === 'failure' && j.name !== BATCH_JOB)) {
                const version = inMatrix(job) && versionOf(job.name);
                if (!version || reduced.has(version)) {
                  return null;
                }
                outside.add(version);
              }
              return outside.size > 0 ? [...outside].sort(byVersion) : null;
            }

            /**
             * The open tracking issues of this branch, found the way the
             * failure-issue action finds them: by label and by the marker in
             * the body. The second label finds an issue whose
             * workflow-failure label was removed by hand.
             */
            async function trackingIssues() {
              const marker = `<!-- workflow-failure:${context.workflow}:${context.ref} -->`;
              const found = new Map();
              for (const label of ['workflow-failure', FULL_MATRIX]) {
                const issues = await github.paginate(github.rest.issues.listForRepo, {
                  owner, repo, state: 'open', labels: label, per_page: 100
                });
                for (const issue of issues) {
                  if (!issue.pull_request && issue.body && issue.body.includes(marker)) {
                    found.set(issue.number, issue);
                  }
                }
              }
              return [...found.values()];
            }

            let sync = true;
            let fullMatrix = false;
            const note = [];

            if (process.env.FAILED === 'true') {
              // The action writes the note on a failure only, so nobody is
              // mentioned by a run that passed.
              note.push(process.env.BATCH_NOTE ||
                `### Suspect commits\n\nThe ${BATCH_JOB} job of this run (\`${process.env.BATCH_RESULT}\`) left no list of suspect commits.`);

              let outside = null;
              if (matrix === 'full') {
                try {
                  outside = await failedOnlyOutsideReduced();
                } catch (err) {
                  core.warning(`Could not list the jobs of this run (${err.message || String(err)}), so the issue doesn't get the ${FULL_MATRIX} label.`);
                }
              }
              fullMatrix = outside !== null;
              if (fullMatrix) {
                core.notice(`Every failed job is on ${outside.join(', ')}, which reduced runs skip, so the tracking issue gets the ${FULL_MATRIX} label.`);
              }
              // Always in the note, also when another run added the label:
              // the label outlives the run that set it.
              note.push([
                `### The \`${FULL_MATRIX}\` label`,
                '',
                (fullMatrix ? `This run failed only on ${outside.join(', ')}, which reduced runs skip, so this issue has the label. ` : '') +
                `When this issue has the \`${FULL_MATRIX}\` label, a full run failed only on Kubernetes versions that reduced runs skip, so a passing reduced run leaves the issue open. To clear it, start a full run: [Run workflow](${context.serverUrl}/${owner}/${repo}/actions/workflows/check-tests.yaml) on \`${branch}\` with matrix \`full\`. The nightly run does the same.`,
              ].join('\n'));
            } else if (process.env.CANCELLED === 'true') {
              sync = false;
              core.notice('This run was cancelled without a test failure, so the tracking issue is left as it is.');
            } else if (matrix === 'reduced') {
              // The list of labelled issues has come back empty while an
              // issue was open. So the action closes the issue only when this
              // step has seen it, and seen that it has no full-matrix label:
              // an empty or failed read leaves the issue as it is, and the
              // next passing run closes it.
              sync = false;
              try {
                const issues = await trackingIssues();
                const held = issues.filter(issue => labelNames(issue).includes(FULL_MATRIX));
                if (held.length > 0) {
                  core.notice(
                    `This reduced run passed, but ${held.map(issue => `#${issue.number}`).join(', ')} has the ${FULL_MATRIX} label: a full run failed on Kubernetes versions that reduced runs skip. The issue stays open until a full run passes. To start one, use Run workflow on ${branch} with matrix full.`,
                    { title: 'Tracking issue left open' });
                } else if (issues.length === 0) {
                  core.info(`No open tracking issue found for ${branch}, so there is nothing to close.`);
                } else {
                  sync = true;
                }
              } catch (err) {
                core.warning(`Could not read the tracking issue of ${branch} (${err.message || String(err)}), so this run leaves it as it is.`);
              }
            }

            core.setOutput('sync', sync);
            core.setOutput('full-matrix', fullMatrix);
            core.setOutput('note', note.join('\n\n'));
      - name: Sync issue
        if: steps.defer.outputs.deferred != 'true' && steps.plan.outputs.sync == 'true'
        uses: ./.github/actions/workflow/failure-issue
        with:
          conclusion: ${{ steps.tests.outputs.failed == 'true' && 'failure' || job.status }}
          needs: ${{ steps.tests.outputs.needs }}
          # Read by the E2E gate (.github/workflows/e2e-gate.yaml).
          labels: e2e-failure${{ steps.plan.outputs.full-matrix == 'true' && ',full-matrix' || '' }}
          note: |
            ${{ steps.plan.outputs.note }}

            ### Clearing the E2E Gate

            While this issue is open, every open pull request to `${{ github.ref_name }}` shows a red **E2E Gate** status, except those with the `e2e-gate-bypass` label. It turns green on all of them, without a push, as soon as one of these happens:

            - The Tests workflow passes on `${{ github.ref_name }}`. That happens on the next scheduled run after a new commit lands, or right away by re-running the failed jobs of the run above, or with [Run workflow](${{ github.server_url }}/${{ github.repository }}/actions/workflows/check-tests.yaml) on `${{ github.ref_name }}` when the fix landed in another repository.
            - A maintainer closes this issue.
