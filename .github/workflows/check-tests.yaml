# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Tests

# The E2E scheduler (.github/workflows/e2e-scheduler.yaml) and the batch job
# below find the matrix of a run by the suffix of this name. Keep the suffix
# when you change it.
run-name: Tests on ${{ github.ref_name }} (${{ inputs.matrix || 'full' }})

permissions: {}

# The suite doesn't run on push. The E2E scheduler starts it with
# workflow_dispatch on main and the supported release branches, so each run
# tests a batch of commits. You can also start it by hand, for example after a
# fix landed in kyverno/policies or kyverno/sdk. On main and release branches a
# dispatched run updates the tracking issue, which clears the E2E gate.
on:
  workflow_dispatch:
    inputs:
      matrix:
        description: 'Kubernetes versions to test: full runs every supported version, reduced runs only the oldest and the latest one'
        type: choice
        options:
          - full
          - reduced
        default: full
  # A called run belongs to the calling workflow, so it doesn't update the
  # tracking issue or the E2E gate: both follow runs of this workflow only.
  workflow_call:
    inputs:
      matrix:
        description: 'Kubernetes versions to test: full or reduced'
        type: string
        default: full

concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Build test images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: ./.github/actions/go/setup
      - name: Install Ko
        uses: ./.github/actions/tools/ko
      - name: Build
        shell: bash
        run: |
          set -e
          VERSION=${{ github.ref_name }} make docker-save-image-all
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kyverno.tar
          path: kyverno.tar
          if-no-files-found: error

  cli:
    name: Build test CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: ./.github/actions/go/setup
      - name: Build
        shell: bash
        run: |
          set -e
          VERSION=${{ github.ref_name }} make build-cli
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kubectl-kyverno
          path: cmd/cli/kubectl-kyverno/kubectl-kyverno
          if-no-files-found: error

  conformance-tests:
    name: Conformance tests
    needs:
      - images
      - cli
    permissions:
      packages: read
    uses: ./.github/workflows/tests-conformance.yaml
    with:
      matrix: ${{ inputs.matrix || 'full' }}

  conformance-policy-library-tests:
    name: Conformance tests (policy library)
    needs:
      - images
      - cli
    uses: ./.github/workflows/tests-conformance-policy-library.yaml

  k6-tests:
    name: K6 tests
    needs:
      - images
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/tests-k6.yaml

  perf:
    name: Performance benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: ./.github/actions/go/setup
        with:
          gobuild-cache-prefix: gobuild-unit-tests
          gobuild-cache-include-run-id: 'true'
      - name: Check performance regression
        run: make check-perf

  # Lists the commits this run tests for the first time: those since the last
  # green run on this branch that covers this matrix. When the run fails, the
  # suspects are in this range. The list goes to the run summary and, through
  # the job outputs, to the tracking issue that sync-issue maintains. A failure
  # here must not mark the run as failed or decide the tracking issue, which
  # reads the result of every job it needs. So the step continues on error and
  # times out well before the job does: a step timeout counts as a step
  # failure, which continue-on-error absorbs, while a job timeout fails the
  # job.
  batch:
    name: Batch summary
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-')
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      # actions: the job lists the runs of this workflow
      actions: read
      contents: read
      pull-requests: read
    outputs:
      markdown: ${{ steps.summarize.outputs.markdown }}
      compare-url: ${{ steps.summarize.outputs.compare-url }}
      # Space-separated logins of the authors of the batch's merged pull
      # requests, which the tracking issue mentions when it is opened.
      pr-authors: ${{ steps.summarize.outputs.pr-authors }}
    steps:
      - name: Summarize batch
        id: summarize
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MATRIX: ${{ inputs.matrix || 'full' }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = context.ref.replace(/^refs\/heads\//, '');
            const head = context.sha;
            const matrix = process.env.MATRIX;
            const MAX_COMMITS = 100;

            // Runs from before the matrix input existed have no suffix; they
            // always ran the full matrix.
            const matrixOf = r =>
              (/\((full|reduced)\)$/.exec(r.display_title || '') || [])[1] || 'full';
            // A green full run also covers the reduced matrix.
            const covers = r => matrix === 'reduced' || matrixOf(r) === matrix;

            // Commit titles and names come from contributors: keep them from
            // breaking the table, injecting HTML, or mentioning people once
            // the list is posted to an issue.
            // Backslashes go first: otherwise a title with `\|` would escape
            // the added backslash and leave the pipe as a cell delimiter.
            const escapeCell = s => s
              .replace(/\\/g, '\\\\')
              .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
              .replace(/\|/g, '\\|').replace(/@/g, '@&#8203;');

            /** @returns {Promise<{ markdown: string, compareUrl?: string, prAuthors?: string[] }>} */
            async function describeBatch() {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner, repo, workflow_id: 'check-tests.yaml', branch, status: 'success', per_page: 100
              }, (response, done) => {
                const found = response.data.filter(r => r.id !== context.runId && covers(r));
                if (found.length > 0) done();
                return found;
              });
              const lastGreen = runs[0];
              if (!lastGreen) {
                return { markdown: `No earlier green ${matrix} run on \`${branch}\`, so the batch range is unknown.` };
              }
              const base = lastGreen.head_sha;
              if (base === head) {
                return { markdown: `The [last green run](${lastGreen.html_url}) tested the same commit \`${head.slice(0, 9)}\`.` };
              }

              const commits = await github.paginate(github.rest.repos.compareCommitsWithBasehead, {
                owner, repo, basehead: `${base}...${head}`, per_page: 100
              }, response => response.data.commits);
              const compareUrl = `${context.serverUrl}/${owner}/${repo}/compare/${base}...${head}`;

              // When runs failed since the last green one, the range spans
              // several runs. Mark the commits that the previous run, of
              // either matrix, did not test, so that a reader sees both what
              // is new in this run and everything since the last green run.
              const { data: { workflow_runs: recent } } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: 'check-tests.yaml', branch, status: 'completed', per_page: 20
              });
              const previous = recent.find(r => r.id !== context.runId &&
                r.run_number < context.runNumber && ['success', 'failure'].includes(r.conclusion));
              const previousAt = previous ? commits.findIndex(c => c.sha === previous.head_sha) : -1;

              const shown = commits.map((c, i) => ({ c, isNew: previousAt >= 0 && i > previousAt }))
                .slice(-MAX_COMMITS).reverse();
              const rows = [];
              const authors = new Set();
              // Only people: a bot such as Dependabot can't be notified.
              const prAuthors = new Set();
              for (const { c, isNew } of shown) {
                let prs = [];
                try {
                  ({ data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                    owner, repo, commit_sha: c.sha
                  }));
                } catch (err) {
                  core.warning(`Could not list pull requests for ${c.sha} (${err.message || String(err)}).`);
                }
                const merged = prs.filter(p => p.merged_at && p.base.ref === branch);
                const login = merged[0]?.user?.login || c.author?.login;
                if (login) authors.add(login);
                const prAuthor = merged[0]?.user;
                if (prAuthor?.login && prAuthor.type !== 'Bot' && !prAuthor.login.endsWith('[bot]')) {
                  prAuthors.add(prAuthor.login);
                }
                const cells = [
                  `[\`${c.sha.slice(0, 9)}\`](${c.html_url})`,
                  merged.map(p => `[#${p.number}](${p.html_url})`).join(', ') || '—',
                  escapeCell(login || c.commit.author?.name || '—'),
                  escapeCell(c.commit.message.split('\n')[0] || ''),
                ];
                if (previousAt >= 0) cells.push(isNew ? 'yes' : '');
                rows.push(`| ${cells.join(' | ')} |`);
              }

              const range = `${base.slice(0, 9)}..${head.slice(0, 9)}`;
              const lines = [
                `Commits since the [last green run](${lastGreen.html_url}): [\`${range}\`](${compareUrl}) (${commits.length} commits).`,
              ];
              if (previousAt >= 0) {
                const fresh = commits.length - previousAt - 1;
                lines.push('', `The [previous run](${previous.html_url}) tested \`${previous.head_sha.slice(0, 9)}\` (${previous.conclusion}). ${fresh} of these commits are new in this run.`);
              }
              if (commits.length > shown.length) {
                lines.push('', `Only the latest ${shown.length} are listed.`);
              }
              lines.push(
                '',
                `Authors: ${[...authors].sort().map(escapeCell).join(', ') || '—'}`,
                '',
                previousAt >= 0
                  ? '| Commit | Pull request | Author | Title | New in this run |\n| --- | --- | --- | --- | --- |'
                  : '| Commit | Pull request | Author | Title |\n| --- | --- | --- | --- |',
                ...rows,
              );
              return { markdown: lines.join('\n'), compareUrl, prAuthors: [...prAuthors].sort() };
            }

            const { markdown, compareUrl, prAuthors = [] } = await describeBatch();
            core.setOutput('markdown', markdown);
            core.setOutput('compare-url', compareUrl || '');
            core.setOutput('pr-authors', prAuthors.join(' '));
            await core.summary
              .addHeading(`Batch on ${branch} (${matrix} matrix)`, 2)
              .addRaw(markdown, true)
              .write();

  # Groups the chainsaw reports of all conformance jobs into one table in the
  # run summary: each failing test with its failing Kubernetes versions, job
  # links, and first error. Runs even when the tests failed, and again in a
  # re-run attempt, where the re-run jobs replace their reports. Informational
  # only, so sync-issue doesn't wait for it.
  summarize:
    name: Summarize E2E failures
    if: always() && needs.conformance-tests.result != 'skipped'
    needs:
      - conformance-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/e2e
      - name: Download reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-reports-*
          path: e2e-reports
      - name: Summarize
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/e2e/report.py summarize e2e-reports --run-url "$RUN_URL" >> "$GITHUB_STEP_SUMMARY"

  # Labels the tracking issue full-matrix when this full run failed on a
  # Kubernetes version that a reduced run doesn't test: any version between
  # the oldest and the latest. A green reduced run then leaves the issue open
  # (see the "Keep full-matrix failures open" step of sync-issue), so the E2E
  # gate stays red until a green full run or a maintainer closes it. When a
  # later full run fails only where a reduced run also tests, the label is
  # removed again. The job acts only if the issue shows this run, so a run
  # whose result sync-issue deferred or ignored changes nothing.
  full-matrix-label:
    name: Label full-matrix failures
    if: >-
      always() &&
      needs.sync-issue.result == 'success' &&
      (inputs.matrix || 'full') == 'full'
    needs:
      - sync-issue
    permissions:
      # actions: the job lists the failed jobs of this run
      actions: read
      issues: write
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Label full-matrix failures
        # A failure here must not turn a green run red: the scheduler and the
        # batch job look for green runs, and tests-rerun re-runs failed ones.
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # The name of the conformance-tests job, which prefixes the names of
          # its matrix jobs.
          CONFORMANCE_JOB: Conformance tests
        with:
          script: |
            const { owner, repo } = context.repo;
            const LABEL = 'full-matrix';
            const marker = `<!-- workflow-failure:${context.workflow}:${context.ref} -->`;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const labelsOf = i => i.labels.map(l => (typeof l === 'string' ? l : l.name));

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'e2e-failure', per_page: 100
            });
            // The body links the run that last updated the issue.
            const issue = issues.find(i => !i.pull_request && i.body && i.body.includes(marker) &&
              i.body.includes(`(${runUrl})`));
            if (!issue) {
              core.info('No open tracking issue shows this run; nothing to label.');
              return;
            }

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: context.runId, filter: 'latest', per_page: 100
            });
            const prefix = `${process.env.CONFORMANCE_JOB} / `;
            const minorOf = name => {
              const m = /\bv1\.(\d+)\.\d+\b/.exec(name);
              return m ? Number(m[1]) : null;
            };
            const conformance = jobs.filter(j => j.name.startsWith(prefix) && minorOf(j.name) !== null);
            if (conformance.length === 0) {
              core.warning('Found no conformance jobs with a Kubernetes version in their name; leaving the labels as they are.');
              return;
            }
            // The reduced matrix tests the oldest and the latest version.
            const minors = conformance.map(j => minorOf(j.name));
            const oldest = Math.min(...minors);
            const latest = Math.max(...minors);
            const fullOnly = conformance.filter(j =>
              j.status === 'completed' && j.conclusion === 'failure' &&
              minorOf(j.name) !== oldest && minorOf(j.name) !== latest);
            const labelled = labelsOf(issue).includes(LABEL);

            if (fullOnly.length > 0) {
              if (labelled) {
                core.info(`Issue #${issue.number} already has the ${LABEL} label.`);
                return;
              }
              // addLabels creates a missing label without a description, so
              // create it first. It fails with 422 when the label exists.
              try {
                await github.rest.issues.createLabel({
                  owner, repo, name: LABEL, color: 'd93f0b',
                  description: 'E2E failure that only the full Kubernetes matrix tests'
                });
              } catch (err) {
                if (err.status !== 422) {
                  core.warning(`Could not create the ${LABEL} label (${err.message || String(err)}).`);
                }
              }
              await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: [LABEL] });
              const versions = [...new Set(fullOnly.map(j => minorOf(j.name)))]
                .sort((a, b) => a - b).map(m => `v1.${m}`).join(', ');
              const MAX_JOBS = 10;
              const names = fullOnly.slice(0, MAX_JOBS).map(j => `- [\`${j.name}\`](${j.html_url})`);
              const more = fullOnly.length > MAX_JOBS ? [`- …and ${fullOnly.length - MAX_JOBS} more`] : [];
              const dispatchUrl = `${context.serverUrl}/${owner}/${repo}/actions/workflows/check-tests.yaml`;
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: [
                  `The [full run](${runUrl}) failed on Kubernetes ${versions}, which the reduced runs don't test:`,
                  '',
                  ...names,
                  ...more,
                  '',
                  `So this issue has the \`${LABEL}\` label, and a green reduced run leaves it open. The next green full run closes it: the nightly one, or one that you start with [Run workflow](${dispatchUrl}) and the \`full\` matrix. A maintainer can also close it.`,
                ].join('\n')
              });
              core.info(`Labelled issue #${issue.number} ${LABEL} (${versions}).`);
            } else if (labelled) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: LABEL });
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `The [full run](${runUrl}) failed only on what the reduced runs also test, so this issue no longer has the \`${LABEL}\` label, and a green reduced run closes it.`
              });
              core.info(`Removed the ${LABEL} label from issue #${issue.number}.`);
            }

  # A run that was cancelled without a failure says nothing about the tests:
  # it must neither close the tracking issue nor open one, so the issue is
  # left as it is. A failure is still recorded even if other jobs were then
  # cancelled.
  sync-issue:
    if: >-
      always() &&
      (contains(needs.*.result, 'failure') || !contains(needs.*.result, 'cancelled')) &&
      github.workflow == 'Tests' && github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-'))
    needs:
      # batch: for the commits this run tests. It finishes long before the
      # tests do, and its step continues on error and times out before the
      # job, so its result is success unless the whole run is cancelled.
      - batch
      - images
      - cli
      - conformance-tests
      - conformance-policy-library-tests
      - k6-tests
      - perf
    permissions:
      issues: write
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A failed first attempt is re-run once by tests-rerun.yaml, which looks
      # for this step by name. The second attempt re-runs this job even though
      # it succeeded, because it depends on the failed jobs ("When you re-run
      # failed jobs or a specific job, GitHub also re-runs the jobs that depend
      # on them"), and then updates the tracking issue. So a flaky test doesn't
      # turn the E2E gate red.
      # Runs with a cancelled job aren't re-run, so they update the issue now.
      # Neither do runs started with GITHUB_TOKEN: when they finish, GitHub
      # doesn't start tests-rerun.yaml, so no re-run would ever come.
      - name: Defer to the automatic re-run
        id: defer
        if: >-
          github.repository == 'kyverno/kyverno' &&
          github.workflow == 'Tests' &&
          github.run_attempt == '1' &&
          github.triggering_actor != 'github-actions[bot]' &&
          contains(needs.*.result, 'failure') &&
          !contains(needs.*.result, 'cancelled')
        run: |
          echo "deferred=true" >> "$GITHUB_OUTPUT"
          echo "::notice::This first attempt failed. The Tests re-run workflow re-runs the failed jobs once, and the second attempt updates the tracking issue."
      # A reduced run tests only the oldest and the latest Kubernetes version.
      # When the tracking issue has the full-matrix label, the last full run
      # failed on a version in between, which a reduced run doesn't test. So
      # a green reduced run leaves that issue open; a green full run or a
      # maintainer closes it. If the check fails, the run updates the issue
      # as it did before the label existed.
      - name: Keep full-matrix failures open
        id: full-matrix-open
        continue-on-error: true
        if: >-
          steps.defer.outputs.deferred != 'true' &&
          (inputs.matrix || 'full') == 'reduced' &&
          !contains(needs.*.result, 'failure')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const marker = `<!-- workflow-failure:${context.workflow}:${context.ref} -->`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'e2e-failure', per_page: 100
            });
            const issue = issues.find(i => !i.pull_request && i.body && i.body.includes(marker) &&
              i.labels.some(l => (typeof l === 'string' ? l : l.name) === 'full-matrix'));
            if (issue) {
              core.setOutput('skip', 'true');
              core.notice(`Issue #${issue.number} tracks a failure that only the full matrix tests, so this reduced run leaves it open. A green full run closes it.`);
            }
      - name: Sync issue
        if: steps.defer.outputs.deferred != 'true' && steps.full-matrix-open.outputs.skip != 'true'
        uses: ./.github/actions/workflow/failure-issue
        with:
          conclusion: ${{ contains(needs.*.result, 'failure') && 'failure' || job.status }}
          needs: ${{ toJSON(needs) }}
          commits: ${{ needs.batch.outputs.markdown }}
          commits-url: ${{ needs.batch.outputs.compare-url }}
          mentions: ${{ needs.batch.outputs.pr-authors }}
          # Read by the E2E gate (.github/workflows/e2e-gate.yaml).
          labels: e2e-failure
          note: |
            ### Clearing the E2E Gate

            While this issue is open, every open pull request to `${{ github.ref_name }}` shows a red **E2E Gate** status, except those with the `e2e-gate-bypass` label. It turns green on all of them, without a push, as soon as one of these happens:

            - The Tests workflow passes on `${{ github.ref_name }}`. That happens on the next scheduled run after a new commit lands, or right away by re-running the failed jobs of the run above, or with [Run workflow](${{ github.server_url }}/${{ github.repository }}/actions/workflows/check-tests.yaml) on `${{ github.ref_name }}` when the fix landed in another repository.
            - A maintainer closes this issue.
