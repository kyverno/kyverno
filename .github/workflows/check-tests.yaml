# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Tests

permissions: {}

on:
  push:
    branches:
      - main
      - release-*
  # Re-runs the suite on the latest commit without a push, e.g. after a fix
  # landed in kyverno/policies or kyverno/sdk. On main and release branches it
  # updates the tracking issue like a push run, which clears the E2E gate.
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Build test images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: ./.github/actions/go/setup
      - name: Install Ko
        uses: ./.github/actions/tools/ko
      - name: Build
        shell: bash
        run: |
          set -e
          VERSION=${{ github.ref_name }} make docker-save-image-all
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kyverno.tar
          path: kyverno.tar
          if-no-files-found: error

  cli:
    name: Build test CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: ./.github/actions/go/setup
      - name: Build
        shell: bash
        run: |
          set -e
          VERSION=${{ github.ref_name }} make build-cli
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kubectl-kyverno
          path: cmd/cli/kubectl-kyverno/kubectl-kyverno
          if-no-files-found: error

  conformance-tests:
    name: Conformance tests
    needs:
      - images
      - cli
    permissions:
      packages: read
    uses: ./.github/workflows/tests-conformance.yaml

  conformance-policy-library-tests:
    name: Conformance tests (policy library)
    needs:
      - images
      - cli
    uses: ./.github/workflows/tests-conformance-policy-library.yaml

  k6-tests:
    name: K6 tests
    needs:
      - images
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/tests-k6.yaml

  perf:
    name: Performance benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: ./.github/actions/go/setup
        with:
          gobuild-cache-prefix: gobuild-unit-tests
          gobuild-cache-include-run-id: 'true'
      - name: Check performance regression
        # On the step, not only the job: a step that times out fails the job,
        # which sync-issue records. A job that times out counts as cancelled,
        # which sync-issue skips.
        timeout-minutes: 15
        run: make check-perf

  # A run that was cancelled without a failure says nothing about the tests:
  # it must neither close the tracking issue nor open one, so the issue is
  # left as it is. A failure is still recorded even if other jobs were then
  # cancelled.
  sync-issue:
    if: >-
      always() &&
      (contains(needs.*.result, 'failure') || !contains(needs.*.result, 'cancelled')) &&
      (github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-'))))
    needs:
      - images
      - cli
      - conformance-tests
      - conformance-policy-library-tests
      - k6-tests
      - perf
    permissions:
      issues: write
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sync issue
        uses: ./.github/actions/workflow/failure-issue
        with:
          conclusion: ${{ contains(needs.*.result, 'failure') && 'failure' || job.status }}
          needs: ${{ toJSON(needs) }}
          # Read by the E2E gate (.github/workflows/e2e-gate.yaml).
          labels: e2e-failure
          # Results for older commits (late runs, re-runs) must not overrule
          # the newest one: the E2E gate turns every PR green or red on it.
          latest-commit-only: 'true'
          note: |
            ### Clearing the E2E Gate

            While this issue is open, every open pull request to `${{ github.ref_name }}` shows a red **E2E Gate** status, except those with the `e2e-gate-bypass` label ([list the blocked pull requests](${{ github.server_url }}/${{ github.repository }}/pulls?q=is%3Apr+is%3Aopen+base%3A${{ github.ref_name }}+-label%3Ae2e-gate-bypass)). The failure is on `${{ github.ref_name }}`, not in those pull requests. They all turn green, without a push, as soon as one of these happens:

            - The Tests workflow passes on the latest commit of `${{ github.ref_name }}`. That happens on the next push, or right away with [Run workflow](${{ github.server_url }}/${{ github.repository }}/actions/workflows/check-tests.yaml) on `${{ github.ref_name }}`. Re-running the failed jobs of the run above also works, but only while its commit is still the latest on `${{ github.ref_name }}`: results for older commits are ignored.
            - A maintainer closes this issue. If `${{ github.ref_name }}` is still failing, the next failing run opens a new one.
