# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Fixes a failing check on a Dependabot PR by asking CodeRabbit (`@coderabbitai fix-ci commit`), capped per-check
# and per-PR. Labels `ready-for-review` once everything's green. Merge conflicts are handled separately by
# dependabot-rebase-on-conflict.yaml.

name: "Dependabot autofix"

permissions: {}

env:
  PER_CHECK_ATTEMPT_CAP: 2
  GLOBAL_ATTEMPT_CAP: 5

on:
  workflow_run:
    types:
      - completed
    workflows:
      - "Unit tests"
      - "CLI"
      - "Go"
      - "Go format"
      - "Go vet"
      - "Go imports"
      - "Go packages"
      - "Codegen"
      - "Chart-testing"
      - "Artifact Hub"
      - "Actions"
      - "Devcontainer"
      - "framework tests (envtest)"

concurrency:
  group: dependabot-autofix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  fix-if-needed:
    name: Ask CodeRabbit to fix a failing check
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      CHECK_NAME: ${{ github.event.workflow_run.name }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Resolve the PR this run belongs to
        id: pr
        run: |
          set -euo pipefail
          number=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.pull_requests[0].number // empty')
          if [[ -z "$number" ]]; then
            echo "No same-repo PR associated with this run — nothing to fix here."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Classify the dependency bump (patch/minor/major)
        id: bump
        if: steps.pr.outputs.skip == 'false'
        run: |
          set -euo pipefail
          pr="${{ steps.pr.outputs.number }}"

          # Dependabot's own commit trailer already says which semver level this is.
          commit_message=$(gh pr view "$pr" --repo "${GITHUB_REPOSITORY}" --json commits --jq '.commits[-1].messageBody')

          level=patch
          if grep -q 'update-type: version-update:semver-major' <<< "$commit_message"; then
            level=major
          elif grep -q 'update-type: version-update:semver-minor' <<< "$commit_message"; then
            level=minor
          fi

          if [[ "$level" == "major" ]]; then
            gh pr edit "$pr" --repo "${GITHUB_REPOSITORY}" --add-label "needs-human-review"
            marker="<!-- dependabot-autofix: major-bump-skip $HEAD_SHA -->"
            existing_comments=$(gh pr view "$pr" --repo "${GITHUB_REPOSITORY}" --json comments --jq '.comments[].body')
            if ! grep -qF -- "$marker" <<< "$existing_comments"; then
              gh pr comment "$pr" --repo "${GITHUB_REPOSITORY}" --body "$marker
          Major-semver bump — \`needs-human-review\` stays even once CI is green."
            fi
          fi

      - name: Claim this check or back off, then ask CodeRabbit to fix it
        if: steps.pr.outputs.skip == 'false'
        run: |
          set -euo pipefail
          pr="${{ steps.pr.outputs.number }}"

          existing_comments=$(gh pr view "$pr" --repo "${GITHUB_REPOSITORY}" --json comments --jq '.comments[].body')

          marker="<!-- dependabot-autofix: check=\"$CHECK_NAME\" sha=\"$HEAD_SHA\" -->"
          if grep -qF -- "$marker" <<< "$existing_comments"; then
            echo "Already asked CodeRabbit about $CHECK_NAME @ $HEAD_SHA — skipping."
            exit 0
          fi

          # Per-check cap: this exact check has already failed-and-been-attempted this many times.
          check_attempts=$(grep -cF -- "check=\"$CHECK_NAME\"" <<< "$existing_comments" || true)
          # Global cap: total autofix attempts on this PR, across every check, so one flaky check can't alone
          # burn the whole budget but the PR as a whole still has a hard ceiling.
          total_attempts=$(grep -cF -- 'dependabot-autofix: check="' <<< "$existing_comments" || true)

          if [[ "$check_attempts" -ge "$PER_CHECK_ATTEMPT_CAP" || "$total_attempts" -ge "$GLOBAL_ATTEMPT_CAP" ]]; then
            reason="\`$CHECK_NAME\` has failed $check_attempts autofix attempts"
            [[ "$total_attempts" -ge "$GLOBAL_ATTEMPT_CAP" ]] && reason="this PR has hit $total_attempts total autofix attempts across all checks"
            echo "Cap hit ($reason) — leaving it for a human from here."
            gh pr edit "$pr" --repo "${GITHUB_REPOSITORY}" --add-label "needs-human-review"
            gh pr comment "$pr" --repo "${GITHUB_REPOSITORY}" --body "CodeRabbit autofix is giving up: $reason. Needs a human from here."
            exit 0
          fi

          # Claim comment first, then the actual summon — matches the Copilot-CLI design's "claim before work
          # starts" ordering, though here there's no separate result to edit back in: CodeRabbit reports its own
          # outcome on the PR once it acts, and report-ready (below) picks up the eventual green state.
          gh pr comment "$pr" --repo "${GITHUB_REPOSITORY}" --body "$marker
          🐰 \`$CHECK_NAME\` failed — asking CodeRabbit to fix it directly on this branch.

          @coderabbitai fix-ci commit"

  report-ready:
    name: Label the PR ready once every check is green
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Check whether every check is green and label accordingly
        run: |
          set -euo pipefail
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.pull_requests[0].number // empty')
          if [[ -z "$pr" ]]; then
            echo "No same-repo PR associated with this run."
            exit 0
          fi

          # "bucket" is gh's normalized status (fail/pending/cancel/skipping/success) — unlike raw "state", it
          # correctly counts CANCELLED/TIMED_OUT/STALE/ACTION_REQUIRED as not-green instead of only FAILURE/ERROR.
          not_green=$(gh pr checks "$pr" --repo "${GITHUB_REPOSITORY}" --json bucket \
            --jq '[.[] | select(.bucket == "fail" or .bucket == "pending" or .bucket == "cancel")] | length')
          if [[ "$not_green" != "0" ]]; then
            echo "Still $not_green check(s) not green — not done yet."
            exit 0
          fi

          mergeable_state=$(gh pr view "$pr" --repo "${GITHUB_REPOSITORY}" --json mergeStateStatus --jq '.mergeStateStatus')
          if [[ "$mergeable_state" == "DIRTY" ]]; then
            echo "Still has a merge conflict — dependabot-rebase-on-conflict.yaml handles that, not this job."
            exit 0
          fi

          commit_message=$(gh pr view "$pr" --repo "${GITHUB_REPOSITORY}" --json commits --jq '.commits[-1].messageBody')
          if grep -q 'update-type: version-update:semver-major' <<< "$commit_message"; then
            existing_comments=$(gh pr view "$pr" --repo "${GITHUB_REPOSITORY}" --json comments --jq '.comments[].body')
            marker="<!-- dependabot-autofix: major-bump-green -->"
            if ! grep -qF -- "$marker" <<< "$existing_comments"; then
              gh pr comment "$pr" --repo "${GITHUB_REPOSITORY}" --body "$marker
          All checks are green, but this is still a major-semver bump — leaving \`needs-human-review\` for a maintainer to check for breaking changes."
            fi
            exit 0
          fi

          gh pr edit "$pr" --repo "${GITHUB_REPOSITORY}" --remove-label "needs-human-review" 2>/dev/null || true

          has_ready=$(gh pr view "$pr" --repo "${GITHUB_REPOSITORY}" --json labels --jq '[.labels[].name] | any(. == "ready-for-review")')
          if [[ "$has_ready" == "false" ]]; then
            gh pr edit "$pr" --repo "${GITHUB_REPOSITORY}" --add-label "ready-for-review"
            gh pr comment "$pr" --repo "${GITHUB_REPOSITORY}" --body "All checks are green. Ready for review/merge."
          fi
