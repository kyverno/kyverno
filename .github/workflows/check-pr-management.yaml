# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Check PR management configuration

on:
  pull_request:
    paths:
      - .github/pr-management.json
      - .github/pr-readiness-checks.yml
      - .github/labels.yml
      - .github/workflows/pr-labelling.yaml
      - .github/workflows/pr-readiness-check.yaml
      - .github/workflows/pr-stale-author-action.yaml
      - .github/workflows/sync-label-colors.yaml
      - .github/workflows/check-pr-management.yaml
  push:
    branches: [main]
    paths:
      - .github/pr-management.json
      - .github/pr-readiness-checks.yml
      - .github/labels.yml
      - .github/workflows/pr-*.yaml
      - .github/workflows/sync-label-colors.yaml
      - .github/workflows/check-pr-management.yaml

permissions: {}

jobs:
  validate:
    permissions:
      contents: read
    uses: kyverno/assistant/.github/workflows/pr-management-validate.yml@e2d2f01371144e88e99fdf124e885bf4879c705e
