# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Classifies every open Dependabot PR and marks it — never merges. Major bump or unconfirmed semver level, CI not
# clean, a conflict, or no Copilot approval → needs-review. Confirmed patch/minor + clean + approved →
# ready-for-review. Merging is a separate, human-approved step elsewhere.
#
# Triggers on whichever of CI or Copilot's review settles last, plus a schedule backstop (e.g. a conflict from
# main moving, not from anything happening on the PR itself).

name: "Dependabot merge triage"

permissions: {}

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6,18 * * *"
  pull_request_review:
    types:
      - submitted
  workflow_run:
    types:
      - completed
    workflows:
      - "Unit tests"
      - "CLI"
      - "Go"
      - "Go format"
      - "Go vet"
      - "Go imports"
      - "Go packages"
      - "Codegen"
      - "Chart-testing"
      - "Artifact Hub"
      - "Actions"
      - "Devcontainer"
      - "framework tests (envtest)"

jobs:
  triage:
    name: Classify every open Dependabot PR
    if: >
      github.event_name != 'pull_request_review' ||
      github.event.review.user.login == 'copilot-pull-request-reviewer[bot]'
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Classify and label each Dependabot PR
        run: |
          set -euo pipefail

          numbers=$(gh pr list --repo "${GITHUB_REPOSITORY}" \
            --search "is:pr is:open author:app/dependabot" \
            --json number --jq '.[].number' --limit 1000)

          for pr in $numbers; do
            echo "=== PR #$pr ==="

            commit_message=$(gh pr view "$pr" --repo "${GITHUB_REPOSITORY}" --json commits --jq '.commits[-1].messageBody')
            # Unknown by default — a non-semver dependency (e.g. CalVer) has no update-type trailer at all.
            level=unknown
            if grep -q 'update-type: version-update:semver-major' <<< "$commit_message"; then
              level=major
            elif grep -q 'update-type: version-update:semver-minor' <<< "$commit_message"; then
              level=minor
            elif grep -q 'update-type: version-update:semver-patch' <<< "$commit_message"; then
              level=patch
            fi

            verdict=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/$pr/reviews" --paginate \
              | jq -rs '[.[][] | select(.user.login == "copilot-pull-request-reviewer[bot]")] | last | .body // ""')
            copilot_approved=false
            grep -qF "Approval recommended" <<< "$verdict" && copilot_approved=true

            # gh pr checks exits non-zero on a failing/pending check — don't let set -e kill the loop over it.
            not_green=$(gh pr checks "$pr" --repo "${GITHUB_REPOSITORY}" --json bucket \
              --jq '[.[] | select(.bucket == "fail" or .bucket == "pending" or .bucket == "cancel")] | length') || true

            mergeable_state=$(gh pr view "$pr" --repo "${GITHUB_REPOSITORY}" --json mergeStateStatus --jq '.mergeStateStatus')
            has_conflict=false
            [[ "$mergeable_state" == "DIRTY" ]] && has_conflict=true

            current_labels=$(gh pr view "$pr" --repo "${GITHUB_REPOSITORY}" --json labels --jq '[.labels[].name]')
            has_review_label=$(jq 'any(. == "needs-review")' <<< "$current_labels")
            has_ready_label=$(jq 'any(. == "ready-for-review")' <<< "$current_labels")

            if [[ "$level" == "major" ]]; then
              echo "Major bump — needs-review + major-bump."
              [[ "$has_ready_label" == "true" ]] && gh pr edit "$pr" --repo "${GITHUB_REPOSITORY}" --remove-label "ready-for-review"
              gh pr edit "$pr" --repo "${GITHUB_REPOSITORY}" --add-label "major-bump,needs-review"
            elif [[ "$level" == "unknown" ]]; then
              echo "No semver update-type trailer — can't confirm blast radius, needs-review."
              [[ "$has_ready_label" == "true" ]] && gh pr edit "$pr" --repo "${GITHUB_REPOSITORY}" --remove-label "ready-for-review"
              gh pr edit "$pr" --repo "${GITHUB_REPOSITORY}" --add-label "needs-review"
            elif [[ "$not_green" != "0" || "$has_conflict" == "true" || "$copilot_approved" == "false" ]]; then
              echo "Not clean/approved yet — needs-review."
              [[ "$has_ready_label" == "true" ]] && gh pr edit "$pr" --repo "${GITHUB_REPOSITORY}" --remove-label "ready-for-review"
              gh pr edit "$pr" --repo "${GITHUB_REPOSITORY}" --add-label "needs-review"
            else
              echo "Patch/minor, clean, Copilot approval recommended — ready-for-review."
              [[ "$has_review_label" == "true" ]] && gh pr edit "$pr" --repo "${GITHUB_REPOSITORY}" --remove-label "needs-review"
              [[ "$has_ready_label" == "false" ]] && gh pr edit "$pr" --repo "${GITHUB_REPOSITORY}" --add-label "ready-for-review"
            fi
          done
