# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Sync Label Colors

on:
  push:
    branches: [main]
    paths:
      - .github/labels.yml
      - .github/pr-management.json
      - .github/actions/pr-management/**
      - .github/workflows/sync-label-colors.yaml
  workflow_dispatch:

permissions: {}

jobs:
  sync-labels:
    # The shared workflow holds several jobs, so the caller grants their union; this job's own token is limited to
    # contents: read and issues: write.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
      actions: read
    uses: kyverno/assistant/.github/workflows/pr-management.yml@4560c0ededccc5c3c7fd5a17fcabb90a0d5633a8
    with:
      mode: sync-labels
      dry-run: 'false'
