# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Asks Dependabot to rebase itself when its own PR has the `merge-conflicts` label (applied by the
# `merge-conflicts` job in pr-labelling.yaml, which re-checks open PRs on every push — including a push to main
# that didn't touch the PR itself). `rebase-strategy: disabled` in .github/dependabot.yml only turns off automatic
# rebasing on every base-branch push (costly — it would re-run CI on every open Dependabot PR on every merge to
# main, needed or not); the `@dependabot rebase` comment command works regardless of that setting.
#
# Runs on a schedule rather than `pull_request: labeled`: pr-labelling.yaml applies that label using the default
# GITHUB_TOKEN, and GitHub does not start new workflow runs for events created by GITHUB_TOKEN (confirmed against
# GitHub's own docs — `labeled` isn't among the pull_request types exempted from that rule) — so a label-triggered
# version of this workflow would never actually fire.

name: "Dependabot rebase on conflict"

permissions: {}

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/30 * * * *"

jobs:
  rebase:
    name: Ask Dependabot to rebase any conflicting PR
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Find conflicting Dependabot PRs and comment @dependabot rebase, once per commit
        run: |
          set -euo pipefail

          numbers=$(gh pr list --repo "${GITHUB_REPOSITORY}" \
            --search "is:pr is:open author:app/dependabot label:merge-conflicts" \
            --json number --jq '.[].number')

          for pr in $numbers; do
            sha=$(gh pr view "$pr" --repo "${GITHUB_REPOSITORY}" --json headRefOid --jq '.headRefOid')
            marker="<!-- dependabot-rebase-on-conflict: $sha -->"

            existing_comments=$(gh pr view "$pr" --repo "${GITHUB_REPOSITORY}" --json comments --jq '.comments[].body')
            if grep -qF -- "$marker" <<< "$existing_comments"; then
              echo "PR #$pr: already asked Dependabot to rebase this commit — skipping."
              continue
            fi

            gh pr comment "$pr" --repo "${GITHUB_REPOSITORY}" --body "$marker
          @dependabot rebase"
          done
