# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# E2E tests run after merge, on push to main and release branches (Tests
# workflow), not on pull requests. When they fail, the failure-issue action
# opens a tracking issue labelled e2e-failure. This workflow turns that issue
# into a merge gate: it reports an "E2E Gate" commit status on every open pull
# request, red while an e2e-failure issue is open for the PR's base branch.
#
# To enforce it, mark the "E2E Gate" status as required in branch protection,
# then run this workflow once manually so every open PR gets a status.
#
# The status is set through the API instead of being this job's own result, so
# that it can change without a new push to the PR: when the Tests workflow
# finishes, every open PR to that branch is re-evaluated. The tracking issue is
# opened and closed with GITHUB_TOKEN, which does not trigger workflows, hence
# workflow_run rather than relying on the issues event alone.
#
# - An e2e-failure issue without the failure-issue marker (one labelled by
#   hand) closes the gate for every branch.
# - The e2e-gate-bypass label lets a single PR through, for the PR that fixes
#   the branch.

name: E2E gate

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - labeled
      - unlabeled
  workflow_run:
    workflows:
      - Tests
    types:
      - completed
  issues:
    types:
      - closed
      - reopened
      - labeled
      - unlabeled
  workflow_dispatch: {}

permissions: {}

jobs:
  gate:
    name: Sync E2E Gate status
    # Label events matter only for the two labels the gate reads.
    if: >-
      github.event_name == 'workflow_run' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' &&
        ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
          github.event.label.name == 'e2e-gate-bypass')) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.labels.*.name, 'e2e-failure') ||
          github.event.label.name == 'e2e-failure'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A newer run for the same PR or branch re-reads everything, so it can
    # replace an older one; runs for different branches must not cancel each
    # other half-way through a sweep.
    concurrency:
      group: e2e-gate-${{ github.event.pull_request.number || github.event.workflow_run.head_branch || 'sweep' }}
      cancel-in-progress: true
    permissions:
      issues: read
      pull-requests: read
      statuses: write
    steps:
      # No checkout: under pull_request_target this job holds a write token,
      # so it only talks to the API and never runs code from the PR.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;

            const STATUS_CONTEXT = 'E2E Gate';
            const FAILURE_LABEL = 'e2e-failure';
            const BYPASS_LABEL = 'e2e-gate-bypass';
            const DESCRIPTION_MAX = 140; // commit status API limit
            // GitHub's secondary rate limit allows about 80 content-creating
            // requests a minute; a sweep that flips every open PR stays under it.
            const WRITE_DELAY_MS = 1000;

            /** The branch a failure-issue tracking issue is about, or null. */
            function markerBranch(body) {
              const m = /<!-- workflow-failure:.*:refs\/heads\/(.+?) -->/.exec(body || '');
              return m ? m[1] : null;
            }

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: FAILURE_LABEL, per_page: 100
            });
            // The issues API also returns pull requests carrying the label.
            const blockers = openIssues
              .filter(i => !i.pull_request)
              .map(i => ({ number: i.number, url: i.html_url, branch: markerBranch(i.body) }));
            core.info(`Open ${FAILURE_LABEL} issues: ${blockers.map(b => `#${b.number} (${b.branch || 'all branches'})`).join(', ') || 'none'}`);

            /**
             * @param {{ base: string, labels: string[] }} pr
             */
            function desiredStatus(pr) {
              if (pr.labels.includes(BYPASS_LABEL)) {
                return { state: 'success', description: `Bypassed by the ${BYPASS_LABEL} label` };
              }
              const blocking = blockers.filter(b => b.branch === null || b.branch === pr.base);
              if (blocking.length === 0) {
                return { state: 'success', description: `No open ${FAILURE_LABEL} issue for ${pr.base}` };
              }
              const refs = blocking.map(b => `#${b.number}`).join(', ');
              return {
                state: 'failure',
                description: `E2E tests are failing on ${pr.base}; fix ${refs} first`.slice(0, DESCRIPTION_MAX),
                target_url: blocking[0].url,
              };
            }

            const PR_FIELDS = `
              number
              baseRefName
              labels(first: 100) { nodes { name } }
              commits(last: 1) { nodes { commit {
                oid
                status { context(name: "${STATUS_CONTEXT}") { state description } }
              } } }`;

            function toPr(node) {
              const commit = node.commits.nodes[0].commit;
              const current = commit.status && commit.status.context;
              return {
                number: node.number,
                base: node.baseRefName,
                sha: commit.oid,
                labels: node.labels.nodes.map(l => l.name),
                current: current
                  ? { state: current.state.toLowerCase(), description: current.description }
                  : null,
              };
            }

            /** Open PRs, optionally only those targeting one base branch. */
            async function listOpenPrs(base) {
              const prs = [];
              let cursor = null;
              do {
                const res = await github.graphql(
                  `query($owner: String!, $repo: String!, $base: String, $cursor: String) {
                    repository(owner: $owner, name: $repo) {
                      pullRequests(states: OPEN, baseRefName: $base, first: 100, after: $cursor) {
                        pageInfo { hasNextPage endCursor }
                        nodes { ${PR_FIELDS} }
                      }
                    }
                  }`,
                  { owner, repo, base, cursor }
                );
                const page = res.repository.pullRequests;
                prs.push(...page.nodes.map(toPr));
                cursor = page.pageInfo.hasNextPage ? page.pageInfo.endCursor : null;
              } while (cursor);
              return prs;
            }

            async function getPr(number) {
              const res = await github.graphql(
                `query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) { ${PR_FIELDS} }
                  }
                }`,
                { owner, repo, number }
              );
              return toPr(res.repository.pullRequest);
            }

            let prs;
            if (context.eventName === 'pull_request_target') {
              prs = [await getPr(context.payload.pull_request.number)];
            } else if (context.eventName === 'workflow_run') {
              prs = await listOpenPrs(context.payload.workflow_run.head_branch);
            } else if (context.eventName === 'issues') {
              // null for a hand-labelled issue: it gates every branch.
              prs = await listOpenPrs(markerBranch(context.payload.issue.body));
            } else {
              prs = await listOpenPrs(null);
            }

            let written = 0;
            for (const pr of prs) {
              const want = desiredStatus(pr);
              // Writing only on change keeps the usual sweep, where nothing
              // flipped, down to the read queries above.
              if (pr.current && pr.current.state === want.state && pr.current.description === want.description) {
                continue;
              }
              if (written > 0) {
                await new Promise(resolve => setTimeout(resolve, WRITE_DELAY_MS));
              }
              try {
                await github.rest.repos.createCommitStatus({
                  owner, repo, sha: pr.sha, context: STATUS_CONTEXT, ...want
                });
                written++;
                core.info(`#${pr.number} (${pr.base}): ${want.state} — ${want.description}`);
              } catch (err) {
                core.warning(`Could not set the ${STATUS_CONTEXT} status on #${pr.number} (${err.message || String(err)}).`);
              }
            }
            core.info(`Evaluated ${prs.length} pull request(s), updated ${written}.`);
