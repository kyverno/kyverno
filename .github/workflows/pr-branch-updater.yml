name: PR Branch Auto-Updater

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-branch-updater
  cancel-in-progress: false

jobs:
  update:
    uses: kyverno/.github/.github/workflows/pr-branch-updater.yml@35c75b0d2852af6d2b6c40d00218bc13f82f0260
    with:
      # Use a GitHub App installation token (instead of a PAT) so
      # update-branch can also handle PRs that touch workflow files, even
      # when the PR's fork branch is stale relative to workflows on main
      # (requires workflow write permission). The reusable workflow reads
      # the app secrets from this environment, whose branch rules allow
      # only main.
      environment: pr-updater-app
    # A reusable workflow sees only the secrets its caller passes, even when
    # its job runs in an environment. inherit makes the environment's
    # PR_UPDATER_APP_* secrets visible to the job.
    secrets: inherit
