# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Codegen

permissions: {}

on:
  pull_request:
    branches:
      - main
      - release-*
  push:
    branches:
      - main
      - release-*

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generate-codegen-code:
    name: Generate codegen code (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: api
            target: codegen-api-all
            path: api
          - group: client
            target: codegen-client-all
            path: pkg/client pkg/clients go.mod go.sum
          - group: crds
            target: codegen-crds-manifests
            path: config/crds charts/kyverno/charts/crds cmd/cli/kubectl-kyverno/data/crds .manifest config/install-latest-testing.yaml
          - group: cli-resources
            target: codegen-cli-api-group-resources
            path: cmd/cli/kubectl-kyverno/data/api-group-resources.json
          - group: cli-docs
            target: codegen-cli-docs
            path: docs/user/cli/commands
          - group: helm-docs
            target: codegen-helm-docs
            path: charts
          - group: fix-tests
            target: codegen-fix-all
            path: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: ./.github/actions/go/setup
      - name: Generate code
        env:
          TARGET: ${{ matrix.target }}
        run: |
          start=$SECONDS
          summarize() {
            printf '%s: %ss\n' "$TARGET" "$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"
          }
          trap summarize EXIT
          make "$TARGET"
      - name: Verify codegen is up to date
        env:
          CHECK_PATH: ${{ matrix.path }}
        run: |
          echo "Checking git diff for $CHECK_PATH..."
          git diff --exit-code -- $CHECK_PATH
      - name: Create codegen patch
        if: failure()
        env:
          CHECK_PATH: ${{ matrix.path }}
        run: |
          git diff -- $CHECK_PATH > codegen-code-${{ matrix.group }}.patch
          echo 'Codegen is out of date. Download the codegen-code-${{ matrix.group }}-patch artifact, then run `git apply codegen-code-${{ matrix.group }}.patch` and commit the result.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload codegen patch
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codegen-code-${{ matrix.group }}-patch
          path: codegen-code-${{ matrix.group }}.patch

  verify-codegen-code:
    name: Verify codegen (code)
    if: always()
    needs:
      - generate-codegen-code
    runs-on: ubuntu-slim
    steps:
      - name: Require all code generators to succeed
        env:
          RESULT: ${{ needs.generate-codegen-code.result }}
        run: test "$RESULT" = success

  generate-codegen-docs:
    name: Generate codegen docs (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: api
            target: codegen-api-docs
          - group: cli-api
            target: codegen-cli-api-docs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: ./.github/actions/go/setup
      - name: Generate docs
        env:
          TARGET: ${{ matrix.target }}
        run: |
          start=$SECONDS
          summarize() {
            printf '%s: %ss\n' "$TARGET" "$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"
          }
          trap summarize EXIT
          make "$TARGET"
      - name: Verify codegen is up to date
        run: make verify-codegen
      - name: Create codegen patch
        if: failure()
        run: |
          git diff > codegen-docs-${{ matrix.group }}.patch
          echo 'Codegen is out of date. Download the codegen-docs-${{ matrix.group }}-patch artifact, then run `git apply codegen-docs-${{ matrix.group }}.patch` and commit the result.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload codegen patch
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codegen-docs-${{ matrix.group }}-patch
          path: codegen-docs-${{ matrix.group }}.patch

  verify-codegen-docs:
    name: Verify codegen (docs)
    if: always()
    needs:
      - generate-codegen-docs
    runs-on: ubuntu-slim
    steps:
      - name: Require all docs generators to succeed
        env:
          RESULT: ${{ needs.generate-codegen-docs.result }}
        run: test "$RESULT" = success

  sync-issue:
    if: always() && github.event_name == 'push'
    needs:
      - verify-codegen-code
      - verify-codegen-docs
    permissions:
      issues: write
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sync issue
        uses: ./.github/actions/workflow/failure-issue
        with:
          conclusion: ${{ contains(needs.*.result, 'failure') && 'failure' || job.status }}
          needs: ${{ toJSON(needs) }}
