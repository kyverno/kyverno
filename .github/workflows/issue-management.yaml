name: Issue management

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only preview changes (leave enabled until you have read a preview run)
        type: boolean
        default: true

permissions: {}

# The logic, the trusted checkout and the token live in the shared workflow. A scheduled run is a preview unless the
# variable ISSUE_AUTOMATION_LIVE is true; a manual run follows its checkbox. An issue with an exempt label or a
# milestone is skipped and loses stale-issue.
jobs:
  sweep:
    permissions:
      contents: read
      issues: write
    uses: kyverno/assistant/.github/workflows/issue-management.yml@9e64d868f3a92aebf1409d2c5b1fb35e5fa3a53e
    with:
      dry-run: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run && 'true' || 'false') || 'auto' }}
