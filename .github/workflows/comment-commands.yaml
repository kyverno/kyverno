# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Single entry point for PR and issue comment commands. Ordinary comments match
# no command, so the route job is skipped and no runner starts.
#
# Commands handled here:
#   /cherry-pick <branch>       (PRs, write permission)
#   /conformance                (PRs)
#   /assign, /unassign          (prow, members or 'good first issue')
#   /lgtm, /milestone           (prow)
#
# The prow action matches commands anywhere in the comment body, so the prow
# filters use contains(); the other commands must start the comment.
#
# Comment bodies are untrusted: they are only read through expressions in
# job-level conditions or env, never interpolated into run scripts.

name: Comment commands

permissions: {}

on:
  issue_comment:
    types:
      - created
      - edited

jobs:
  route:
    name: Route comment command
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    if: |
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/cherry-pick')) ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/conformance')) ||
      contains(github.event.comment.body, '/assign') ||
      contains(github.event.comment.body, '/unassign') ||
      contains(github.event.comment.body, '/lgtm') ||
      contains(github.event.comment.body, '/milestone')
    outputs:
      cherry-pick: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body, '/cherry-pick') && 'true' || 'false' }}
      conformance: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body, '/conformance') && 'true' || 'false' }}
      prow-assign: ${{ (contains(github.event.comment.body, '/assign') || contains(github.event.comment.body, '/unassign')) && (contains(fromJson('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.comment.author_association) || contains(github.event.issue.labels.*.name, 'good first issue')) && 'true' || 'false' }}
      prow: ${{ (contains(github.event.comment.body, '/lgtm') || contains(github.event.comment.body, '/milestone')) && 'true' || 'false' }}
    steps:
      - name: Record route
        run: echo "Comment matched a command filter; dependent jobs check the route outputs."

  # /cherry-pick command, only send a message if PR is unmerged, cherry-pick if PR was already merged
  cherry-pick:
    name: Cherry pick
    needs: route
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Holds the PR updater app secrets; its branch rules allow only main.
    environment: pr-updater-app
    if: needs.route.outputs.cherry-pick == 'true'
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: Authorize and validate command
        id: command
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const comment = context.payload.comment;
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo,
              username: comment.user.login
            });
            if (!['write', 'maintain', 'admin'].includes(data.permission)) {
              throw new Error('Cherry-pick commands require repository write permission');
            }
            const match = (comment.body || '').split(/\r?\n/, 1)[0]
              .match(/^\/cherry-pick[ \t]+([A-Za-z0-9][A-Za-z0-9._/-]*)[ \t]*$/);
            if (!match) {
              throw new Error('Expected: /cherry-pick <branch>');
            }
            await github.rest.repos.getBranch({
              ...context.repo,
              branch: match[1]
            });
            core.setOutput('branch', match[1]);

      - name: React to comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            try {
              await github.rest.reactions.createForIssueComment({
                ...context.repo,
                comment_id: context.payload.comment.id,
                content: '+1'
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              core.warning('Comment no longer exists; continuing without a reaction');
            }

      - name: Normalize GitHub App private key
        id: normalize-key
        shell: bash
        env:
          RAW_APP_PRIVATE_KEY: ${{ secrets.PR_UPDATER_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          key="$RAW_APP_PRIVATE_KEY"
          # Support secrets saved with escaped newlines.
          key="${key//\\n/$'\n'}"

          if ! printf '%s' "$key" | grep -Eq 'BEGIN (RSA |EC |)PRIVATE KEY'; then
            # Support secrets saved as base64-encoded PEM.
            decoded="$(printf '%s' "$RAW_APP_PRIVATE_KEY" | tr -d '[:space:]' | base64 --decode 2>/dev/null || true)"
            decoded="${decoded//\\n/$'\n'}"
            if printf '%s' "$decoded" | grep -Eq 'BEGIN (RSA |EC |)PRIVATE KEY'; then
              key="$decoded"
            fi
          fi

          if ! printf '%s' "$key" | grep -Eq 'BEGIN (RSA |EC |)PRIVATE KEY'; then
            echo "PR_UPDATER_APP_PRIVATE_KEY does not look like a valid PEM private key." >&2
            exit 1
          fi

          # ::add-mask:: is line-based, mask each line of the key individually.
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done <<< "$key"
          {
            echo "private_key<<EOF"
            printf '%s\n' "$key"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PR_UPDATER_APP_CLIENT_ID }}
          private-key: ${{ steps.normalize-key.outputs.private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Check if PR is merged
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: check-merged
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            return {
              merged: pr.data.merged,
              state: pr.data.state,
              mergeCommit: pr.data.merge_commit_sha
            };

      - name: Comment PR Unmerged
        if: ${{ fromJSON(steps.check-merged.outputs.result).merged == false && fromJSON(steps.check-merged.outputs.result).state != 'closed' }}
        uses: ben-z/actions-comment-on-issue@402eb412a8f396be0d4ac52a823ec7121206cc26 # v1.0.3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          message: |
            Commits from this PR will automatically be cherry-picked once this PR gets merged.

      - name: Checkout repository
        if: fromJSON(steps.check-merged.outputs.result).merged == true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Cherry Pick
        if: fromJSON(steps.check-merged.outputs.result).merged == true
        uses: ./.github/actions/git/cherry-pick
        continue-on-error: true # Send failure comment to PR
        id: cherry-pick
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          source-pr: ${{ github.event.issue.number }}
          source-pr-title: ${{ github.event.issue.title }}
          target-branches: ${{ steps.command.outputs.branch }}
          merge-commit: ${{ fromJson(steps.check-merged.outputs.result).mergeCommit }}

      - name: Comment Cherry-pick Fail
        if: ${{ !cancelled() && steps.command.outcome == 'success' && (failure() || steps.cherry-pick.outcome == 'failure' || steps.cherry-pick.outputs.success == 'false') }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET_BRANCH: ${{ steps.command.outputs.branch }}
          FAILURE_STAGE: ${{ steps.normalize-key.outcome == 'failure' && 'private-key validation' || steps.app-token.outcome == 'failure' && 'App token creation' || steps.check-merged.outcome == 'failure' && 'source PR lookup' || steps.cherry-pick.outcome == 'failure' && 'cherry-pick, push, or PR creation' || 'workflow setup' }}
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Cherry-pick to \`${process.env.TARGET_BRANCH}\` failed in: ${process.env.FAILURE_STAGE}. See [workflow logs](${run}).`;
            await core.summary.addHeading('Cherry-pick failed').addRaw(body).write();
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Fail on unsuccessful cherry-pick
        if: ${{ !cancelled() && (steps.cherry-pick.outcome == 'failure' || steps.cherry-pick.outputs.success == 'false') }}
        run: |
          echo "::error::Cherry-pick failed; see the workflow logs"
          exit 1

  # Only the reaction needs write access; build and test jobs remain read-only.
  conformance-acknowledge:
    name: Acknowledge conformance request
    needs: route
    runs-on: ubuntu-latest
    if: needs.route.outputs.conformance == 'true'
    permissions:
      issues: write
    steps:
      - name: React to comment
        uses: dkershner6/reaction-action@97ede302a1b145b3739dec3ca84a489a34ef48b5 # v2.2.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          reaction: "+1"

  conformance-images:
    name: Build test images
    needs: route
    runs-on: ubuntu-latest
    if: needs.route.outputs.conformance == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: ./.github/actions/go/setup
      - name: Install Ko
        uses: ./.github/actions/tools/ko
      - name: Build
        shell: bash
        run: |
          set -e
          VERSION=${{ github.ref_name }} make docker-save-image-all
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kyverno.tar
          path: kyverno.tar
          if-no-files-found: error

  conformance-cli:
    name: Build test CLI
    needs: route
    runs-on: ubuntu-latest
    if: needs.route.outputs.conformance == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: ./.github/actions/go/setup
      - name: Build
        shell: bash
        run: |
          set -e
          VERSION=${{ github.ref_name }} make build-cli
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kubectl-kyverno
          path: cmd/cli/kubectl-kyverno/kubectl-kyverno
          if-no-files-found: error

  conformance-tests:
    name: Conformance tests
    needs:
      - route
      - conformance-images
      - conformance-cli
    if: needs.route.outputs.conformance == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/tests-conformance.yaml

  prow-assign:
    name: Prow Assign
    needs: route
    # Non-members can self-assign issues labeled 'good first issue' only.
    # Org members, owners, and collaborators can (un)assign anywhere.
    if: needs.route.outputs.prow-assign == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: jpmcb/prow-github-actions@c44ac3a57d67639e39e4a4988b52049ef45b80dd # v2.0.0
        with:
          prow-commands: "/assign
            /unassign"
          github-token: "${{ secrets.GITHUB_TOKEN }}"

  prow:
    name: Prow
    needs: route
    if: needs.route.outputs.prow == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: jpmcb/prow-github-actions@c44ac3a57d67639e39e4a4988b52049ef45b80dd # v2.0.0
        with:
          prow-commands: "/lgtm
            /milestone"
          github-token: "${{ secrets.GITHUB_TOKEN }}"
