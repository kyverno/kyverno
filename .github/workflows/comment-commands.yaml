# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Single entry point for PR and issue comment commands. Ordinary comments match
# no command, so the route job is skipped and no runner starts.
#
# Commands handled here:
#   /cherry-pick <branch>       (PRs, write permission)
#   /conformance [<suite> | <suite>/<regex> | <regex>] [<k8s-version>]
#                               (PRs, write permission)
#   /assign, /unassign          (prow, members or 'good first issue')
#   /lgtm, /milestone           (prow)
#
# The prow action matches commands anywhere in the comment body, so the prow
# filters use contains(); the other commands must start the comment. Comments
# by bots never reach prow: review bots quote commands such as /lgtm in their
# summaries, and prow would then reply that the bot can't apply the label.
#
# Comment bodies are untrusted: they are only read through expressions in
# job-level conditions or env, never interpolated into run scripts.

name: Comment commands

permissions: {}

on:
  issue_comment:
    types:
      - created
      - edited

jobs:
  route:
    name: Route comment command
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    if: |
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/cherry-pick')) ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/conformance')) ||
      (github.event.comment.user.type != 'Bot' && (
        contains(github.event.comment.body, '/assign') ||
        contains(github.event.comment.body, '/unassign') ||
        contains(github.event.comment.body, '/lgtm') ||
        contains(github.event.comment.body, '/milestone')))
    outputs:
      cherry-pick: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body, '/cherry-pick') && 'true' || 'false' }}
      conformance: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body, '/conformance') && 'true' || 'false' }}
      prow-assign: ${{ github.event.comment.user.type != 'Bot' && (contains(github.event.comment.body, '/assign') || contains(github.event.comment.body, '/unassign')) && (contains(fromJson('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.comment.author_association) || contains(github.event.issue.labels.*.name, 'good first issue')) && 'true' || 'false' }}
      prow: ${{ github.event.comment.user.type != 'Bot' && (contains(github.event.comment.body, '/lgtm') || contains(github.event.comment.body, '/milestone')) && 'true' || 'false' }}
    steps:
      - name: Record route
        run: echo "Comment matched a command filter; dependent jobs check the route outputs."

  # /cherry-pick command, only send a message if PR is unmerged, cherry-pick if PR was already merged
  cherry-pick:
    name: Cherry pick
    needs: route
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Holds the PR updater app secrets; its branch rules allow only main.
    environment: pr-updater-app
    if: needs.route.outputs.cherry-pick == 'true'
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: Authorize and validate command
        id: command
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const comment = context.payload.comment;
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo,
              username: comment.user.login
            });
            if (!['write', 'maintain', 'admin'].includes(data.permission)) {
              throw new Error('Cherry-pick commands require repository write permission');
            }
            const match = (comment.body || '').split(/\r?\n/, 1)[0]
              .match(/^\/cherry-pick[ \t]+([A-Za-z0-9][A-Za-z0-9._/-]*)[ \t]*$/);
            if (!match) {
              throw new Error('Expected: /cherry-pick <branch>');
            }
            await github.rest.repos.getBranch({
              ...context.repo,
              branch: match[1]
            });
            core.setOutput('branch', match[1]);

      - name: React to comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            try {
              await github.rest.reactions.createForIssueComment({
                ...context.repo,
                comment_id: context.payload.comment.id,
                content: '+1'
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              core.warning('Comment no longer exists; continuing without a reaction');
            }

      - name: Normalize GitHub App private key
        id: normalize-key
        shell: bash
        env:
          RAW_APP_PRIVATE_KEY: ${{ secrets.PR_UPDATER_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          key="$RAW_APP_PRIVATE_KEY"
          # Support secrets saved with escaped newlines.
          key="${key//\\n/$'\n'}"

          if ! printf '%s' "$key" | grep -Eq 'BEGIN (RSA |EC |)PRIVATE KEY'; then
            # Support secrets saved as base64-encoded PEM.
            decoded="$(printf '%s' "$RAW_APP_PRIVATE_KEY" | tr -d '[:space:]' | base64 --decode 2>/dev/null || true)"
            decoded="${decoded//\\n/$'\n'}"
            if printf '%s' "$decoded" | grep -Eq 'BEGIN (RSA |EC |)PRIVATE KEY'; then
              key="$decoded"
            fi
          fi

          if ! printf '%s' "$key" | grep -Eq 'BEGIN (RSA |EC |)PRIVATE KEY'; then
            echo "PR_UPDATER_APP_PRIVATE_KEY does not look like a valid PEM private key." >&2
            exit 1
          fi

          # ::add-mask:: is line-based, mask each line of the key individually.
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done <<< "$key"
          {
            echo "private_key<<EOF"
            printf '%s\n' "$key"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PR_UPDATER_APP_CLIENT_ID }}
          private-key: ${{ steps.normalize-key.outputs.private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Check if PR is merged
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: check-merged
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            return {
              merged: pr.data.merged,
              state: pr.data.state,
              mergeCommit: pr.data.merge_commit_sha
            };

      - name: Comment PR Unmerged
        if: ${{ fromJSON(steps.check-merged.outputs.result).merged == false && fromJSON(steps.check-merged.outputs.result).state != 'closed' }}
        uses: ben-z/actions-comment-on-issue@402eb412a8f396be0d4ac52a823ec7121206cc26 # v1.0.3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          message: |
            Commits from this PR will automatically be cherry-picked once this PR gets merged.

      - name: Checkout repository
        if: fromJSON(steps.check-merged.outputs.result).merged == true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Cherry Pick
        if: fromJSON(steps.check-merged.outputs.result).merged == true
        uses: ./.github/actions/git/cherry-pick
        continue-on-error: true # Send failure comment to PR
        id: cherry-pick
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          source-pr: ${{ github.event.issue.number }}
          source-pr-title: ${{ github.event.issue.title }}
          target-branches: ${{ steps.command.outputs.branch }}
          merge-commit: ${{ fromJson(steps.check-merged.outputs.result).mergeCommit }}

      - name: Comment Cherry-pick Fail
        if: ${{ !cancelled() && steps.command.outcome == 'success' && (failure() || steps.cherry-pick.outcome == 'failure' || steps.cherry-pick.outputs.success == 'false') }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET_BRANCH: ${{ steps.command.outputs.branch }}
          FAILURE_STAGE: ${{ steps.normalize-key.outcome == 'failure' && 'private-key validation' || steps.app-token.outcome == 'failure' && 'App token creation' || steps.check-merged.outcome == 'failure' && 'source PR lookup' || steps.cherry-pick.outcome == 'failure' && 'cherry-pick, push, or PR creation' || 'workflow setup' }}
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Cherry-pick to \`${process.env.TARGET_BRANCH}\` failed in: ${process.env.FAILURE_STAGE}. See [workflow logs](${run}).`;
            await core.summary.addHeading('Cherry-pick failed').addRaw(body).write();
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Fail on unsuccessful cherry-pick
        if: ${{ !cancelled() && (steps.cherry-pick.outcome == 'failure' || steps.cherry-pick.outputs.success == 'false') }}
        run: |
          echo "::error::Cherry-pick failed; see the workflow logs"
          exit 1

  # /conformance [<suite> | <suite>/<regex> | <regex>] [<k8s-version>]
  #
  # Runs conformance tests against the PR head. The plan job authorizes the
  # commenter, validates every argument against tests-conformance.yaml and
  # kubernetes-matrix.yaml at the workflow commit, and pins the PR head commit.
  # The build and test jobs run PR code, so they get a read-only token, no
  # repository secrets, no credentials persisted in the checkout, and the
  # local actions of the workflow commit instead of the PR's. Only the
  # acknowledge and report jobs can write, and they never run PR code.
  conformance-plan:
    name: Validate conformance request
    needs: route
    if: needs.route.outputs.conformance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      valid: ${{ steps.command.outputs.valid }}
      error: ${{ steps.command.outputs.error }}
      sha: ${{ steps.command.outputs.sha }}
      groups: ${{ steps.command.outputs.groups }}
      chainsaw-tests: ${{ steps.command.outputs.chainsaw-tests }}
      k8s-summary: ${{ steps.command.outputs.k8s-summary }}
      description: ${{ steps.command.outputs.description }}
    steps:
      # The called tests-conformance.yaml comes from this commit, so read the
      # suites from the same one.
      - name: Checkout workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
      - name: Read suites and Kubernetes versions
        id: catalog
        run: |
          set -euo pipefail
          # A suite is a job of tests-conformance.yaml. chainsaw tells whether
          # it runs chainsaw, so whether it takes a test regex. api is the
          # MutatingAdmissionPolicy API version its matrix requires, if any.
          suites="$(yq -o=json '.' .github/workflows/tests-conformance.yaml | jq -c '
            [.jobs | to_entries[] | select(.key != "kubernetes-matrix") | {
              id: .key,
              chainsaw: any(.value.steps[]?;
                .uses == "./.github/actions/tests/conformance/run" or ((.run // "") | test("chainsaw test"))),
              api: ((.value.strategy.matrix["k8s-version"] // "") as $m |
                if ($m | contains("beta-versions")) then "v1beta1"
                elif ($m | contains("stable-versions")) then "v1"
                else "" end)
            }]')"
          nodes="$(yq -r '.jobs.matrix.steps[] | select(.id == "matrix") | .env.NODES' .github/workflows/kubernetes-matrix.yaml |
            jq -c 'map({version, api: .mutatingAdmissionPolicy})')"
          echo "suites=$suites" >> "$GITHUB_OUTPUT"
          echo "nodes=$nodes" >> "$GITHUB_OUTPUT"
      - name: Authorize and validate conformance command
        id: command
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SUITES: ${{ steps.catalog.outputs.suites }}
          NODES: ${{ steps.catalog.outputs.nodes }}
        with:
          script: |
            const usage = 'Usage: `/conformance [<suite> | <suite>/<regex> | <regex>] [<k8s-version>]`';
            const reject = message => {
              core.setOutput('valid', 'false');
              core.setOutput('error', `${message}\n\n${usage}`);
              core.setFailed(message);
            };
            const comment = context.payload.comment;
            // On an edit, the sender is the editor, so both must be authorized.
            const users = new Set([comment.user.login, context.payload.sender?.login].filter(Boolean));
            for (const username of users) {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ ...context.repo, username });
              if (!['write', 'maintain', 'admin'].includes(data.permission)) {
                return reject(`@${username} needs repository write permission to run \`/conformance\`.`);
              }
            }

            const suites = JSON.parse(process.env.SUITES);
            const nodes = JSON.parse(process.env.NODES);
            const line = (comment.body || '').split(/\r?\n/, 1)[0].trim();
            if (line.length > 300) {
              return reject('The command line is too long.');
            }
            const words = line.split(/[ \t]+/);
            if (words[0] !== '/conformance') {
              return reject('The command must start with `/conformance` followed by a space.');
            }
            const args = words.slice(1);
            if (args.length > 2) {
              return reject('Too many arguments.');
            }
            const versionPattern = /^v?1\.(0|[1-9][0-9]{0,2})(\.(?:0|[1-9][0-9]{0,2}))?$/;
            let selector = args[0] ?? '';
            let k8s = args[1] ?? '';
            if (args.length === 1 && versionPattern.test(selector)) {
              [selector, k8s] = ['', selector];
            }

            // Pick the suites, and the chainsaw test regex if any.
            const ids = suites.map(s => s.id);
            const chainsawIds = suites.filter(s => s.chainsaw).map(s => s.id);
            let selected = ids;
            let regex = '';
            let description = 'every suite';
            const slash = selector.indexOf('/');
            if (selector === '') {
              // Every suite.
            } else if (ids.includes(selector)) {
              selected = [selector];
              description = `suite \`${selector}\``;
            } else if (slash > 0 && ids.includes(selector.slice(0, slash))) {
              selected = [selector.slice(0, slash)];
              regex = selector.slice(slash + 1);
              if (!chainsawIds.includes(selected[0])) {
                return reject(`Suite \`${selected[0]}\` doesn't run chainsaw, so it doesn't take a test regex.`);
              }
            } else if (/^[A-Za-z0-9-]+$/.test(selector)) {
              return reject(`Unknown suite \`${selector}\`. Suites: ${ids.map(id => `\`${id}\``).join(', ')}.`);
            } else {
              selected = chainsawIds;
              regex = selector;
            }
            if (regex !== '' || slash > 0) {
              // The regex reaches chainsaw's --include-test-regex, which uses Go
              // RE2 syntax. Allow only a subset that RE2 and JavaScript agree on:
              // no quotes, backslashes, spaces, flags, named groups, lookarounds,
              // or backreferences, no nested repetition, and repeat counts up to
              // 1000, the RE2 limit.
              if (!/^[A-Za-z0-9._,:*+?^$()|[\]{}\/-]{1,200}$/.test(regex)) {
                return reject('The test regex must be 1 to 200 letters, digits, or `._,:*+?^$()|[]{}/-` characters.');
              }
              if (/\(\?(?!:)/.test(regex)) {
                return reject('The test regex may use `(?:` groups only, no flags or other group syntax.');
              }
              if (/[*+?}][*+{]/.test(regex)) {
                return reject('The test regex has a nested repetition, which Go rejects.');
              }
              if ([...regex.matchAll(/\{([0-9]*)(?:,([0-9]*))?\}/g)].some(m => Number(m[1] || 0) > 1000 || Number(m[2] || 0) > 1000)) {
                return reject('Repeat counts in the test regex must be at most 1000.');
              }
              try {
                new RegExp(regex);
              } catch {
                return reject('The test regex isn\'t a valid regular expression.');
              }
              description = selected.length === 1
                ? `tests matching \`${regex}\` in suite \`${selected[0]}\``
                : `tests matching \`${regex}\` in every chainsaw suite`;
            }

            // Pick the Kubernetes version of each suite: the one asked for, or
            // the latest one that the suite supports. Suites that share a
            // version run in one call of tests-conformance.yaml.
            const supports = (suite, node) => !suite.api || suite.api === node.api;
            const chosen = suites.filter(s => selected.includes(s.id));
            let asked = null;
            if (k8s !== '') {
              const match = k8s.match(versionPattern);
              if (!match) {
                return reject('The Kubernetes version must look like `v1.36` or `v1.36.4`.');
              }
              asked = nodes.find(n => match[2] ? n.version === `v1.${match[1]}${match[2]}` : n.version.startsWith(`v1.${match[1]}.`));
              if (!asked) {
                return reject(`Kubernetes \`${k8s}\` isn't in kubernetes-matrix.yaml. Versions: ${nodes.map(n => `\`${n.version}\``).join(', ')}.`);
              }
            }
            const byVersion = new Map();
            for (const suite of chosen) {
              const node = asked ? (supports(suite, asked) ? asked : null) : nodes.filter(n => supports(suite, n)).at(-1);
              if (node) {
                byVersion.set(node.version, [...(byVersion.get(node.version) || []), suite.id]);
              }
            }
            if (byVersion.size === 0) {
              return reject(`Suite \`${selected[0]}\` doesn't run on Kubernetes ${asked ? `\`${asked.version}\`` : 'any version in kubernetes-matrix.yaml'}.`);
            }
            const order = nodes.map(n => n.version);
            const groups = [...byVersion].sort(([a], [b]) => order.indexOf(b) - order.indexOf(a))
              .map(([version, list]) => ({ k8s: version, suites: JSON.stringify(list), count: list.length }));

            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.issue.number });
            if (pr.state !== 'open') {
              return reject('The pull request isn\'t open.');
            }
            if (!/^[0-9a-f]{40}$/.test(pr.head.sha)) {
              return reject('The pull request head commit is invalid.');
            }
            const summary = groups.length === 1
              ? `Kubernetes ${groups[0].k8s}`
              : `Kubernetes ${groups.map(g => `${g.k8s} (${g.count} suites)`).join(' and ')}`;
            core.setOutput('valid', 'true');
            core.setOutput('sha', pr.head.sha);
            core.setOutput('groups', JSON.stringify(groups));
            core.setOutput('chainsaw-tests', regex);
            core.setOutput('k8s-summary', summary);
            core.setOutput('description', description);
            for (const group of groups) {
              core.info(`Testing on Kubernetes ${group.k8s} at ${pr.head.sha}: ${JSON.parse(group.suites).join(', ')}`);
            }

  # Only the reaction needs write access; build and test jobs remain read-only.
  conformance-acknowledge:
    name: Acknowledge conformance request
    needs: conformance-plan
    runs-on: ubuntu-latest
    if: needs.conformance-plan.outputs.valid == 'true'
    permissions:
      issues: write
    steps:
      - name: React to comment
        uses: dkershner6/reaction-action@97ede302a1b145b3739dec3ca84a489a34ef48b5 # v2.2.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          reaction: "+1"

  # Runs PR code. The ACTIONS_* variables are blank so that the build can't
  # reach the Actions cache or artifact services through them.
  conformance-images:
    name: Build test images
    needs: conformance-plan
    runs-on: ubuntu-latest
    if: needs.conformance-plan.outputs.valid == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.conformance-plan.outputs.sha }}
          persist-credentials: false
      - name: Use the CI actions of the workflow commit
        env:
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 "$SERVER_URL/$REPOSITORY" "$WORKFLOW_SHA"
          rm -rf .github/actions
          git checkout FETCH_HEAD -- .github/actions
      - name: Setup Go
        uses: ./.github/actions/go/setup
      - name: Install Ko
        uses: ./.github/actions/tools/ko
      - name: Build
        shell: bash
        env:
          ACTIONS_RUNTIME_TOKEN: ""
          ACTIONS_CACHE_URL: ""
          ACTIONS_RESULTS_URL: ""
        run: |
          set -e
          VERSION=${{ github.ref_name }} make docker-save-image-all
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kyverno.tar
          path: kyverno.tar
          if-no-files-found: error

  conformance-cli:
    name: Build test CLI
    needs: conformance-plan
    runs-on: ubuntu-latest
    if: needs.conformance-plan.outputs.valid == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.conformance-plan.outputs.sha }}
          persist-credentials: false
      - name: Use the CI actions of the workflow commit
        env:
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 "$SERVER_URL/$REPOSITORY" "$WORKFLOW_SHA"
          rm -rf .github/actions
          git checkout FETCH_HEAD -- .github/actions
      - name: Setup Go
        uses: ./.github/actions/go/setup
      - name: Build
        shell: bash
        env:
          ACTIONS_RUNTIME_TOKEN: ""
          ACTIONS_CACHE_URL: ""
          ACTIONS_RESULTS_URL: ""
        run: |
          set -e
          VERSION=${{ github.ref_name }} make build-cli
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kubectl-kyverno
          path: cmd/cli/kubectl-kyverno/kubectl-kyverno
          if-no-files-found: error

  # One call per Kubernetes version, so that each suite runs on the latest
  # version it supports.
  conformance-tests:
    name: Conformance tests (${{ matrix.k8s }})
    needs:
      - conformance-plan
      - conformance-images
      - conformance-cli
    if: needs.conformance-plan.outputs.valid == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.conformance-plan.outputs.groups) }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/tests-conformance.yaml
    with:
      release-sha: ${{ needs.conformance-plan.outputs.sha }}
      suites: ${{ matrix.suites }}
      chainsaw-tests: ${{ needs.conformance-plan.outputs.chainsaw-tests }}
      matrix: ${{ matrix.k8s }}

  # Never runs PR code: it reads the test reports as data with the report
  # script of the workflow commit.
  conformance-report:
    name: Report conformance result
    needs:
      - route
      - conformance-plan
      - conformance-images
      - conformance-cli
      - conformance-tests
    if: always() && needs.route.outputs.conformance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout workflow commit
        if: needs.conformance-plan.outputs.valid == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/e2e
      - name: Download test reports
        if: needs.conformance-plan.outputs.valid == 'true'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-reports-*
          path: e2e-reports
      - name: Count test results
        id: counts
        if: needs.conformance-plan.outputs.valid == 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          echo "counts=$(python3 scripts/e2e/report.py counts e2e-reports)" >> "$GITHUB_OUTPUT"
          python3 scripts/e2e/report.py summarize e2e-reports --run-url "$RUN_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VALID: ${{ needs.conformance-plan.outputs.valid }}
          ERROR: ${{ needs.conformance-plan.outputs.error }}
          SHA: ${{ needs.conformance-plan.outputs.sha }}
          K8S_SUMMARY: ${{ needs.conformance-plan.outputs.k8s-summary }}
          DESCRIPTION: ${{ needs.conformance-plan.outputs.description }}
          REGEX: ${{ needs.conformance-plan.outputs.chainsaw-tests }}
          COUNTS: ${{ steps.counts.outputs.counts }}
          IMAGES_RESULT: ${{ needs.conformance-images.result }}
          CLI_RESULT: ${{ needs.conformance-cli.result }}
          TESTS_RESULT: ${{ needs.conformance-tests.result }}
        with:
          script: |
            const env = process.env;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let body;
            if (env.VALID !== 'true') {
              body = env.ERROR
                ? `:x: \`/conformance\` was rejected: ${env.ERROR}`
                : `:x: \`/conformance\` couldn't be validated. See the [workflow run](${run}).`;
            } else {
              let counts = null;
              try {
                counts = env.COUNTS ? JSON.parse(env.COUNTS) : null;
              } catch {
                counts = null;
              }
              const ran = counts ? counts.passed + counts.failed : null;
              const results = [env.IMAGES_RESULT, env.CLI_RESULT, env.TESTS_RESULT];
              let icon;
              let outcome;
              if (results.every(r => r === 'success') && env.REGEX && ran === 0) {
                [icon, outcome] = [':warning:', 'ran no tests: no test matched the regex'];
              } else if (results.every(r => r === 'success')) {
                [icon, outcome] = [':white_check_mark:', 'passed'];
              } else if (results.includes('cancelled')) {
                [icon, outcome] = [':warning:', 'was cancelled'];
              } else {
                [icon, outcome] = [':x:', 'failed'];
              }
              const tally = counts
                ? ` Test results: ${counts.passed} passed, ${counts.failed} failed, ${counts.skipped} skipped.`
                : '';
              body = `${icon} Conformance ${outcome} for ${env.DESCRIPTION} on ${env.K8S_SUMMARY} at ${env.SHA}.${tally} See the [workflow run](${run}).`;
            }
            await core.summary.addRaw(body).write();
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

  prow-assign:
    name: Prow Assign
    needs: route
    # Non-members can self-assign issues labeled 'good first issue' only.
    # Org members, owners, and collaborators can (un)assign anywhere.
    if: needs.route.outputs.prow-assign == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: jpmcb/prow-github-actions@c44ac3a57d67639e39e4a4988b52049ef45b80dd # v2.0.0
        with:
          prow-commands: "/assign
            /unassign"
          github-token: "${{ secrets.GITHUB_TOKEN }}"

  prow:
    name: Prow
    needs: route
    if: needs.route.outputs.prow == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: jpmcb/prow-github-actions@c44ac3a57d67639e39e4a4988b52049ef45b80dd # v2.0.0
        with:
          prow-commands: "/lgtm
            /milestone"
          github-token: "${{ secrets.GITHUB_TOKEN }}"
