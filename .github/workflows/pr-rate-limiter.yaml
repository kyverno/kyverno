# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: PR rate limiter

permissions: {}

on:
  pull_request_target:
    types:
      - opened
      - reopened

jobs:
  limit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Limit open pull requests per user
        uses: Homebrew/actions/limit-pull-requests@c8707045ccae42888fe98e86f2ee8938bc7cc193 # 2026.08.10.1
        with:
          except-author-associations: |
            MEMBER
            OWNER
          comment-limit: 9
          comment: >
            You already have 8 pull requests open. Please work on getting
            existing PRs merged before opening more.
          close-limit: 9
          close: true
