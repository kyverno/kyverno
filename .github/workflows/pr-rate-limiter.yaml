# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: PR rate limiter

permissions: {}

on:
  pull_request_target:
    types:
      - opened
      - reopened

jobs:
  limit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Limit open pull requests per user
        uses: Homebrew/actions/limit-pull-requests@848c272c7bfe984a197bd4d16383f4c106ec61e6 # 2026.09.21.1
        with:
          except-author-associations: "MEMBER,OWNER"
          except-users: "dependabot[bot],app/dependabot"
          comment-limit: 9
          comment: >
            You already have 8 pull requests open. Please work on getting
            existing PRs merged before opening more.
          close-limit: 9
          close: true
