# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: PR rate limiter

permissions: {}

on:
  pull_request_target:
    types:
      - opened
      - reopened

jobs:
  limit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Limit open pull requests per user
        uses: Homebrew/actions/limit-pull-requests@b35a29a0f83ee8b8ca07b219fc8db3d7bb88ab49 # 2026.08.10.2
        with:
          except-author-associations: |
            MEMBER
            OWNER
          comment-limit: 9
          comment: >
            You already have 8 pull requests open. Please work on getting
            existing PRs merged before opening more.
          close-limit: 9
          close: true
