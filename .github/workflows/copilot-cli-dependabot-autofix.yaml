# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Fixes a failing check on a Dependabot PR by running GitHub Copilot CLI (`@github/copilot`), reading the failure
# log plus the PR diff, the bump's semver level, and Copilot's own review comments as context. Split into three
# jobs so the job that executes the Dependabot branch's own code (Copilot CLI, `go`, `make` — all untrusted, since
# a compromised dependency release could reach this workflow) never holds `contents: write`: `resolve` claims the
# attempt with no repo access, `prepare-fix` does the actual work read-only and hands off a patch file, and only
# `apply-fix` holds the write token. That split alone doesn't make the patch itself trustworthy though — a
# compromised dependency's build script could still slip something extra into it during prepare-fix — so
# apply-fix also waits behind a required-reviewer environment (see its `environment:` key) before applying and
# pushing anything. The claim comment posted in `resolve` can sit in "attempting a fix" until that's approved;
# that's expected, not stuck.
#
# Not the Copilot "coding agent" (blocked in this org) — Copilot CLI authenticates via the `copilot-requests:
# write` permission and the workflow's own GITHUB_TOKEN, a separate entitlement. Needs the org's "Allow use of
# Copilot CLI billed to the organization" policy on. Exact CLI flags (`--allow-tool`, `--no-ask-user`) are
# best-effort from GitHub's docs.
#
# Triggers per check workflow (this repo has no single "CI" workflow). Autofix always attempts a failing check
# regardless of bump size; major-semver bumps additionally get a needs-human-review label (breaking API changes
# need judgment). Attempts are capped per-check and globally per-PR to bound AI-credit spend; hitting either cap
# also labels the PR. The claim comment is posted before any expensive work starts (so a crash or cap-relevant
# attempt is never lost) and edited in place with the final result, rather than posting a second comment.
#
# runs-on split follows this repo's existing convention (check-unit-tests.yaml, dependabot-autofix.yaml): the
# lightweight gh/git-only jobs (resolve, apply-fix, report-all-green) use ubuntu-slim; only prepare-fix, which
# needs Go + npm + make/go build execution, uses ubuntu-latest.

name: "Dependabot autofix (Copilot CLI)"

permissions: {}

on:
  workflow_run:
    types:
      - completed
    workflows:
      - "Unit tests"
      - "CLI"
      - "Go"
      - "Go format"
      - "Go vet"
      - "Go imports"
      - "Go packages"
      - "Codegen"
      - "Chart-testing"
      - "Artifact Hub"
      - "Actions"
      - "Devcontainer"
      - "framework tests (envtest)"

concurrency:
  group: copilot-cli-dependabot-autofix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  PER_CHECK_ATTEMPT_CAP: 2
  GLOBAL_ATTEMPT_CAP: 5

jobs:
  resolve:
    name: Resolve, classify, and claim
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
    outputs:
      pr: ${{ steps.pr.outputs.number }}
      skip: ${{ steps.pr.outputs.skip == 'true' || steps.claim.outputs.skip == 'true' }}
      level: ${{ steps.bump.outputs.level }}
      comment_id: ${{ steps.claim.outputs.comment_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      CHECK_NAME: ${{ github.event.workflow_run.name }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Resolve the PR this run belongs to
        id: pr
        run: |
          set -euo pipefail
          number=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.pull_requests[0].number // empty')
          if [[ -z "$number" ]]; then
            echo "No same-repo PR associated with this run — nothing to fix here."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check the PR's actual author, not the run's triggering actor — a check we re-trigger ourselves via
          # workflow_dispatch runs as github-actions[bot], not dependabot[bot].
          author=$(gh pr view "$number" --repo "${GITHUB_REPOSITORY}" --json author --jq '.author.login')
          if [[ "$author" != "dependabot[bot]" ]]; then
            echo "PR #$number isn't authored by dependabot[bot] — nothing to fix here."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Classify the dependency bump (patch/minor/major)
        id: bump
        if: steps.pr.outputs.skip == 'false'
        run: |
          set -euo pipefail
          pr="${{ steps.pr.outputs.number }}"

          # Dependabot's own commit trailer already says which semver level this is.
          commit_message=$(gh pr view "$pr" --repo "${GITHUB_REPOSITORY}" --json commits --jq '.commits[-1].messageBody')

          level=patch
          if grep -q 'update-type: version-update:semver-major' <<< "$commit_message"; then
            level=major
          elif grep -q 'update-type: version-update:semver-minor' <<< "$commit_message"; then
            level=minor
          fi
          echo "level=$level" >> "$GITHUB_OUTPUT"

          if [[ "$level" == "major" ]]; then
            gh pr edit "$pr" --repo "${GITHUB_REPOSITORY}" --add-label "needs-human-review"
            marker="<!-- copilot-cli-autofix: major-bump-skip $HEAD_SHA -->"
            existing_comments=$(gh pr view "$pr" --repo "${GITHUB_REPOSITORY}" --json comments --jq '.comments[].body')
            if ! grep -qF -- "$marker" <<< "$existing_comments"; then
              gh pr comment "$pr" --repo "${GITHUB_REPOSITORY}" --body "$marker
          Major-semver bump — \`needs-human-review\` stays even once CI is green."
            fi
          fi

      - name: Claim this check or back off
        id: claim
        if: steps.pr.outputs.skip == 'false'
        run: |
          set -euo pipefail
          pr="${{ steps.pr.outputs.number }}"

          existing_comments=$(gh pr view "$pr" --repo "${GITHUB_REPOSITORY}" --json comments --jq '.comments[].body')

          marker="<!-- copilot-cli-autofix: check=\"$CHECK_NAME\" sha=\"$HEAD_SHA\" -->"
          if grep -qF -- "$marker" <<< "$existing_comments"; then
            echo "Already attempted (or attempting) a fix for $CHECK_NAME @ $HEAD_SHA — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Per-check cap: this exact check has already failed-and-been-attempted this many times.
          check_attempts=$(grep -cF -- "check=\"$CHECK_NAME\"" <<< "$existing_comments" || true)
          # Global cap: total autofix attempts on this PR, across every check, so one flaky check can't alone
          # burn the whole budget but the PR as a whole still has a hard ceiling.
          total_attempts=$(grep -cF -- 'copilot-cli-autofix: check="' <<< "$existing_comments" || true)

          if [[ "$check_attempts" -ge "$PER_CHECK_ATTEMPT_CAP" || "$total_attempts" -ge "$GLOBAL_ATTEMPT_CAP" ]]; then
            reason="\`$CHECK_NAME\` has failed $check_attempts autofix attempts"
            [[ "$total_attempts" -ge "$GLOBAL_ATTEMPT_CAP" ]] && reason="this PR has hit $total_attempts total autofix attempts across all checks"
            echo "Cap hit ($reason) — leaving it for a human from here."
            gh pr edit "$pr" --repo "${GITHUB_REPOSITORY}" --add-label "needs-human-review"
            gh pr comment "$pr" --repo "${GITHUB_REPOSITORY}" --body "Copilot CLI autofix is giving up: $reason. Needs a human from here."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Post (and persist) the claim comment now, before any expensive work — so a crash between here and the
          # final report still counts as a used attempt against the caps above on the next retry.
          comment_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/$pr/comments" -f body="$marker
          🤖 \`$CHECK_NAME\` failed — Copilot CLI is attempting a fix directly on this branch." --jq '.id')
          echo "comment_id=$comment_id" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

  prepare-fix:
    name: Prepare a fix (read-only, no write token)
    needs: resolve
    if: needs.resolve.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      copilot-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      CHECK_NAME: ${{ github.event.workflow_run.name }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      PR: ${{ needs.resolve.outputs.pr }}
      LEVEL: ${{ needs.resolve.outputs.level }}
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout PR branch, pinned to the exact commit that failed
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/go/setup
        with:
          gobuild-cache-prefix: gobuild-copilot-autofix

      - name: Get the failure log for this run
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --repo "${GITHUB_REPOSITORY}" --log-failed > failure.log 2>&1 || true
          tail -c 20000 failure.log > failure-excerpt.log

      - name: Get the PR diff (excluding go.sum noise)
        run: |
          set -euo pipefail
          git diff "origin/main...HEAD" -- . ':!go.sum' ':!**/go.sum' > pr-diff.log 2>&1 || true
          head -c 8000 pr-diff.log > pr-diff-excerpt.log

      - name: Get Copilot's existing review comments on this PR
        run: |
          set -euo pipefail
          {
            gh api "repos/${GITHUB_REPOSITORY}/pulls/$PR/reviews" \
              --jq '.[] | select(.user.login == "copilot-pull-request-reviewer[bot]") | .body' 2>/dev/null || true
            gh api "repos/${GITHUB_REPOSITORY}/pulls/$PR/comments" \
              --jq '.[] | select(.user.login == "copilot-pull-request-reviewer[bot]") | (.path + ":" + (.line // "?" | tostring) + ": " + .body)' 2>/dev/null || true
          } > copilot-review.log
          head -c 4000 copilot-review.log > copilot-review-excerpt.log

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Configure a placeholder git identity (this job never pushes)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ask Copilot CLI to fix the failure
        run: |
          set -euo pipefail
          prompt=$(cat <<EOF
          The GitHub Actions check "$CHECK_NAME" is failing on this branch (a Dependabot dependency-bump PR,
          classified as a $LEVEL-semver bump). Its failure log (may be truncated to the last part) is below.
          Make the smallest change that fixes the failure — do not refactor, do not touch unrelated files, do
          not change the dependency version Dependabot chose. If the fix is a Go code change, run the relevant
          \`make\` target (e.g. \`make fmt vet\`, \`make test-unit\`, \`make codegen-all-code\`) to confirm it
          actually passes before you stop.

          This PR may be a Go dependency bump (touching go.mod/go.sum) or a GitHub Actions version bump (touching
          one or more .github/workflows/*.yaml files) — fix whichever kind of failure this actually is, including
          editing a workflow file directly if that's what this PR itself changed.

          Two cases where you should make NO changes and say so instead of guessing:
          - The failure is a stale test fixture (e.g. a hardcoded expected value in a _test.go file no longer
            matches real output because of the dependency bump) — in that case DO fix it, that's in scope.
          - The real fix is in a file this PR doesn't already touch, and would be needed regardless of this
            specific bump — e.g. a *different* workflow's pinned tool version made stale by a go.mod bump this PR
            made, unrelated to anything this PR's own diff changed. That's shared infra, not this PR's problem —
            leave it and say so. Also don't change the dependency version Dependabot chose.

          --- failure log ---
          $(cat failure-excerpt.log)

          --- this PR's diff (go.sum omitted) ---
          $(cat pr-diff-excerpt.log)

          --- Copilot's existing review comments on this PR, if any (may already explain the failure) ---
          $(cat copilot-review-excerpt.log)
          EOF
          )
          copilot --allow-tool 'write' \
            --allow-tool 'shell(git:*)' \
            --allow-tool 'shell(go:*)' \
            --allow-tool 'shell(make:*)' \
            --no-ask-user \
            --prompt "$prompt" | tee copilot-output.log

      - name: Generate a patch of whatever Copilot CLI changed
        id: diff
        run: |
          set -euo pipefail
          # Exclude this job's own *.log scratch files from the patch.
          git add -A -- . ':!*.log'
          if git diff --cached --quiet "$HEAD_SHA"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --cached "$HEAD_SHA" > fix.patch
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the patch and Copilot's reasoning
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fix-${{ github.event.workflow_run.id }}
          path: |
            fix.patch
            copilot-output.log
          if-no-files-found: ignore
          retention-days: 1

  apply-fix:
    name: Apply the fix and push (write token — never executes PR-branch code)
    needs: [resolve, prepare-fix]
    if: always() && needs.resolve.outputs.skip == 'false'
    # Closes the artifact-trust gap the job split alone doesn't: prepare-fix ran untrusted PR-branch code to
    # produce fix.patch, so this job — the one with the write token — waits for a human to approve before it
    # applies and pushes that patch, rather than trusting it automatically. Needs one-time setup by a repo admin:
    # Settings → Environments → New environment named "dependabot-autofix-approval" → add required reviewers.
    # Until that's done, this environment runs ungated (auto-created bare on first use).
    environment: dependabot-autofix-approval
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      CHECK_NAME: ${{ github.event.workflow_run.name }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      PR: ${{ needs.resolve.outputs.pr }}
      COMMENT_ID: ${{ needs.resolve.outputs.comment_id }}
    steps:
      # Checkout before download: actions/checkout's default clean: true runs git clean -ffdx post-fetch, which
      # would delete the just-downloaded fix.patch/copilot-output.log if it ran second.
      - name: Checkout PR branch, pinned to the exact commit the patch was based on
        if: needs.prepare-fix.result == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}

      - name: Download the patch, if prepare-fix produced one
        if: needs.prepare-fix.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fix-${{ github.event.workflow_run.id }}
        continue-on-error: true

      - name: Apply the patch, commit, and push
        id: push
        if: needs.prepare-fix.result == 'success' && hashFiles('fix.patch') != ''
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git apply fix.patch
          # Exclude this workflow's own downloaded artifact files.
          git add -A -- . ':!fix.patch' ':!*.log'
          git commit --signoff -m "fix: address failing $CHECK_NAME check

          Copilot-CLI-autofix: $HEAD_SHA"
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Report the outcome by editing the claimed comment
        if: always()
        run: |
          set -euo pipefail
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
          reasoning="(no output captured)"
          [[ -f copilot-output.log ]] && reasoning=$(tail -c 3000 copilot-output.log)

          if [[ "${{ needs.prepare-fix.result }}" != "success" ]]; then
            headline="Copilot CLI run failed or was cancelled while working on the \`$CHECK_NAME\` check ($run_url) — needs a human look."
          elif [[ "${{ steps.push.outputs.pushed }}" == "true" ]]; then
            headline="Copilot CLI fixed the failing \`$CHECK_NAME\` check ($run_url) and pushed a commit. This push used the workflow's own token, so CI on it may be sitting in \"action required\" and need a maintainer to approve the run."
          else
            headline="Copilot CLI looked at the failing \`$CHECK_NAME\` check ($run_url) but didn't make a change — needs a human look."
          fi

          marker="<!-- copilot-cli-autofix: check=\"$CHECK_NAME\" sha=\"$HEAD_SHA\" -->"
          body=$(printf '%s\n%s\n\n<details><summary>Copilot CLI reasoning</summary>\n\n```\n%s\n```\n</details>' "$marker" "$headline" "$reasoning")
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" -f body="$body"

  report-all-green:
    name: Label the PR once every check is green
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Check whether autofix ever touched this PR, and whether it's all green now
        run: |
          set -euo pipefail
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.pull_requests[0].number // empty')
          if [[ -z "$pr" ]]; then
            echo "No same-repo PR associated with this run."
            exit 0
          fi

          author=$(gh pr view "$pr" --repo "${GITHUB_REPOSITORY}" --json author --jq '.author.login')
          if [[ "$author" != "dependabot[bot]" ]]; then
            echo "PR #$pr isn't authored by dependabot[bot] — nothing to report here."
            exit 0
          fi

          existing_comments=$(gh pr view "$pr" --repo "${GITHUB_REPOSITORY}" --json comments --jq '.comments[].body')
          if ! grep -qF -- 'copilot-cli-autofix:' <<< "$existing_comments"; then
            echo "Autofix never engaged with this PR — nothing to report."
            exit 0
          fi

          # "bucket" is gh's normalized status (fail/pending/cancel/skipping/success) — unlike raw "state", it
          # correctly counts CANCELLED/TIMED_OUT/STALE/ACTION_REQUIRED as not-green instead of only FAILURE/ERROR.
          failing=$(gh pr checks "$pr" --repo "${GITHUB_REPOSITORY}" --json bucket \
            --jq '[.[] | select(.bucket == "fail" or .bucket == "pending" or .bucket == "cancel")] | length')
          if [[ "$failing" != "0" ]]; then
            echo "Still $failing check(s) not green — not done yet."
            exit 0
          fi

          # A major-bump skip means a human still needs to look regardless of CI going green — only clear the
          # label when it was set for the (now resolved) cap-hit reason.
          if grep -qF -- 'major-bump-skip' <<< "$existing_comments"; then
            gh pr comment "$pr" --repo "${GITHUB_REPOSITORY}" --body "All checks are green, but this is still a major-semver bump — leaving \`needs-human-review\` for a maintainer to check for breaking changes."
          else
            gh pr edit "$pr" --repo "${GITHUB_REPOSITORY}" --remove-label "needs-human-review" || true
            gh pr comment "$pr" --repo "${GITHUB_REPOSITORY}" --body "All checks are green. Ready for human review/merge."
          fi
