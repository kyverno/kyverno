# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Daily sweep: for every open PR that closes an issue with an open "Kyverno Release ..." milestone, check DCO, CI,
# merge conflicts, and unresolved review threads. Clean -> `ready-for-review`; not clean -> `needs-author-action`
# plus a comment; both labels re-evaluated every run.
#
# PRs never carry the milestone themselves (assign-milestone.yaml only assigns it retroactively, at release-tag
# time), so discovery goes through each PR's closing issue instead.
#
# Checks live in .github/pr-readiness-checks.yml, not here — add one there, nothing in this file changes.

name: "PR readiness check"

permissions: {}

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 0,8,16 * * *"

jobs:
  check:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install yq
        uses: ./.github/actions/tools/yq

      - name: Build the readiness-check program from .github/pr-readiness-checks.yml
        run: |
          yq -o=json '.' .github/pr-readiness-checks.yml | jq -r '
            to_entries
            | map("(if (" + .value.test + ") then {id: \"" + .key + "\", message: (" + .value.message + ")} else empty end)")
            | join(",\n")
            | ".author.login as $author\n| [\n" + . + "\n]"
          ' > readiness-checks.jq

      - name: Discover which open PRs close a milestoned issue (cheap pass)
        run: |
          set -euo pipefail

          # Fetches only closingIssuesReferences for every open PR — fetching the full readiness payload for all
          # ~300+ open PRs in one pass times out the GraphQL API, so that's deferred to the next step, for
          # qualifying PRs only.
          query='
            query($search: String!, $after: String) {
              search(query: $search, type: ISSUE, first: 100, after: $after) {
                pageInfo { hasNextPage endCursor }
                nodes {
                  ... on PullRequest {
                    number
                    isDraft
                    closingIssuesReferences(first: 10) {
                      nodes { repository { nameWithOwner } milestone { title state } }
                    }
                  }
                }
              }
            }'
          search="repo:${GITHUB_REPOSITORY} is:pr is:open draft:false -author:app/dependabot"

          # Qualifies if it closes a same-repo issue with an open "Kyverno Release ..." milestone.
          qualifies='
            [.closingIssuesReferences.nodes[]?
              | select(.repository.nameWithOwner == $repo
                  and .milestone != null
                  and .milestone.state == "OPEN"
                  and (.milestone.title | test("^Kyverno Release ")))]
            | length > 0'

          echo '[]' > qualifying-numbers.json
          after=""
          page=0
          while :; do
            page=$((page + 1))
            if [[ -z "$after" ]]; then
              gh api graphql -f query="$query" -f search="$search" > response.json
            else
              gh api graphql -f query="$query" -f search="$search" -f after="$after" > response.json
            fi

            jq -c --arg repo "${GITHUB_REPOSITORY}" \
              "[.data.search.nodes[] | select(.isDraft | not) | select($qualifies) | .number]" \
              response.json > page-numbers.json
            jq -s 'add' qualifying-numbers.json page-numbers.json > numbers-next.json && mv numbers-next.json qualifying-numbers.json

            has_next=$(jq -r '.data.search.pageInfo.hasNextPage' response.json)
            [[ "$has_next" != "true" ]] && break
            after=$(jq -r '.data.search.pageInfo.endCursor' response.json)

            if [[ "$page" -ge 20 ]]; then
              echo "::warning::Stopped paginating discovery after 20 pages (2000 PRs)."
              break
            fi
          done
          echo "Found $(jq 'length' qualifying-numbers.json) PR(s) closing a milestoned issue."

      - name: Fetch full readiness data and check each qualifying PR (per-PR pass)
        run: |
          set -euo pipefail

          detail_query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  number
                  author { login }
                  labels(first: 100) { pageInfo { hasNextPage } nodes { name } }
                  commits(last: 1) {
                    nodes { commit {
                      statusCheckRollup { contexts(first: 100) { pageInfo { hasNextPage } nodes {
                        ... on CheckRun { name conclusion status }
                        ... on StatusContext { context state }
                      } } }
                    } }
                  }
                  comments(last: 100) { nodes { author { login } body createdAt } }
                  reviewThreads(first: 100) {
                    pageInfo { hasNextPage }
                    nodes { isResolved comments(last: 1) { nodes { author { login } createdAt } } }
                  }
                }
              }
            }'
          owner="${GITHUB_REPOSITORY%/*}"
          name="${GITHUB_REPOSITORY#*/}"

          # Written straight to a file, never through a bash variable — PR content can contain arbitrary text.
          : > pr-details.jsonl
          for number in $(jq -r '.[]' qualifying-numbers.json); do
            gh api graphql -f query="$detail_query" -f owner="$owner" -f name="$name" -F number="$number" \
              | jq -c '.data.repository.pullRequest' >> pr-details.jsonl
          done
          jq -s '.' pr-details.jsonl > prs.json
          returned_count=$(jq 'length' prs.json)

          for ((i = 0; i < returned_count; i++)); do
            jq -c ".[$i]" prs.json > pr.json

            number=$(jq -r '.number' pr.json)
            author=$(jq -r '.author.login' pr.json)
            findings=$(jq -c -f readiness-checks.jq pr.json)
            has_label=$(jq -r '[.labels.nodes[].name] | any(. == "needs-author-action")' pr.json)
            has_ready_label=$(jq -r '[.labels.nodes[].name] | any(. == "ready-for-review")' pr.json)

            # A truncated connection means "no findings" is unproven — leave labels as-is rather than clear them.
            truncated=$(jq -r '
              [.labels.pageInfo.hasNextPage,
               (.commits.nodes[0].commit.statusCheckRollup.contexts.pageInfo.hasNextPage // false),
               .reviewThreads.pageInfo.hasNextPage]
              | any' pr.json)

            # A check still running isn't a finding — don't mark ready until it settles.
            pending=$(jq -r '
              [.commits.nodes[0].commit.statusCheckRollup.contexts.nodes[]?
                | select((.status? and .status != "COMPLETED") or .state? == "PENDING" or .state? == "EXPECTED")]
              | length > 0' pr.json)

            if [[ "$findings" == "[]" ]]; then
              if [[ "$truncated" == "true" ]]; then
                # Can't trust a "clean" verdict from a partial connection — drop a stale ready-for-review rather
                # than keep asserting it, but leave needs-author-action alone (incomplete data proves nothing).
                [[ "$has_ready_label" == "true" ]] && gh pr edit "$number" --repo "${GITHUB_REPOSITORY}" --remove-label "ready-for-review"
                echo "PR #$number: truncated connection, no findings on the visible page — removed ready-for-review if present."
              elif [[ "$pending" == "true" ]]; then
                echo "PR #$number: checks still pending — leaving labels as-is."
              else
                [[ "$has_label" == "true" ]] && gh pr edit "$number" --repo "${GITHUB_REPOSITORY}" --remove-label "needs-author-action"
                [[ "$has_ready_label" == "false" ]] && gh pr edit "$number" --repo "${GITHUB_REPOSITORY}" --add-label "ready-for-review"
              fi
              continue
            fi

            ids=$(jq -r '[.[].id] | sort | join(",")' <<< "$findings")
            marker="<!-- pr-readiness-check: $ids -->"
            already_reported=$(jq --arg m "$marker" '[.comments.nodes[] | select(.body | contains($m))] | length > 0' pr.json)

            [[ "$has_label" == "false" ]] && gh pr edit "$number" --repo "${GITHUB_REPOSITORY}" --add-label "needs-author-action"
            [[ "$has_ready_label" == "true" ]] && gh pr edit "$number" --repo "${GITHUB_REPOSITORY}" --remove-label "ready-for-review"
            [[ "$already_reported" == "true" ]] && continue

            items=$(jq -r '.[] | "- " + .message' <<< "$findings")
            body=$(printf '%s\n\n@%s this PR needs a bit more before it can be reviewed:\n%s' "$marker" "$author" "$items")

            gh pr comment "$number" --repo "${GITHUB_REPOSITORY}" --body "$body"
          done
