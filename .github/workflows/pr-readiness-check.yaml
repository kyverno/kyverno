# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Daily sweep of open PRs in the nearest upcoming release milestone, checking whether each one is actually clean:
# DCO passing, no merge conflicts (via the `merge-conflicts` label pr-labelling.yaml applies), no unresolved
# review threads the author hasn't responded to. A PR that fails any check is commented on, labeled
# `needs-author-action`, and loses `ready-for-review` if it had it; a clean PR gets the reverse — both labels
# fully re-evaluated on every run, so a PR that goes dirty again (e.g. a new merge conflict) flips back correctly.
#
# Checks live in .github/pr-readiness-checks.yml, not here — add one there, nothing in this file changes.

name: "PR readiness check"

permissions: {}

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 8 * * *"

jobs:
  check:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: write
      issues: read
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install yq
        uses: ./.github/actions/tools/yq

      - name: Build the readiness-check program from .github/pr-readiness-checks.yml
        run: |
          yq -o=json '.' .github/pr-readiness-checks.yml | jq -r '
            to_entries
            | map("(if (" + .value.test + ") then {id: \"" + .key + "\", message: (" + .value.message + ")} else empty end)")
            | join(",\n")
            | ".author.login as $author\n| [\n" + . + "\n]"
          ' > readiness-checks.jq

      - name: Check readiness of PRs in the active milestone
        run: |
          set -euo pipefail

          # Nearest-due open "Kyverno Release ..." milestone — release milestones overlap (a patch and the next
          # minor can both be open at once), so nearest due date is what makes this the current one, never hardcoded.
          milestone=$(gh api "repos/${GITHUB_REPOSITORY}/milestones" --jq '
            [.[] | select(.state == "open" and (.title | test("^Kyverno Release ")))]
            | sort_by(.due_on // "9999-12-31")
            | .[0].title // empty')
          if [[ -z "$milestone" ]]; then
            echo "No open release milestone found, nothing to check."
            exit 0
          fi
          echo "Active milestone: $milestone"

          query='
            query($search: String!, $after: String) {
              search(query: $search, type: ISSUE, first: 100, after: $after) {
                issueCount
                pageInfo { hasNextPage endCursor }
                nodes {
                  ... on PullRequest {
                    number
                    isDraft
                    author { login }
                    labels(first: 100) { pageInfo { hasNextPage } nodes { name } }
                    commits(last: 1) {
                      nodes { commit {
                        statusCheckRollup { contexts(first: 100) { pageInfo { hasNextPage } nodes {
                          ... on CheckRun { name conclusion }
                          ... on StatusContext { context state }
                        } } }
                      } }
                    }
                    comments(last: 100) { nodes { author { login } body createdAt } }
                    reviewThreads(first: 100) {
                      pageInfo { hasNextPage }
                      nodes { isResolved comments(last: 1) { nodes { author { login } createdAt } } }
                    }
                  }
                }
              }
            }'
          search="repo:${GITHUB_REPOSITORY} is:pr is:open draft:false -author:app/dependabot milestone:\"$milestone\""

          # Paginate the outer search itself — first:100 alone would silently skip PRs past the 100th in a large
          # milestone, which could wrongly mark an unfetched PR ready from data that was never actually seen.
          echo '[]' > prs.json
          after=""
          page=0
          while :; do
            page=$((page + 1))
            # Straight to a file, never through a bash variable — a PR comment/description can contain arbitrary
            # multi-line text, and no shell variable capture of that content is assumed safe here.
            if [[ -z "$after" ]]; then
              gh api graphql -f query="$query" -f search="$search" > response.json
            else
              gh api graphql -f query="$query" -f search="$search" -f after="$after" > response.json
            fi

            jq -c '[.data.search.nodes[] | select(.isDraft | not)]' response.json > page-prs.json
            jq -s 'add' prs.json page-prs.json > prs-next.json && mv prs-next.json prs.json

            has_next=$(jq -r '.data.search.pageInfo.hasNextPage' response.json)
            [[ "$has_next" != "true" ]] && break
            after=$(jq -r '.data.search.pageInfo.endCursor' response.json)

            if [[ "$page" -ge 20 ]]; then
              echo "::warning::Stopped paginating the search after 20 pages (2000 PRs) — implausible for one milestone; treating anything beyond this as unchecked rather than looping forever."
              break
            fi
          done
          returned_count=$(jq 'length' prs.json)

          for ((i = 0; i < returned_count; i++)); do
            # Each PR isolated to its own file for the same reason — every jq call below reads pr.json directly
            # rather than piping its (potentially multi-line) content through a shell variable.
            jq -c ".[$i]" prs.json > pr.json

            number=$(jq -r '.number' pr.json)
            author=$(jq -r '.author.login' pr.json)
            findings=$(jq -c -f readiness-checks.jq pr.json)
            has_label=$(jq -r '[.labels.nodes[].name] | any(. == "needs-author-action")' pr.json)
            has_ready_label=$(jq -r '[.labels.nodes[].name] | any(. == "ready-for-review")' pr.json)

            # A truncated connection means the "no findings" verdict below is unproven, not confirmed — retaining
            # the label in that case (rather than clearing it) is the fix CodeRabbit asked for on this workflow.
            # `.comments` deliberately isn't included here: it only feeds marker dedup below, never a readiness
            # check, so a PR with >100 historical comments shouldn't be stuck unable to ever clear its labels.
            truncated=$(jq -r '
              [.labels.pageInfo.hasNextPage,
               (.commits.nodes[0].commit.statusCheckRollup.contexts.pageInfo.hasNextPage // false),
               .reviewThreads.pageInfo.hasNextPage]
              | any' pr.json)

            if [[ "$findings" == "[]" ]]; then
              if [[ "$truncated" == "false" ]]; then
                [[ "$has_label" == "true" ]] && gh pr edit "$number" --repo "${GITHUB_REPOSITORY}" --remove-label "needs-author-action"
                [[ "$has_ready_label" == "false" ]] && gh pr edit "$number" --repo "${GITHUB_REPOSITORY}" --add-label "ready-for-review"
              else
                echo "PR #$number: a connection was truncated, no findings seen — leaving labels as-is rather than acting on incomplete data."
              fi
              continue
            fi

            # $findings only ever holds the short id/message strings this repo's own pr-readiness-checks.yml
            # defines — never PR content — so piping it through further jq calls here is fine.
            ids=$(jq -r '[.[].id] | sort | join(",")' <<< "$findings")
            marker="<!-- pr-readiness-check: $ids -->"
            already_reported=$(jq --arg m "$marker" '[.comments.nodes[] | select(.body | contains($m))] | length > 0' pr.json)

            [[ "$has_label" == "false" ]] && gh pr edit "$number" --repo "${GITHUB_REPOSITORY}" --add-label "needs-author-action"
            [[ "$has_ready_label" == "true" ]] && gh pr edit "$number" --repo "${GITHUB_REPOSITORY}" --remove-label "ready-for-review"
            [[ "$already_reported" == "true" ]] && continue

            items=$(jq -r '.[] | "- " + .message' <<< "$findings")
            body=$(printf '%s\n\n@%s this PR needs a bit more before it can be reviewed:\n%s' "$marker" "$author" "$items")

            gh pr comment "$number" --repo "${GITHUB_REPOSITORY}" --body "$body"
          done
