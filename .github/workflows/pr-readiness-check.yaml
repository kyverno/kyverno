# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Daily sweep of open PRs in the nearest upcoming release milestone, checking whether each one is actually clean:
# DCO passing, no merge conflicts, no unresolved review threads the author hasn't responded to. A PR that fails
# any check gets commented on and labeled `needs-author-action`; a PR with none of that label removed. "Open PRs
# minus that label" is then a reliable answer to "what's actually ready for review."
#
# Checks live in .github/pr-readiness-checks.yml, not here — add one there, nothing in this file changes.

name: "PR readiness check"

permissions: {}

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 8 * * *"

jobs:
  check:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: write
      issues: read
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install yq
        uses: ./.github/actions/tools/yq

      - name: Build the readiness-check program from .github/pr-readiness-checks.yml
        run: |
          yq -o=json '.' .github/pr-readiness-checks.yml | jq -r '
            to_entries
            | map("(if (" + .value.test + ") then {id: \"" + .key + "\", message: " + (.value.message | tojson) + "} else empty end)")
            | join(",\n")
            | ".author.login as $author\n| [\n" + . + "\n]"
          ' > readiness-checks.jq

      - name: Check readiness of PRs in the active milestone
        run: |
          set -euo pipefail

          # Nearest-due open "Kyverno Release ..." milestone — release milestones overlap (a patch and the next
          # minor can both be open at once), so nearest due date is what makes this the current one, never hardcoded.
          milestone=$(gh api "repos/${GITHUB_REPOSITORY}/milestones" --jq '
            [.[] | select(.state == "open" and (.title | test("^Kyverno Release ")))]
            | sort_by(.due_on // "9999-12-31")
            | .[0].title // empty')
          if [[ -z "$milestone" ]]; then
            echo "No open release milestone found, nothing to check."
            exit 0
          fi
          echo "Active milestone: $milestone"

          query='
            query($search: String!) {
              search(query: $search, type: ISSUE, first: 100) {
                nodes {
                  ... on PullRequest {
                    number
                    isDraft
                    author { login }
                    labels(first: 20) { nodes { name } }
                    commits(last: 1) {
                      nodes { commit {
                        committedDate
                        statusCheckRollup { contexts(first: 50) { nodes {
                          ... on CheckRun { name conclusion }
                          ... on StatusContext { context state }
                        } } }
                      } }
                    }
                    comments(last: 30) { nodes { author { login } body createdAt } }
                    reviewThreads(first: 50) {
                      nodes { isResolved comments(last: 1) { nodes { createdAt } } }
                    }
                  }
                }
              }
            }'
          search="repo:${GITHUB_REPOSITORY} is:pr is:open draft:false -author:app/dependabot milestone:\"$milestone\""

          gh api graphql -f query="$query" -f search="$search" --jq '.data.search.nodes[] | select(.isDraft | not)' \
            > prs.jsonl

          while IFS= read -r pr; do
            number=$(jq -r '.number' <<< "$pr")
            author=$(jq -r '.author.login' <<< "$pr")
            findings=$(jq -c -f readiness-checks.jq <<< "$pr")
            has_label=$(jq -r '[.labels.nodes[].name] | any(. == "needs-author-action")' <<< "$pr")

            if [[ "$findings" == "[]" ]]; then
              [[ "$has_label" == "true" ]] && gh pr edit "$number" --repo "${GITHUB_REPOSITORY}" --remove-label "needs-author-action"
              continue
            fi

            ids=$(jq -r '[.[].id] | sort | join(",")' <<< "$findings")
            marker="<!-- pr-readiness-check: $ids -->"
            already_reported=$(jq --arg m "$marker" '[.comments.nodes[] | select(.body | contains($m))] | length > 0' <<< "$pr")

            [[ "$has_label" == "false" ]] && gh pr edit "$number" --repo "${GITHUB_REPOSITORY}" --add-label "needs-author-action"
            [[ "$already_reported" == "true" ]] && continue

            items=$(jq -r '.[] | "- " + .message' <<< "$findings")
            body=$(printf '%s\n\n@%s this PR needs a bit more before it can be reviewed:\n%s' "$marker" "$author" "$items")

            gh pr comment "$number" --repo "${GITHUB_REPOSITORY}" --body "$body"
          done < prs.jsonl
