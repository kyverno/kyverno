# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Unit-test sharding pilot

permissions: {}

on:
  pull_request:
    branches:
      - main
      - release-*
    paths:
      - .github/workflows/check-unit-test-sharding.yaml
      - scripts/ci/unit_test_*
  workflow_dispatch:
    inputs:
      shards:
        description: Number of balanced package shards
        type: choice
        options:
          - '2'
          - '4'
        default: '4'

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helper-tests:
    name: Validate sharding helpers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go
        uses: ./.github/actions/go/install
      - name: Test sharding and coverage contracts
        run: python3 -m unittest discover -s scripts/ci -p 'unit_test_shards_test.py' -v

  shards:
    name: Pilot shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards == '2' && '[0,1]' || '[0,1,2,3]') }}
    env:
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_COUNT: ${{ inputs.shards || '4' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          android: true
          docker-images: false
          dotnet: false
          haskell: false
          large-packages: false
          swap-storage: false
          tool-cache: false
      - name: Setup Go
        uses: ./.github/actions/go/setup
        with:
          gobuild-cache-prefix: gobuild-unit-tests
          gobuild-cache-include-run-id: 'true'
      - name: Run balanced unit shard
        run: |
          python3 scripts/ci/unit_test_shards.py run \
            --index "$SHARD_INDEX" --count "$SHARD_COUNT" \
            --weights scripts/ci/unit_test_weights.json \
            --output "unit-shard-$SHARD_INDEX"
      - name: Upload pilot evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-shard-${{ matrix.shard }}
          path: unit-shard-${{ matrix.shard }}/
          retention-days: 7
          if-no-files-found: error

  aggregate:
    name: Validate pilot coverage
    if: always()
    needs:
      - helper-tests
      - shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HELPER_RESULT: ${{ needs.helper-tests.result }}
      SHARD_RESULT: ${{ needs.shards.result }}
      SHARD_COUNT: ${{ inputs.shards || '4' }}
    steps:
      - name: Require all jobs to succeed
        run: test "$HELPER_RESULT" = success && test "$SHARD_RESULT" = success
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download shard evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: unit-shard-*
          path: artifacts
      - name: Merge complete coverage
        run: |
          python3 scripts/ci/unit_test_shards.py merge \
            --root artifacts --count "$SHARD_COUNT" --output coverage.out
      - name: Install Go
        uses: ./.github/actions/go/install
      - name: Parse merged coverage
        run: go tool cover -func=coverage.out
      - name: Upload merged pilot coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pilot-coverage.out
          path: coverage.out
          retention-days: 7
          if-no-files-found: error
