      # create cluster
      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          version: ${{ needs.kubernetes-matrix.outputs.kind-version }}
          kubectl_version: ${{ matrix.k8s-version }}
          node_image: ${{ fromJSON(needs.kubernetes-matrix.outputs.images)[matrix.k8s-version] }}
          cluster_name: kind
          config: ./scripts/config/kind/default.yaml
      - name: Install Kyverno CLI
        shell: bash
        run: |
          set -e
          chmod +x kubectl-kyverno && mv kubectl-kyverno ./cmd/cli/kubectl-kyverno/kyverno
          echo "$PWD/cmd/cli/kubectl-kyverno" >> $GITHUB_PATH
      # run tests
      - name: Test with Chainsaw
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/release-reports"
          cd ./test/conformance/chainsaw/cli
          chainsaw test --config .chainsaw.yaml --report-format JSON --report-path "$GITHUB_WORKSPACE/release-reports" --report-name cli
      - name: Retain CLI conformance test results
        if: always() && inputs.release-candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-conformance-cli-${{ matrix.k8s-version }}-${{ github.run_attempt }}
          path: release-reports
          retention-days: 90
      # Same reports as the jobs that use the conformance action, for the
      # summarize job of the Tests workflow.
      - name: Prepare reports
        id: reports
        if: always()
        shell: bash
        env:
          K8S_VERSION: ${{ matrix.k8s-version }}
          OUTCOME: ${{ job.status }}
          JOB_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${{ job.check_run_id }}
        run: |
          set -e
          mkdir -p e2e-reports
          if [ -f release-reports/cli.json ]; then cp release-reports/cli.json e2e-reports/results.json; fi
          name="$(python3 ./scripts/e2e/report.py prepare --dir e2e-reports \
            --suite cli --k8s "$K8S_VERSION" --shard 0 --outcome "$OUTCOME" --job-url "$JOB_URL")"
          echo "artifact=$name" >> "$GITHUB_OUTPUT"
      - name: Upload reports
        if: always() && steps.reports.outputs.artifact != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.reports.outputs.artifact }}
          path: e2e-reports
          overwrite: true
          retention-days: 14
          if-no-files-found: ignore

  helm-tests:
    needs: kubernetes-matrix
    if: inputs.suites == '' || contains(fromJSON(inputs.suites), 'helm-tests')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        k8s-version: ${{ fromJSON(needs.kubernetes-matrix.outputs.versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.release-sha || github.sha }}
          persist-credentials: false
      - name: Install helm
        uses: ./.github/actions/tools/helm
      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          version: ${{ needs.kubernetes-matrix.outputs.kind-version }}
          kubectl_version: ${{ matrix.k8s-version }}
          node_image: ${{ fromJSON(needs.kubernetes-matrix.outputs.images)[matrix.k8s-version] }}
          cluster_name: kind
          config: ./scripts/config/kind/default.yaml
      - name: Download kyverno images archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kyverno.tar
      - name: Load kyverno images archive in kind cluster
        shell: bash
        run: |
          set -e
          kind load image-archive kyverno.tar --name kind
      - name: Verify legacy policy gate
        shell: bash
        # No VERIFY_ALLOW_DESTRUCTIVE override here: this cluster is created by
        # helm/kind-action, which is a thin wrapper around the same `kind create
        # cluster` used locally, so its context ("kind-<cluster_name>") and every
        # node's spec.providerID ("kind://docker/<cluster>/<node>") pass the
        # script's own live identity check on their own merits - verified by
        # actually running that check against both a local `kind create cluster`
        # and a cluster created from this exact kind config. Letting the check run
        # for real here (instead of bypassing it) is what actually exercises it in
        # CI.
        run: |
          set -e
          make verify-legacy-policy-gate
      - name: Install kyverno
        shell: bash
        run: |
          set -e
          make kind-install-kyverno
      - name: Wait for kyverno ready
        uses: ./.github/actions/kyverno/wait-ready
      - name: Verify legacy policy hook (e2e)
        shell: bash
        # Same rationale as the "Verify legacy policy gate" step above: no
        # VERIFY_ALLOW_DESTRUCTIVE override, so the script's live kind-identity
        # check (context name + every node's kind:// spec.providerID) actually
        # runs against this kind-action cluster instead of being bypassed.
        run: |
          set -e
          make verify-legacy-policy-hook
      - name: Helm test
        id: helm-test
        run: |
          set -e
          make helm-test
      - name: Debug failure
        if: failure()
        uses: ./.github/actions/kyverno/logs
      - name: Get logs from liveness pod
        if: failure() && steps.helm-test.outcome == 'failure'
        run: |
          if kubectl -n kyverno get pod kyverno-cleanup-controller-liveness --ignore-not-found -o name | grep -q .; then
            kubectl -n kyverno logs pod/kyverno-cleanup-controller-liveness
          else
            echo "Cleanup-controller liveness test pod was not created; inspect the earlier Helm failure."
          fi

