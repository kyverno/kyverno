      - name: Load kyverno images archive in kind cluster
        shell: bash
        run: |
          set -e
          kind load image-archive kyverno.tar --name kind
      - name: Verify legacy policy migration (upgrade, rollback, downgrade safety)
        shell: bash
        # No VERIFY_ALLOW_DESTRUCTIVE override: this cluster is created by
