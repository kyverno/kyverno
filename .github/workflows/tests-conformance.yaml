      matrix:
        k8s-version: ${{ fromJSON(inputs.release-candidate && needs.kubernetes-matrix.outputs.versions || needs.kubernetes-matrix.outputs.smoke-versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.release-sha || github.sha }}
          persist-credentials: false
      - name: Install helm
        uses: ./.github/actions/tools/helm
      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          version: ${{ needs.kubernetes-matrix.outputs.kind-version }}
          kubectl_version: ${{ matrix.k8s-version }}
          node_image: ${{ fromJSON(needs.kubernetes-matrix.outputs.images)[matrix.k8s-version] }}
          cluster_name: kind
          config: ./scripts/config/kind/default.yaml
      - name: Download kyverno images archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kyverno.tar
      - name: Load kyverno images archive in kind cluster
        shell: bash
        run: |
          set -e
          kind load image-archive kyverno.tar --name kind
      - name: Install kyverno
        shell: bash
        run: |
          set -ex
          make kind-install-kyverno
      - name: Wait for kyverno ready
        uses: ./.github/actions/kyverno/wait-ready
      - name: Check secret size
        shell: bash
        run: |
          set -e
          set -u
          SIZE=$(kubectl get secrets -n kyverno sh.helm.release.v1.kyverno.v1 -o jsonpath='{.data.release}' | base64 -d | wc -c | awk '{print $1}')
          MAX_ALLOWED=1030000
          if [ "$SIZE" -gt "$MAX_ALLOWED" ]; then
            echo "Helm secret size ($SIZE bytes) is above the max allowed ($MAX_ALLOWED bytes)"
            exit 1
          else
            echo "Helm secret size ($SIZE bytes) is below the max allowed ($MAX_ALLOWED bytes)"
          fi

  check-tests:
    needs: kubernetes-matrix
    if: inputs.suites == '' || contains(fromJSON(inputs.suites), 'check-tests')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        k8s-version: ${{ fromJSON(inputs.release-candidate && needs.kubernetes-matrix.outputs.versions || needs.kubernetes-matrix.outputs.smoke-versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.release-sha || github.sha }}
          persist-credentials: false
      - if: inputs.release-candidate
        uses: ./.github/actions/release/restore
      # install tools
      - name: Download kyverno CLI archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kubectl-kyverno
