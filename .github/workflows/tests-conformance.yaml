          node-image: ${{ fromJSON(needs.kubernetes-matrix.outputs.images)[matrix.k8s-version] }}
          kind-version: ${{ needs.kubernetes-matrix.outputs.kind-version }}
          kyverno-configs: standard,legacy-denial-probe
          token: ${{ secrets.GITHUB_TOKEN }}
          tests-path: deprecations
          chainsaw-tests: ${{ inputs.chainsaw-tests }}

  events:
