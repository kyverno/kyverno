# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Conformance tests

permissions: {}

on:
  workflow_call:
    inputs:
      release-candidate:
        type: boolean
        default: false
      release-sha:
        type: string
        default: ""
      matrix:
        description: >-
          Kubernetes versions to test: full runs every supported version,
          reduced runs only the oldest and the latest one, and a version from
          kubernetes-matrix.yaml, such as v1.36.4, runs only that version.
        type: string
        default: full
      ref:
        description: >-
          Commit to test instead of release-sha or the workflow commit. The
          /conformance PR comment command sets it to the PR head.
        type: string
        default: ""
      suites:
        description: >-
          JSON array of the job IDs to run, for example ["mutate"]. Empty runs
          every job.
        type: string
        default: ""
      chainsaw-tests:
        description: >-
          Regular expression that selects the chainsaw tests to run in each
          suite, passed to the conformance run action. Empty runs every test.
        type: string
        default: ""

env:
  RELEASE_CANDIDATE: ${{ inputs.release-candidate }}

# Every test job sets timeout-minutes: most finish in 5 to 10 minutes and the
# slowest observed in about 25. Without it, a hung job runs for the 6-hour
# default and holds the concurrency group of the calling Tests workflow.
jobs:
  kubernetes-matrix:
    uses: ./.github/workflows/kubernetes-matrix.yaml
    with:
      matrix: ${{ inputs.matrix }}

  assert:
    needs: kubernetes-matrix
    if: inputs.suites == '' || contains(fromJSON(inputs.suites), 'assert')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        k8s-version: ${{ fromJSON(needs.kubernetes-matrix.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.release-sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/tests/conformance/run
        with:
          k8s-version: ${{ matrix.k8s-version }}
          node-image: ${{ fromJSON(needs.kubernetes-matrix.outputs.images)[matrix.k8s-version] }}
          kind-version: ${{ needs.kubernetes-matrix.outputs.kind-version }}
          kyverno-configs: standard
          token: ${{ secrets.GITHUB_TOKEN }}
          tests-path: assert
          chainsaw-tests: ${{ inputs.chainsaw-tests }}

  cel-http:
    needs: kubernetes-matrix
    if: inputs.suites == '' || contains(fromJSON(inputs.suites), 'cel-http')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        k8s-version: ${{ fromJSON(needs.kubernetes-matrix.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.release-sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/tests/conformance/run
        with:
          k8s-version: ${{ matrix.k8s-version }}
          node-image: ${{ fromJSON(needs.kubernetes-matrix.outputs.images)[matrix.k8s-version] }}
          kind-version: ${{ needs.kubernetes-matrix.outputs.kind-version }}
          kyverno-configs: standard
          token: ${{ secrets.GITHUB_TOKEN }}
          tests-path: cel/http
          chainsaw-tests: ${{ inputs.chainsaw-tests }}

  deleting-policies:
    needs: kubernetes-matrix
    if: inputs.suites == '' || contains(fromJSON(inputs.suites), 'deleting-policies')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        k8s-version: ${{ fromJSON(needs.kubernetes-matrix.outputs.versions) }}
        shard-index: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.release-sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/tests/conformance/run
        with:
          k8s-version: ${{ matrix.k8s-version }}
          node-image: ${{ fromJSON(needs.kubernetes-matrix.outputs.images)[matrix.k8s-version] }}
          kind-version: ${{ needs.kubernetes-matrix.outputs.kind-version }}
          kyverno-configs: standard
          token: ${{ secrets.GITHUB_TOKEN }}
          tests-path: deleting-policies
          chainsaw-tests: ${{ inputs.chainsaw-tests }}
          shard-index: ${{ matrix.shard-index }}
          shard-count: 6

  deprecations:
    needs: kubernetes-matrix
    if: inputs.suites == '' || contains(fromJSON(inputs.suites), 'deprecations')
