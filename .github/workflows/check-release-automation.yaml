name: Release automation

permissions: {}

on:
  pull_request:
    branches: [main, release-*]
    paths:
      - .github/workflows/*release*.yaml
      - .github/workflows/tests-conformance*.yaml
      - .github/workflows/tests-k6.yaml
      - .github/actions/release/**
      - .github/actions/tools/helm/**
      - .github/actions/tests/conformance/**
      - scripts/release/**
      - config/releases.yaml
      - charts/kyverno/Chart.lock
      - .goreleaser.yml
      - .ko.yaml
      - .krew.yaml
      - Makefile
  push:
    branches: [main, release-*]
    paths:
      - .github/workflows/*release*.yaml
      - .github/actions/release/**
      - scripts/release/**
      - config/releases.yaml
      - charts/kyverno/Chart.lock
  # The release rehearsal costs about 1,000 runner-minutes, so pull requests
  # run it only when they change release files (see the changes job). The
  # nightly run covers the other paths above, such as Makefile and the
  # conformance workflows, after they merge.
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether a pull request runs the release rehearsal. Pull requests
  # that change only shared files, such as Makefile or the conformance
  # workflows, run the offline tests here and the rehearsal nightly.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      rehearsal: ${{ steps.files.outputs.rehearsal }}
    steps:
      - name: Find release files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          rehearsal=false
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/*release*.yaml|.github/actions/release/*|.github/actions/tools/helm/*|\
              scripts/release/*|config/releases.yaml|charts/kyverno/Chart.lock|\
              .goreleaser.yml|.ko.yaml|.krew.yaml)
                echo "Release file changed: $file"
                rehearsal=true
                ;;
            esac
          done < <(gh api --paginate "repos/$GH_REPO/pulls/$PR/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)')
          echo "rehearsal=$rehearsal" >> "$GITHUB_OUTPUT"
          if [ "$rehearsal" = false ]; then
            echo "No release files changed, so the release rehearsal runs nightly on the default branch instead." >> "$GITHUB_STEP_SUMMARY"
          fi

  # On pull requests the rehearsal runs unless the changes job found no
  # release files, so a failed changes job still runs it.
  rehearsal:
    needs: changes
    if: >-
      !cancelled() &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.rehearsal != 'false'))
    permissions:
      contents: read
      actions: read
      packages: read
    uses: ./.github/workflows/release-validate.yaml
    with:
      tag: v1.20.0-rc.0
      sha: ${{ github.sha }}
      rehearsal: true

  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m pip install -r scripts/release/requirements.txt
      - name: Version, artifact, workflow gate and interrupted-retry regressions
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py' -v
      - uses: ./.github/actions/tools/yq
      - name: Conformance quarantine script
        run: .github/actions/tests/conformance/run/quarantine_test.sh
      - uses: ./.github/actions/go/setup
      - name: Validate workflow syntax and cross-workflow contracts
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes= \
            .github/workflows/check-release-automation.yaml \
            .github/workflows/prepare-release.yaml \
            .github/workflows/release.yaml \
            .github/workflows/release-publish.yaml \
            .github/workflows/release-validate.yaml \
            .github/workflows/helm-release.yaml \
            .github/workflows/tests-conformance.yaml \
            .github/workflows/tests-k6.yaml

  prepare-charts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: [v1.20.2, v1.20.2-rc3, v1.20.2-rc.3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go/setup
      - uses: ./.github/actions/tools/helm
      - run: python3 -m pip install -r scripts/release/requirements.txt
      - name: Prepare and verify real chart packages without a tag or publication
        env:
          RELEASE_TAG: ${{ matrix.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python3 scripts/release/release.py prepare
          python3 scripts/release/release.py seal
          python3 scripts/release/release.py verify-packages
          helm lint --strict .release/packages/*.tgz

  # A failed nightly or manual rehearsal opens or updates a tracking issue,
  # because nobody watches scheduled runs.
  sync-issue:
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs:
      - rehearsal
      - offline-tests
      - prepare-charts
    permissions:
      issues: write
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sync issue
        uses: ./.github/actions/workflow/failure-issue
        with:
          conclusion: ${{ contains(needs.*.result, 'failure') && 'failure' || job.status }}
          needs: ${{ toJSON(needs) }}
