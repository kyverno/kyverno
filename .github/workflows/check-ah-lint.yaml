# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Artifact Hub

permissions: {}

on:
  pull_request:
    branches:
      - main
      - release-*
  push:
    branches:
      - main
      - release-*

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Artifact Hub (lint)
    runs-on: ubuntu-latest
    outputs:
      ran: ${{ steps.changed-files.outputs.any_modified }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Required for tj-actions/changed-files on push (compare to preceding commit); OK for pull_request too.
          fetch-depth: 0
      - name: Check for chart changes
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            charts/**
            .github/workflows/check-ah-lint.yaml
      - name: Run ah lint
        if: steps.changed-files.outputs.any_modified == 'true'
        run: docker run --rm --user root -v "$PWD:/work" -w /work/charts artifacthub/ah lint

  sync-issue:
    if: |
      always() &&
      github.event_name == 'push' &&
      (needs.check.result == 'failure' || needs.check.outputs.ran == 'true')
    needs:
      - check
    permissions:
      issues: write
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sync issue
        uses: ./.github/actions/workflow/failure-issue
        with:
          conclusion: ${{ contains(needs.*.result, 'failure') && 'failure' || job.status }}
          needs: ${{ toJSON(needs) }}
