# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: PR Labelling

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  labeler:
    # The shared workflow holds several jobs, so the caller grants their union; this job's own token is limited to
    # contents: read, issues: write and pull-requests: write.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
      actions: read
    uses: kyverno/assistant/.github/workflows/pr-management.yml@e2d2f01371144e88e99fdf124e885bf4879c705e
    with:
      mode: labels
      dry-run: 'false'
