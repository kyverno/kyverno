name: Shared PR management
description: Label PRs, evaluate review readiness, and manage stale PRs using trusted repository configuration
inputs:
  mode:
    description: labels, readiness, stale, sync-labels, or validate (offline configuration validation)
    required: true
  config:
    description: Trusted repository configuration JSON
    default: .github/pr-management.json
  readiness-checks:
    description: Trusted repository-specific jq checks
    default: .github/pr-readiness-checks.yml
  dry-run:
    description: Preview only; must be the string true or false
    default: 'true'
  stale-days:
    description: Days without a new commit before marking stale
    default: '7'
  review-nudge-days:
    description: Days without maintainer activity before nudging reviewers
    default: '7'
runs:
  using: composite
  steps:
    - name: Check runtime tools
      shell: bash
      env:
        PR_MODE: ${{ inputs.mode }}
      run: |
        command -v python3 ruby jq
        if [[ "$PR_MODE" != "validate" ]]; then command -v gh; fi
    - name: Run shared PR management
      id: manage
      shell: bash
      env:
        PR_MODE: ${{ inputs.mode }}
        PR_CONFIG: ${{ inputs.config }}
        READINESS_CHECKS: ${{ inputs.readiness-checks }}
        DRY_RUN: ${{ inputs.dry-run }}
        STALE_DAYS: ${{ inputs.stale-days }}
        NUDGE_DAYS: ${{ inputs.review-nudge-days }}
      run: python3 "$GITHUB_ACTION_PATH/run.py"
    - name: Label PR based on changed files
      if: inputs.mode == 'labels' && inputs.dry-run == 'false' && github.event_name == 'pull_request_target'
      uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
      with:
        repo-token: ${{ env.GH_TOKEN }}
        configuration-path: ${{ steps.manage.outputs.configuration-path }}
        sync-labels: true
    - name: Check merge conflicts
      if: inputs.mode == 'labels' && inputs.dry-run == 'false'
      uses: eps1lon/actions-label-merge-conflict@1df065ebe6e3310545d4f4c4e862e43bdca146f0 # v3.0.3
      with:
        dirtyLabel: merge-conflicts
        repoToken: ${{ env.GH_TOKEN }}
    - name: Remove generated label rules
      if: always() && steps.manage.outputs.configuration-path != ''
      shell: bash
      env:
        GENERATED: ${{ steps.manage.outputs.configuration-path }}
      run: rm -- "$GENERATED"
