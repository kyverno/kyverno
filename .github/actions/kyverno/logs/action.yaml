name: Kyverno logs

description: >-
  Show kyverno pods logs. With artifact-name, also upload a diagnostics
  artifact with logs from all Kyverno pods, events, webhook configurations,
  policies with their status, and reports.

inputs:
  artifact-name:
    description: Name of the diagnostics artifact to upload. Leave it empty to only print logs.
    default: ''

runs:
  using: composite
  steps:
    # Collect diagnostics first and always: the steps below stop at the first
    # command that fails, for example when a controller isn't deployed.
    - name: Collect diagnostics
      if: always() && inputs.artifact-name != ''
      shell: bash
      run: |
        "$GITHUB_ACTION_PATH/diagnostics.sh" "$RUNNER_TEMP/diagnostics"
    - name: Upload diagnostics
      if: always() && inputs.artifact-name != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/diagnostics
        # A re-run attempt replaces the diagnostics of the failed attempt.
        overwrite: true
        retention-days: 14
        if-no-files-found: ignore
    - shell: bash
      run: |
        set -e
        kubectl get mutatingwebhookconfigurations
    - shell: bash
      run: |
        set -e
        kubectl get validatingwebhookconfigurations
    - shell: bash
      run: |
        set -e
        kubectl auth can-i --list --as system:serviceaccount:kyverno:kyverno-background-controller 
    - shell: bash
      run: |
        set -e
        kubectl -n kyverno get pod
    - shell: bash
      run: |
        set -e
        # kubectl 1.36+ hides events when describing several objects, and a failed grep
        # here would skip the controller logs below.
        kubectl -n kyverno describe pod --show-events=true | grep -i events -A10 || true
    - shell: bash
      run: |
        set -e
        kubectl -n kyverno logs deploy/kyverno-admission-controller --all-containers
    - shell: bash
      run: |
        set -e
        kubectl -n kyverno logs deploy/kyverno-background-controller --all-containers
    - shell: bash
      run: |
        set -e
        kubectl -n kyverno logs deploy/kyverno-reports-controller --all-containers
    - shell: bash
      run: |
        set -e
        kubectl -n kyverno logs deploy/kyverno-cleanup-controller --all-containers
