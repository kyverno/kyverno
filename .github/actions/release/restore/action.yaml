name: Restore tested release workspace
description: Use retained chart packages and CRDs for release validation without dependency updates
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: release-workspace
    - shell: sh
      run: |
        set -eu
        sha256sum -c release-workspace.sha256
        tar -xf workspace.tar
        chart=$(find .release/packages -name 'kyverno-[0-9]*.tgz')
        test -f "$chart"
        echo "RELEASE_MODE=true" >> "$GITHUB_ENV"
        echo "RELEASE_RESTORED=true" >> "$GITHUB_ENV"
        echo "KYVERNO_TEST_CHART=$chart" >> "$GITHUB_ENV"
