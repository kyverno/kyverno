name: Restore sealed release candidate
description: Restore and verify immutable retained artifacts without rebuilding
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.13"
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release-candidate
    - shell: bash
      run: |
        set -euo pipefail
        python3 -m pip install -r scripts/release/requirements.txt
        tar -xf release-candidate.tar
        python3 scripts/release/release.py check-seal
        tar -xf .release/workspace.tar
