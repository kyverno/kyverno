name: 'Cherry Pick Action'
description: 'Creates cherry-pick PRs from a merge commit'
inputs:
  github-token:
    description: 'GitHub token for authentication'
    required: true
  source-pr:
    description: 'Source PR number'
    required: true
  source-pr-title:
    description: 'Title of the PR to cherry-pick'
    required: true
  target-branches:
    description: 'Target branches for cherry-pick (comma-separated)'
    required: true
  merge-commit:
    description: 'Merge commit SHA'
    required: true
outputs:
  success:
    description: 'Boolean indicating if all cherry-picks succeeded'
    value: ${{ steps.cherry-pick.outputs.success }}
  git-logs:
    description: 'Git logs in case of failure'
    value: ${{ steps.cherry-pick.outputs.git-logs}}

runs:
  using: 'composite'
  steps:
    - name: Configure Git
      shell: bash
      run: |
        git config --global user.name "kyverno-bot"
        git config --global user.email "104836976+kyverno-bot@users.noreply.github.com"
    - name: Install GitHub CLI
      shell: bash
      run: |
        sudo apt update
        sudo apt install gh -y
    - name: Authenticate gh
      shell: bash
      run: |
        if [ -z "$GH_TOKEN" ]; then
          echo "::error::github-token input is empty, check the workflow secrets configuration"
          exit 1
        fi
        gh auth setup-git
      env:
        GH_TOKEN: ${{ inputs.github-token }}
    - name: Create cherry-pick PRs
      id: cherry-pick
      shell: bash
      continue-on-error: true
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        SOURCE_PR: ${{ inputs.source-pr }}
        SOURCE_PR_TITLE: ${{ inputs.source-pr-title }}
        TARGET_BRANCHES: ${{ inputs.target-branches }}
        MERGE_COMMIT: ${{ inputs.merge-commit }}
      run: |
        set -uo pipefail
        # Helper: always emit the declared outputs before exiting early,
        # otherwise `continue-on-error: true` leaves `success` unset.
        write_outputs() {
          echo "success=${success:-false}" >> "$GITHUB_OUTPUT"
          delimiter="GITLOGS_EOF_${RANDOM}_$(date +%s)"
          echo "git-logs<<${delimiter}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${git_logs:-}" >> "$GITHUB_OUTPUT"
          echo "${delimiter}" >> "$GITHUB_OUTPUT"
        }
        # Pure-bash trim (no `xargs`: it reparses quotes/backslashes and can
        # map a different branch name through validation).
        trim() {
          local var="$1"
          var="${var#"${var%%[![:space:]]*}"}"
          var="${var%"${var##*[![:space:]]}"}"
          printf '%s' "$var"
        }
        # Validate inputs (defense-in-depth against injection / malformed data)
        if ! [[ "$SOURCE_PR" =~ ^[0-9]+$ ]]; then
          echo "::error::Invalid source-pr: $SOURCE_PR" >&2
          success=false
          git_logs=""
          write_outputs
          exit 1
        fi
        if ! [[ "$MERGE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
          echo "::error::Invalid merge-commit, expected 40-char SHA: $MERGE_COMMIT" >&2
          success=false
          git_logs=""
          write_outputs
          exit 1
        fi
        IFS=',' read -ra BRANCHES <<< "$TARGET_BRANCHES"
        success=true
        git_logs=""

        for target_branch in "${BRANCHES[@]}"; do
          # Trim whitespace
          target_branch="$(trim "$target_branch")"
          if [ -z "$target_branch" ]; then
            continue
          fi
          if ! git check-ref-format --branch "$target_branch"; then
            echo "::error::Invalid target branch name: $target_branch" >&2
            success=false
            continue
          fi
          echo "🔄 Cherry-picking to $target_branch..."

          pr_branch_name="cherry-pick-${SOURCE_PR}-${target_branch}"
          if ! git check-ref-format --branch "$pr_branch_name"; then
            echo "::error::Invalid cherry-pick branch name: $pr_branch_name" >&2
            success=false
            continue
          fi

          if ! git fetch --prune origin "$target_branch"; then
            echo "::error::Failed to fetch $target_branch" >&2
            success=false
            continue
          fi
          if ! git checkout -B "$pr_branch_name" "origin/$target_branch"; then
            echo "::error::Failed to checkout $pr_branch_name from origin/$target_branch" >&2
            success=false
            continue
          fi

          if cherry_out=$(git cherry-pick -s -m 1 "$MERGE_COMMIT" 2>&1); then
            if ! git push --force-with-lease origin "$pr_branch_name"; then
              echo "::error::Failed to push $pr_branch_name" >&2
              success=false
              continue
            fi

            existing=""
            if ! existing=$(gh pr list --base "$target_branch" --head "$pr_branch_name" --state open --json number --jq '.[0].number' 2>&1); then
              echo "::error::Failed to list existing PRs for $pr_branch_name: $existing" >&2
              success=false
              continue
            fi
            if printf '%s' "$existing" | grep -q .; then
              echo "PR from '$pr_branch_name' to '$target_branch' already exists. Skipping creation"
            else
              if ! gh pr create \
                --title "$SOURCE_PR_TITLE (Cherry-pick #$SOURCE_PR)" \
                --body "Cherry-pick #$SOURCE_PR" \
                --base "$target_branch" \
                --head "$pr_branch_name"; then
                echo "::error::Failed to create PR from $pr_branch_name to $target_branch" >&2
                success=false
                continue
              fi
            fi
          else
            echo "❌ Error while cherry picking into ${target_branch}"
            git_logs+="${cherry_out}"$'\n'
            git cherry-pick --abort || true
            success=false
            continue
          fi
        done

        write_outputs
