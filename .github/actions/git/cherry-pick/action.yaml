name: 'Cherry Pick Action'
description: 'Creates cherry-pick PRs from a merge commit'
inputs:
  github-token:
    description: 'GitHub token for authentication'
    required: true
  source-pr:
    description: 'Source PR number'
    required: true
  source-pr-title:
    description: 'Title of the PR to cherry-pick'
    required: true
  target-branches:
    description: 'Target branches for cherry-pick (comma-separated)'
    required: true
  merge-commit:
    description: 'Merge commit SHA'
    required: true
outputs:
  success:
    description: 'True if all targets were handled, including draft PRs requiring conflict resolution'
    value: ${{ steps.cherry-pick.outputs.success }}
  git-logs:
    description: 'Git logs in case of failure'
    value: ${{ steps.cherry-pick.outputs.git-logs}}

runs:
  using: 'composite'
  steps:
    - name: Validate cherry-pick inputs
      shell: bash
      env:
        SOURCE_PR: ${{ inputs.source-pr }}
        MERGE_COMMIT: ${{ inputs.merge-commit }}
        TARGET_BRANCHES: ${{ inputs.target-branches }}
      run: |
        set -euo pipefail
        if [[ ! "$SOURCE_PR" =~ ^[1-9][0-9]*$ ]] ||
           [[ ! "$MERGE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]] ||
           [[ ! "$TARGET_BRANCHES" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*(,[A-Za-z0-9][A-Za-z0-9._/-]*)*$ ]]; then
          echo "::error::Invalid cherry-pick inputs"
          exit 1
        fi
        IFS=',' read -ra branches <<< "$TARGET_BRANCHES"
        for branch in "${branches[@]}"; do
          git check-ref-format "refs/heads/$branch"
          git check-ref-format "refs/heads/cherry-pick-$SOURCE_PR-$branch"
        done
    - name: Configure Git
      shell: bash
      run: |
        git config --global user.name "kyverno-bot"
        git config --global user.email "104836976+kyverno-bot@users.noreply.github.com"
    - name: Install GitHub CLI
      shell: bash
      run: |
        sudo apt update
        sudo apt install gh -y
    - name: Authenticate gh
      shell: bash
      run: |
        if [ -z "$GH_TOKEN" ]; then
          echo "::error::github-token input is empty, check the workflow secrets configuration"
          exit 1
        fi
        gh auth setup-git
      env:
        GH_TOKEN: ${{ inputs.github-token }}
    - name: Create cherry-pick PRs
      id: cherry-pick
      shell: bash
      run: |
        set -euo pipefail
        IFS=',' read -ra BRANCHES <<< "$TARGET_BRANCHES"
        success=true
        git_logs="$(mktemp)"
        cherry_pick_log="$(mktemp)"
        pr_body="$(mktemp)"
        template="$(mktemp)"
        stage="preparing pull request template"
        finish() {
          status=$?
          if [[ "$status" != 0 ]]; then
            success=false
            echo "::error::Cherry-pick failed while $stage"
            printf 'Failed while %s. See the step logs for details.\n' "$stage" >> "$git_logs"
          fi
          delimiter="CHERRY_PICK_LOGS_${RANDOM}_${RANDOM}"
          while grep -qx "$delimiter" "$git_logs"; do
            delimiter="CHERRY_PICK_LOGS_${RANDOM}_${RANDOM}"
          done
          {
            echo "success=${success}"
            echo "git-logs<<$delimiter"
            cat "$git_logs"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            {
              echo "## Cherry-pick results"
              cat "$git_logs"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -f "$git_logs" "$cherry_pick_log" "$pr_body" "$template"
        }
        trap finish EXIT
        cp .github/PULL_REQUEST_TEMPLATE.md "$template"
        stage="checking target branches"

        # Check every exact remote head before changing any branches.
        for target_branch in "${BRANCHES[@]}"; do
          git ls-remote --exit-code --heads origin "refs/heads/$target_branch" > /dev/null
        done
        
        for target_branch in "${BRANCHES[@]}"; do
          echo "🔄 Cherry-picking to $target_branch..."
        
          pr_branch_name="cherry-pick-$SOURCE_PR-$target_branch"

          stage="checking existing backports for $target_branch"
          existing_pr="$(gh pr list --base "$target_branch" --head "$pr_branch_name" --state all --json number,state --jq '.[] | "\(.number) \(.state)"')"
          if [[ -n "$existing_pr" ]]; then
            read -r existing_number existing_state <<< "$existing_pr"
            printf 'Existing backport #%s for %s left unchanged (%s).\n' "$existing_number" "$target_branch" "$existing_state" | tee -a "$git_logs"
            if [[ "$existing_state" == CLOSED ]]; then
              echo "::error::Backport #$existing_number was closed without merging; reopen it or backport manually"
              success=false
            fi
            continue
          fi
          # An orphaned branch may contain maintainer work or a PR-creation retry.
          existing_branch="$(git ls-remote --heads origin "refs/heads/$pr_branch_name")"
          if [[ -n "$existing_branch" ]]; then
            echo "::error::Branch $pr_branch_name already exists without a PR; inspect it and open a PR manually"
            success=false
            printf 'Existing branch %s left unchanged; open its PR manually.\n' "$pr_branch_name" >> "$git_logs"
            continue
          fi

          stage="fetching $target_branch"
          git fetch --prune origin "+refs/heads/$target_branch:refs/remotes/origin/$target_branch"
          git checkout -B "$pr_branch_name" "refs/remotes/origin/$target_branch"

          pr_args=(--base "$target_branch" --head "$pr_branch_name")
          resolution=""
          conflict_files=""
          stage="cherry-picking into $target_branch"
          if git cherry-pick -s -m 1 "$MERGE_COMMIT" > "$cherry_pick_log" 2>&1; then
            cat "$cherry_pick_log"
          else
            cat "$cherry_pick_log"
            printf 'Branch: %s\n' "$target_branch" >> "$git_logs"
            cat "$cherry_pick_log" >> "$git_logs"
            conflict_files="$(git diff --name-only --diff-filter=U)"
            if [[ -n "$conflict_files" ]]; then
              echo "::warning::Conflicts in $target_branch; creating a draft PR for manual resolution"
              # Git cannot push an unmerged index. Preserve its worktree as a draft.
              printf 'Source commit: %s\nConflicted paths:\n%s\n' "$MERGE_COMMIT" "$conflict_files" > .github/cherry-pick-conflicts
              git add --all
              git -c core.hooksPath=/dev/null commit -s --no-edit
              pr_args+=(--draft)
              resolution=" (draft; manual conflict resolution required)"
            elif [[ -f "$(git rev-parse --git-path CHERRY_PICK_HEAD)" ]] &&
                 git diff --quiet && git diff --cached --quiet; then
              git cherry-pick --abort
              printf 'No changes needed for %s; cherry-pick is empty/already applied.\n' "$target_branch" | tee -a "$git_logs"
              continue
            else
              if [[ -f "$(git rev-parse --git-path CHERRY_PICK_HEAD)" ]]; then
                git cherry-pick --abort
              fi
              echo "::error::Non-conflict cherry-pick failure for $target_branch"
              success=false
              continue
            fi
          fi

          {
            cat "$template"
            printf '\n## Backport details\n\nCherry-pick #%s to `%s` from `%s`.\n' "$SOURCE_PR" "$target_branch" "$MERGE_COMMIT"
            printf '\nWorkflow: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            if [[ -n "$resolution" ]]; then
              printf '\n**Manual conflict resolution required. Do not merge this draft as-is.**\n\nConflicted paths:\n\n```\n%s\n```\n' "$conflict_files"
              printf '\nCheckout `%s`, resolve every listed path (including binary and modify/delete conflicts), remove conflict markers and delete `.github/cherry-pick-conflicts`, then commit and push. The conflict state is already committed; do not run `git cherry-pick --continue`. Validate the backport before marking it ready for review.\n' "$pr_branch_name"
            fi
          } > "$pr_body"

          stage="pushing $pr_branch_name (workflow changes require Workflows: write)"
          # Require the branch to be absent, including if another run raced us.
          if ! git push --force-with-lease="refs/heads/$pr_branch_name:" origin "refs/heads/$pr_branch_name:refs/heads/$pr_branch_name" > "$cherry_pick_log" 2>&1; then
            printf 'Failed while %s.\n' "$stage" >> "$git_logs"
            tee -a "$git_logs" < "$cherry_pick_log"
            success=false
            continue
          fi
          cat "$cherry_pick_log"
          stage="creating PR for $target_branch"
          if ! pr_url="$(gh pr create \
            "${pr_args[@]}" \
            --title "$SOURCE_PR_TITLE (Cherry-pick #$SOURCE_PR)" \
            --body-file "$pr_body" 2>"$cherry_pick_log")"; then
            printf 'Failed while %s. Branch %s was preserved; open its PR manually.\n' "$stage" "$pr_branch_name" >> "$git_logs"
            printf '%s\n' "$pr_url" >> "$git_logs"
            tee -a "$git_logs" < "$cherry_pick_log"
            success=false
            continue
          fi
          cat "$cherry_pick_log"
          printf '%s%s\n' "$pr_url" "$resolution" | tee -a "$git_logs"
        done
        stage="finishing cherry-pick targets (see per-target results)"
        [[ "$success" == true ]]
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        SOURCE_PR: ${{ inputs.source-pr }}
        SOURCE_PR_TITLE: ${{ inputs.source-pr-title }}
        MERGE_COMMIT: ${{ inputs.merge-commit }}
        TARGET_BRANCHES: ${{ inputs.target-branches }}
