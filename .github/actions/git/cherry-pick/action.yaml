name: 'Cherry Pick Action'
description: 'Creates cherry-pick PRs from a merge commit'
inputs:
  github-token:
    description: 'GitHub token for authentication'
    required: true
  source-pr:
    description: 'Source PR number'
    required: true
  source-pr-title:
    description: 'Title of the PR to cherry-pick'
    required: true
  target-branches:
    description: 'Target branches for cherry-pick (comma-separated)'
    required: true
  merge-commit:
    description: 'Merge commit SHA'
    required: true
outputs:
  success:
    description: 'Boolean indicating if all cherry-picks succeeded'
    value: ${{ steps.cherry-pick.outputs.success }}
  git-logs:
    description: 'Git logs in case of failure'
    value: ${{ steps.cherry-pick.outputs.git-logs}}

runs:
  using: 'composite'
  steps:
    - name: Validate cherry-pick inputs
      shell: bash
      env:
        SOURCE_PR: ${{ inputs.source-pr }}
        MERGE_COMMIT: ${{ inputs.merge-commit }}
        TARGET_BRANCHES: ${{ inputs.target-branches }}
      run: |
        set -euo pipefail
        if [[ ! "$SOURCE_PR" =~ ^[1-9][0-9]*$ ]] ||
           [[ ! "$MERGE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]] ||
           [[ ! "$TARGET_BRANCHES" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*(,[A-Za-z0-9][A-Za-z0-9._/-]*)*$ ]]; then
          echo "::error::Invalid cherry-pick inputs"
          exit 1
        fi
        IFS=',' read -ra branches <<< "$TARGET_BRANCHES"
        for branch in "${branches[@]}"; do
          git check-ref-format "refs/heads/$branch"
          git check-ref-format "refs/heads/cherry-pick-$SOURCE_PR-$branch"
        done
    - name: Configure Git
      shell: bash
      run: |
        git config --global user.name "kyverno-bot"
        git config --global user.email "104836976+kyverno-bot@users.noreply.github.com"
    - name: Install GitHub CLI
      shell: bash
      run: |
        sudo apt update
        sudo apt install gh -y
    - name: Authenticate gh
      shell: bash
      run: gh auth setup-git
      env:
        GH_TOKEN: ${{ inputs.github-token }}
    - name: Create cherry-pick PRs
      id: cherry-pick
      shell: bash
      run: |
        set -euo pipefail
        echo "success=false" >> "$GITHUB_OUTPUT"
        IFS=',' read -ra BRANCHES <<< "$TARGET_BRANCHES"
        success=true
        git_logs="$(mktemp)"
        cherry_pick_log="$(mktemp)"
        trap 'rm -f "$git_logs" "$cherry_pick_log"' EXIT

        # Check every exact remote head before changing any branches.
        for target_branch in "${BRANCHES[@]}"; do
          git ls-remote --exit-code --heads origin "refs/heads/$target_branch" > /dev/null
        done
        
        for target_branch in "${BRANCHES[@]}"; do
          echo "🔄 Cherry-picking to $target_branch..."
        
          pr_branch_name="cherry-pick-$SOURCE_PR-$target_branch"
        
          git fetch --prune origin "+refs/heads/$target_branch:refs/remotes/origin/$target_branch"
          git checkout -B "$pr_branch_name" "refs/remotes/origin/$target_branch"
        

          if git cherry-pick -s -m 1 "$MERGE_COMMIT" > "$cherry_pick_log" 2>&1; then
            cat "$cherry_pick_log"
            git push --force-with-lease origin "refs/heads/$pr_branch_name:refs/heads/$pr_branch_name"
        
            existing_pr="$(gh pr list --base "$target_branch" --head "$pr_branch_name" --state open --json number --jq '.[0].number // empty')"
            if [[ -n "$existing_pr" ]]; then
              echo "PR from '$pr_branch_name' to '$target_branch' already exists. Skipping creation"
            else
              gh pr create \
                --title "$SOURCE_PR_TITLE (Cherry-pick #$SOURCE_PR)" \
                --body "Cherry-pick #$SOURCE_PR" \
                --base "$target_branch" \
                --head "$pr_branch_name"
            fi
          else
            echo "❌ Error while cherry picking into ${target_branch}"
            cat "$cherry_pick_log"
            printf 'Branch: %s\n' "$target_branch" >> "$git_logs"
            cat "$cherry_pick_log" >> "$git_logs"
            git cherry-pick --abort
            success=false
            continue
          fi
        done
        
        delimiter="CHERRY_PICK_LOGS_${RANDOM}_${RANDOM}"
        while grep -qx "$delimiter" "$git_logs"; do
          delimiter="CHERRY_PICK_LOGS_${RANDOM}_${RANDOM}"
        done
        {
          echo "success=${success}"
          echo "git-logs<<$delimiter"
          cat "$git_logs"
          echo "$delimiter"
        } >> "$GITHUB_OUTPUT"
        [[ "$success" == true ]]
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        SOURCE_PR: ${{ inputs.source-pr }}
        SOURCE_PR_TITLE: ${{ inputs.source-pr-title }}
        MERGE_COMMIT: ${{ inputs.merge-commit }}
        TARGET_BRANCHES: ${{ inputs.target-branches }}
