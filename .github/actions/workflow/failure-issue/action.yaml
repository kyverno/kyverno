# yaml-language-server: $schema=https://json.schemastore.org/github-action.json

name: Workflow failure issue
description: Create or close a tracking issue based on workflow run conclusion.

inputs:
  conclusion:
    description: 'Workflow conclusion (failure, cancelled, success, etc.)'
    required: true
  needs:
    description: 'needs context serialized as JSON (toJSON(needs))'
    required: false
    default: '{}'

runs:
  using: composite
  steps:
    - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
      with:
        script: |
          const { owner, repo } = context.repo;

          const workflowName = context.workflow;
          const runId = context.runId;
          const conclusion = '${{ inputs.conclusion }}';
          const needs = ${{ inputs.needs }};

          /**
           * @param {Record<string, { result?: string } | undefined>} needsObj
           */
          function formatNeedsResultsTable(needsObj) {
            if (!needsObj || typeof needsObj !== 'object') {
              return [];
            }
            const entries = Object.entries(needsObj);
            if (entries.length === 0) {
              return [];
            }
            const lines = [
              '### Job results',
              '',
              '| Job | Result |',
              '| --- | --- |',
            ];
            for (const [jobName, info] of entries) {
              const result =
                info != null && typeof info === 'object' && info.result != null
                  ? String(info.result)
                  : '—';
              lines.push(`| \`${jobName}\` | \`${result}\` |`);
            }
            return ['', ...lines, ''];
          }

          /**
           * List the run's failed job instances.
           *
           * The needs context collapses a matrix to one row, so a matrix job
           * reports a single result and the individual failing instances are
           * lost. This recovers them from the jobs API; their failing log
           * excerpts are fetched per job further down, with the same
           * fall-back behaviour.
           *
           * On a public repository the jobs API and job logs are readable
           * with the default token — observed with one holding only
           * `issues: write` + `metadata: read` — so callers need no extra
           * permission. On a private repository the calling job must grant
           * `actions: read`; a composite action cannot grant it for itself.
           * Any error is reported via core.warning() — visible in the run
           * summary, where CI diagnostics belong — and the issue body is
           * left exactly as it would have been without this addition.
           *
           * @returns {Promise<{ failed: { id: number, name: string }[] } | { error: string }>}
           */
          async function listFailedJobs() {
            try {
              const jobs = await github.paginate(
                github.rest.actions.listJobsForWorkflowRun,
                { owner, repo, run_id: runId, filter: 'latest', per_page: 100 }
              );
              // Jobs still running — including the one executing this action —
              // have no conclusion yet. Exclude them rather than counting them
              // as passed.
              const failed = jobs
                .filter(j => j.status === 'completed' && j.conclusion === 'failure')
                .map(j => ({ id: j.id, name: j.name, url: j.html_url }));
              return { failed };
            } catch (err) {
              const reason = err.status === 403
                ? 'the calling job does not grant `actions: read`'
                : (err.message || String(err));
              core.warning(`Could not list job results (${reason}); the issue body will not include per-job detail.`);
              return { error: reason };
            }
          }

          const EXCERPT_JOBS = 10;      // failed jobs that get a log excerpt
          const EXCERPT_LINES = 40;     // excerpt window, in lines
          const EXCERPT_CHARS = 3000;   // per-excerpt cap, after stripping
          const SECTION_BUDGET = 45000; // total excerpt chars; the body limit is 65,536

          /**
           * The failing excerpt of a job log: the window that ends at the
           * last ##[error] marker — the failure text sits directly above it,
           * and below it is post-step cleanup noise — or the tail when no
           * marker is present. Per-line timestamps and ANSI escapes are
           * stripped.
           *
           * @param {string} rawLog
           */
          function extractFailingExcerpt(rawLog) {
            const lines = String(rawLog).split('\n').map(l => l
              .replace(/^\S+T\S+Z /, '')
              .replace(/\x1b\[[0-9;]*[A-Za-z]/g, ''));
            let end = lines.length;
            for (let i = lines.length - 1; i >= 0; i--) {
              if (lines[i].includes('##[error]')) { end = i + 1; break; }
            }
            // The runner wraps scaffolding — setup info and the echoed step
            // script — in ##[group] blocks, so the step's real output starts
            // after the last ##[endgroup] preceding the error marker.
            let start = 0;
            for (let i = end - 1; i >= 0; i--) {
              if (lines[i].startsWith('##[endgroup]')) { start = i + 1; break; }
            }
            start = Math.max(start, end - EXCERPT_LINES);
            let text = lines.slice(start, end).join('\n').trim();
            if (text.length > EXCERPT_CHARS) {
              text = '…' + text.slice(text.length - EXCERPT_CHARS);
            }
            return text;
          }

          /**
           * @param {number} jobId
           * @returns {Promise<string | null>} null when the log is unavailable;
           * the job is then listed by name only, exactly as before.
           */
          async function downloadLogExcerpt(jobId) {
            try {
              const res = await github.rest.actions.downloadJobLogsForWorkflowRun(
                { owner, repo, job_id: jobId }
              );
              const raw = typeof res.data === 'string'
                ? res.data
                : Buffer.from(res.data).toString('utf8');
              const text = extractFailingExcerpt(raw);
              return text.length > 0 ? text : null;
            } catch (err) {
              core.warning(`Could not fetch logs for job ${jobId} (${err.message || String(err)}); listing it by name only.`);
              return null;
            }
          }

          const escapeHtml = s =>
            s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

          /** A code fence longer than any backtick run inside the excerpt. */
          function fenceFor(text) {
            let longest = 2;
            for (const m of text.matchAll(/`+/g)) {
              longest = Math.max(longest, m[0].length);
            }
            return '`'.repeat(longest + 1);
          }

          /**
           * @param {{ failed: { id: number, name: string }[] } | { error: string }} result
           */
          async function formatFailedJobsSection(result) {
            // On error the body is left byte-identical to the pre-change output;
            // the reason is already in the run log via core.warning().
            if (result.error || result.failed.length === 0) {
              return [];
            }
            const MAX = 50;
            const shown = result.failed.slice(0, MAX);
            // Each name links to the job's detailed log in the Actions UI.
            // GitHub expires those logs (default retention: 90 days), so the
            // note names the date after which only the excerpts remain.
            const expiry = new Date(Date.now() + 90 * 24 * 60 * 60 * 1000)
              .toISOString().slice(0, 10);
            const lines = [
              '',
              `### Failed job instances (${result.failed.length})`,
              '',
              `_Each name links to the detailed log. GitHub expires these logs around ${expiry}; after that, the excerpts below are the surviving record._`,
              '',
            ];
            let spent = 0;
            for (let i = 0; i < shown.length; i++) {
              const job = shown[i];
              const excerpt = i < EXCERPT_JOBS && spent < SECTION_BUDGET
                ? await downloadLogExcerpt(job.id)
                : null;
              const summaryName = job.url
                ? `<a href="${job.url}"><code>${escapeHtml(job.name)}</code></a>`
                : `<code>${escapeHtml(job.name)}</code>`;
              if (excerpt && spent + excerpt.length <= SECTION_BUDGET) {
                spent += excerpt.length;
                const fence = fenceFor(excerpt);
                // The first excerpt ships open: the common case is a single
                // failing suite, whose failure text is then visible without a
                // click. The rest stay collapsed to keep the issue scannable.
                lines.push(
                  '',
                  i === 0 ? '<details open>' : '<details>',
                  `<summary>${summaryName} — failing log excerpt</summary>`,
                  '',
                  fence + 'text',
                  excerpt,
                  fence,
                  '',
                  '</details>',
                  ''
                );
              } else {
                lines.push(job.url ? `- [\`${job.name}\`](${job.url})` : `- \`${job.name}\``);
              }
            }
            if (result.failed.length > MAX) {
              lines.push(`- …and ${result.failed.length - MAX} more`);
            }
            return [...lines, ''];
          }

          const branch = context.ref;
          const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${runId}`;
          const headSha = context.sha;
          const actor = context.actor;
          const label = 'workflow-failure';
          const issueId = `workflow-failure:${workflowName}:${branch}`;
          const listOptions = { owner, repo, state: 'open', per_page: 100 };
          const issues = await github.paginate(github.rest.issues.listForRepo, { ...listOptions, labels: label })

          const existing = issues.find(i => i.body && i.body.includes(`<!-- ${issueId} -->`));

          if (conclusion === 'failure' || conclusion === 'cancelled') {
            const title = `Workflow failed: ${workflowName} (${branch})`;
            const failedJobs = await listFailedJobs();
            const failedJobsSection = await formatFailedJobsSection(failedJobs);
            const body = [
              '## Workflow failure',
              '',
              `The [**${workflowName}**](${runUrl}) workflow did not succeed.`,
              '',
              '| | |',
              '|---|------|',
              `| **Run** | [\`${runId}\`](${runUrl}) |`,
              `| **Branch** | \`${branch}\` |`,
              `| **Commit** | \`${headSha}\` |`,
              `| **Triggered by** | @${actor} |`,
              `| **Conclusion** | \`${conclusion}\` |`,
              ...formatNeedsResultsTable(needs),
              ...failedJobsSection,
              '---',
              '*This issue is maintained by the Workflow failure issue workflow. It will be closed when the workflow succeeds.*',
              '',
              `<!-- ${issueId} -->`
            ].join('\n');

            if (existing) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, title, body
              });
              core.info(`Updated issue #${existing.number} for ${workflowName} (${branch}).`);
            } else {
              try {
                const { data: issue } = await github.rest.issues.create({
                  owner, repo, title, body, labels: label ? [label] : undefined
                });
                core.info(`Created issue #${issue.number}: ${issue.html_url}`);
              } catch (err) {
                if (err.status === 422 && /Label/.test(err.message)) {
                  const { data: issue } = await github.rest.issues.create({
                    owner, repo, title, body
                  });
                  core.warning(`Created issue #${issue.number} without label (create label "${label}" in repo to use it).`);
                } else {
                  throw err;
                }
              }
            }
          } else {
            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `Workflow [succeeded](${runUrl}) (commit \`${headSha}\`). Closing this tracking issue.`
              });
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, state: 'closed'
              });
              core.info(`Closed issue #${existing.number} (${workflowName} succeeded on ${branch}).`);
            }
          }
