features:
  policyExceptions:
    enabled: true
    # "*" is the conformance configuration so tests can create exceptions in any namespace; not a recommendation.
    namespace: "*"
  omitEvents:
    eventTypes: []

admissionController:
  extraArgs:
    v: 4
  rbac:
    clusterRole:
      extraResources:
        - apiGroups:
            - "*"
          resources:
            - secrets
          verbs:
            - create
            - update
            - patch
            - delete
            - get
            - list
  profiling:
    enabled: true
    serviceType: NodePort
    nodePort: 30950

backgroundController:
  extraArgs:
    v: 4
  rbac:
    clusterRole:
      extraResources:
        - apiGroups:
            - "*"
          resources:
            - configmaps
            - networkpolicies
            - resourcequotas
            - secrets
            - roles
            - rolebindings
            - limitranges
            - namespaces
            - nodes
            - nodes/status
            - pods
          verbs:
            - create
            - update
            - patch
            - delete
            - get
            - list

cleanupController:
  rbac:
    clusterRole:
      extraResources:
        - apiGroups:
            - ""
          resources:
            - pods
          verbs:
            - list
            - delete
