# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: basic
spec:
  concurrent: false
  namespace: foo
  steps:
  - name: create policy
    use:
      template: ../../../_step-templates/create-policy.yaml
      with:
        bindings:
        - name: file
          value: policy.yaml
  - name: wait policy ready
    use:
      template: ../../../_step-templates/cluster-policy-ready.yaml
      with:
        bindings:
        - name: name
          value: basic-sigstore-test-policy
  - try:
    # Signature verification against the test sigstore stack can take longer than the
    # default 5s exec timeout, and the ttl.sh registry holding the test image is sometimes
    # slow enough that the policy's 30s webhook times out, so try the create up to 3 times.
    - script:
        timeout: 2m
        content: |
          for i in 1 2 3; do
            kubectl run -n $NAMESPACE test-sigstore --image=$TEST_IMAGE_URL && exit 0
            kubectl get pod -n $NAMESPACE test-sigstore && exit 0
            sleep 5
          done
          exit 1
    - assert:
        file: pod-assert.yaml
