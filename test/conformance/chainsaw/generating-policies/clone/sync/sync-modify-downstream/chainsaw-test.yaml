# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: sync-modify-downstream
spec:
  concurrent: false
  steps:
  - name: create permissions
    try:
    - apply:
        file: permissions.yaml
  - name: create policy
    use:
      template: ../../../../_step-templates/create-policy.yaml
      with:
        bindings:
        - name: file
          value: policy.yaml
  - name: wait-generating-policy-ready
    use:
      template: ../../../../_step-templates/generating-policy-ready.yaml
      with:
        bindings:
        - name: name
          value: generate-secret
  - name: sleep
    try:
    - sleep:
        duration: 5s
  - name: create the source
    try:
    - apply:
        file: source.yaml
  - name: create the trigger
    try:
    - apply:
        file: trigger.yaml
  - name: check that the downstream is generated
    try:
    - assert:
        file: downstream-assert.yaml
  - name: wait for generation to complete
    try:
    - script:
        timeout: 1m30s
        content: |
          set -eu
          while true; do
            update_requests=$(kubectl get updaterequests.kyverno.io -n kyverno -l generate.kyverno.io/policy-name=generate-secret -o name)
            if [ -z "$update_requests" ]; then
              break
            fi
            sleep 1
          done
  - name: modify the downstream
    try:
    - apply:
        file: downstream-modified.yaml
  - name: check that the downstream is reverted
    try:
    - assert:
        file: downstream-assert.yaml
