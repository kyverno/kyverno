# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: sync-modify-policy-and-downstream-data
spec:
  concurrent: false
  steps:
  - name: create policy
    use:
      template: ../../../../_step-templates/create-policy.yaml
      with:
        bindings:
        - name: file
          value: policy.yaml
  - name: wait-generating-policy-ready
    use:
      template: ../../../../_step-templates/generating-policy-ready.yaml
      with:
        bindings:
        - name: name
          value: sync-modify-policy-and-downstream-data
  - name: sleep
    try:
    - sleep:
        duration: 5s
  - name: create namespace
    try:
    - apply:
        file: namespace.yaml
  - name: check that configmap is generated
    try:
    - assert:
        file: downstream-assert.yaml
  - name: modify the policy and check that the downstream configmap is updated in-place
    try:
    - command:
        entrypoint: kubectl
        args:
        - get
        - configmap
        - sync-modify-policy-and-downstream-data
        - --namespace=sync-modify-policy-and-downstream-data
        - --output=json
        outputs:
        - name: downstream_uid
          value: (json_parse($stdout).metadata.uid)
    - apply:
        file: policy-modified.yaml
    - sleep:
        duration: 5s
    - assert:
        file: downstream-modified.yaml
