# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: missing-generate
spec:
  concurrent: false
  steps:
  - name: Apply the policy
    try:
    - script:
        content: kubectl apply -f policy.yaml
        check:
          ($error != null): true
          # The API server lists one more error after this one when it skips the CRD's CEL
          # rules for an invalid object, so only the missing field is checked.
          (contains($stderr, 'The GeneratingPolicy "zk-kafka-address" is invalid')): true
          "(contains($stderr, 'spec.generate: Required value'))": true