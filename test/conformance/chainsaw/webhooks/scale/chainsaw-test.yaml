# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: scale
spec:
  concurrent: true
  namespace: default
  steps:
  - name: step-01
    try:
    - script:
        content: kubectl create --dry-run=server -f policy.yaml
        check:
          ($error == null): true
          (contains($stderr, 'unable to convert GVK to GVR for kinds Scale,')): true
