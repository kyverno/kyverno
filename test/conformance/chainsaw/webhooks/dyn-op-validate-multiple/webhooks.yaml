apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  labels:
    webhook.kyverno.io/managed-by: kyverno
  name: kyverno-resource-validating-webhook-cfg
webhooks:
- name: protect-generation-labels.kyverno.svc
- rules:
  - apiGroups:
    - ''
    apiVersions:
    - v1
    operations:
    - CONNECT
    - CREATE
    - UPDATE
    resources:
    - configmaps
    scope: Namespaced
  - apiGroups:
    - '*'
    apiVersions:
    - '*'
    operations:
    - CREATE
    resources:
    - '*/scale'
    scope: '*'
