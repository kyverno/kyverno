# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: unknown-kind
spec:
  concurrent: true
  namespace: default
  steps:
  - name: step-01
    try:
    - script:
        content: kubectl create --dry-run=server -f policy-1.yaml
        check:
          ($error == null): true
          (contains($stderr, 'unable to convert GVK to GVR for kinds Foo,')): true
  - name: step-02
    try:
    - script:
        content: kubectl create --dry-run=server -f policy-2.yaml
        check:
          ($error == null): true
          (contains($stderr, 'unable to convert GVK to GVR for kinds Foo/*,')): true
  - name: step-03
    try:
    - script:
        content: kubectl create --dry-run=server -f policy-3.yaml
        check:
          ($error == null): true
          (contains($stderr, 'unable to convert GVK to GVR for kinds v2/Pod,')): true
  - name: step-04
    try:
    - script:
        content: kubectl create --dry-run=server -f policy-4.yaml
        check:
          ($error == null): true
          (contains($stderr, 'unable to convert GVK to GVR for kinds Pod/foo,')): true
