# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: registry-egress-hard-block
spec:
  concurrent: false
  steps:
  - name: create policy
    use:
      template: ../../../../_step-templates/create-policy.yaml
      with:
        bindings:
        - name: file
          value: policy.yaml
  - name: wait policy ready
    use:
      template: ../../../../_step-templates/cluster-policy-ready.yaml
      with:
        bindings:
        - name: name
          value: registry-egress-hard-block
  - name: deny cloud metadata registry before network access
    try:
    - create:
        file: metadata-pod.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'connection blocked to network host')): true
            (contains($error, '169.254.169.254')): true
  - name: deny loopback registry before network access
    try:
    - create:
        file: loopback-pod.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'connection blocked to network host')): true
            (contains($error, '127.0.0.1')): true
