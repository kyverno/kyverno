apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: ($name)
spec:
  background: false
  rules:
  - name: check
    match:
      any:
      - resources:
          kinds:
          - Pod
    verifyImages:
    - imageReferences:
      - registry.invalid/*
      attestors:
      - entries:
        - keys:
            secret:
              name: cosign-key
              namespace: ($keyNamespace)
  validationFailureAction: Enforce
