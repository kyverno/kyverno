apiVersion: policies.kyverno.io/v1beta1
kind: MutatingPolicy
metadata:
  name: map-scope-repro
spec:
  evaluation:
    admission:
      enabled: false
    mutateExisting:
      enabled: true
  autogen:
    mutatingAdmissionPolicy:
      enabled: true
  matchConstraints:
    matchPolicy: Exact
    namespaceSelector:
      matchLabels:
        environment: development
    objectSelector:
      matchLabels:
        mutate: "yes"
    resourceRules:
    - apiGroups: [""]
      apiVersions: [v1]
      operations: [CREATE]
      resources: [configmaps]
    excludeResourceRules:
    - apiGroups: [""]
      apiVersions: [v1]
      operations: [CREATE]
      resources: [configmaps]
      resourceNames: [do-not-touch]
  mutations:
  - patchType: JSONPatch
    jsonPatch:
      expression: >-
        [JSONPatch{op: "add", path: "/data/managed", value: "true"}]
