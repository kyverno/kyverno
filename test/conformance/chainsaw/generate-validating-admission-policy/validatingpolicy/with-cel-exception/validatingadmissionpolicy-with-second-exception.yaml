apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  labels:
    app.kubernetes.io/managed-by: kyverno
  name: vpol-check-deployment-labels
  ownerReferences:
  - apiVersion: policies.kyverno.io/v1beta1
    kind: ValidatingPolicy
    name: check-deployment-labels
spec:
  failurePolicy: Fail
  # Exceptions are compiled in sorted order, and the first one lives in the
  # randomly named chainsaw namespace, so the index of each condition varies
  # per run. Match on name instead of position.
  (matchConditions[?name == 'check-name'] | length(@)): 1
  (matchConditions[?name == 'check-name-from-ns-b'] | length(@)): 1
  (matchConditions[?name == 'check-name'].expression | [0]): '!(object.metadata.name == ''skipped-deployment'')'
  (matchConditions[?name == 'check-name-from-ns-b'].expression | [0]): '!(object.metadata.name == ''skipped-deployment-from-ns-b'')'
  matchConstraints:
    resourceRules:
    - apiGroups:
      - apps
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - deployments
  variables:
  - expression: has(object.metadata.labels) && 'env' in object.metadata.labels &&
      object.metadata.labels['env'] == 'prod'
    name: environment
  validations:
  - expression: variables.environment == true
    message: Deployment labels must be env=prod
