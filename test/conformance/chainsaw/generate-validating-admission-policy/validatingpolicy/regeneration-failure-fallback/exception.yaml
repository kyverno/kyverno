apiVersion: policies.kyverno.io/v1beta1
kind: PolicyException
metadata:
  name: regeneration-failure-fallback
spec:
  policyRefs:
  - name: regeneration-failure-fallback
    kind: ValidatingPolicy
  matchConditions:
    # Kyverno evaluates resource.Get(), but the API server can't compile it in a ValidatingAdmissionPolicy,
    # so every regeneration that includes this exception is rejected
    - name: team-namespaces
      expression: "'team' in resource.Get('v1', 'namespaces', '', object.metadata.namespace).metadata.labels"
