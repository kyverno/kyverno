# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: generate-events-upon-successful-mutation
spec:
  concurrent: false
  steps:
  - name: step-01
    try:
    - script:
        content: kubectl patch configmap kyverno -p '{"data":{"generateSuccessEvents":"true"}}' -n kyverno
    - assert:
        file: kyverno-configmap-assert.yaml
  - name: create policy
    use:
      template: ../../../_step-templates/create-policy.yaml
      with:
        bindings:
        - name: file
          value: policy.yaml
  - name: wait policy ready
    use:
      template: ../../../_step-templates/mutating-policy-ready.yaml
      with:
        bindings:
        - name: name
          value: add-labels
  - name: step-03
    try:
    # Policy status can become ready before the API server observes the webhook.
    # Probe a different resource so its dry-run event cannot satisfy the assertion.
    - script:
        timeout: 200s
        content: |
          last_probe_result=""
          for i in $(seq 1 30); do
            if label=$(kubectl create configmap mutation-readiness-probe \
              -n "$NAMESPACE" --from-literal=key=probe --dry-run=server \
              --request-timeout=5s -o jsonpath='{.metadata.labels.foo}' 2>&1); then
              if [ "$label" = "bar" ]; then
                exit 0
              fi
              last_probe_result="Dry-run succeeded without the expected label (got: ${label})"
            else
              last_probe_result="$label"
            fi
            sleep 1
          done
          echo "MutatingPolicy add-labels is not yet mutating ConfigMaps"
          echo "Last readiness probe: ${last_probe_result}"
          exit 1
    - apply:
        file: resource.yaml
    - assert:
        file: resource-assert.yaml
  - name: step-04
    try:
    - assert:
        file: event-assert.yaml
        template: true
