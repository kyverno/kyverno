apiVersion: kyverno.io/v2alpha1
kind: GlobalContextEntry
metadata:
  name: gctxentry-apicall-projections
spec:
  apiCall:
    urlPath: "/apis/apps/v1/deployments"
    refreshInterval: 1h
  projections:
    - name: test-globalcontext-apicall-correct-projections_deployment_count
      expression: "object.items.filter(i, i.metadata.namespace == 'test-globalcontext-apicall-correct').size()"
