apiVersion: policies.kyverno.io/v1beta1
kind: ImageValidatingPolicy
metadata:
  name: ivpol-keyless-image-invalid-attestor
spec:
  webhookConfiguration:
    timeoutSeconds: 30
  failurePolicy: Fail
  validationActions:
    - Deny
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  matchImageReferences:
    - glob: ghcr.io/kyverno/zulu:*
  validationConfigurations:
    mutateDigest: true
    verifyDigest: true
    required: true
  attestors:
    - name: signer0
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subject: invalid subject
        ctlog:
          url: https://rekor.sigstore.dev
          insecureIgnoreSCT: true
    - name: signer1
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: ^https://github\.com/chipzoller/zulu/\.github/workflows/slsa\-generic\-keyless\.yaml@refs/tags/v.*$
        ctlog:
          url: https://rekor.sigstore.dev
          insecureIgnoreSCT: true
  validations:
    - expression: >-
        images.containers.size() > 0 && images.containers.all(image, verifyImageSignatures(image, [attestors.signer0,
        attestors.signer1]) >= 1)
      message: image attestor threshold not satisfied
