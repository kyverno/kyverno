apiVersion: policies.kyverno.io/v1beta1
kind: ImageValidatingPolicy
metadata:
  name: ivpol-registry-egress-hard-block
spec:
  validationActions:
  - Deny
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
      - pods/ephemeralcontainers
    objectSelector:
      matchLabels:
        test.kyverno.io/registry-egress: 'true'
  validations:
  - expression: >-
      object.spec.containers.all(c, getImageData(c.image) != null) &&
      object.spec.?initContainers.orValue([]).all(c, getImageData(c.image) != null) &&
      object.spec.?ephemeralContainers.orValue([]).all(c, getImageData(c.image) != null)
  matchImageReferences:
  - glob: '*'
  validationConfigurations:
    mutateDigest: false
    verifyDigest: false
    required: false
  attestors: []
