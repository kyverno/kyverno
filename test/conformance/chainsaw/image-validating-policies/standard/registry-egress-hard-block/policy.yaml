apiVersion: policies.kyverno.io/v1beta1
kind: ImageValidatingPolicy
metadata:
  name: ivpol-registry-egress-hard-block
spec:
  validationActions:
  - Deny
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
    objectSelector:
      matchLabels:
        test.kyverno.io/registry-egress: 'true'
  validations:
  - expression: images.containers.all(image, getImageData(image) != null)
  imageExtractors:
  - name: containers
    expression: object.spec.?containers.orValue([]).map(container, container.image)
  - name: initContainers
    expression: object.spec.?initContainers.orValue([]).map(container, container.image)
  - name: ephemeralContainers
    expression: object.spec.?ephemeralContainers.orValue([]).map(container, container.image)
  matchImageReferences:
  - glob: '*'
  validationConfigurations:
    mutateDigest: false
    verifyDigest: false
    required: false
  attestors: []
