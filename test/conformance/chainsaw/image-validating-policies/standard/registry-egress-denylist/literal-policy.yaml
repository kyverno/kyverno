apiVersion: policies.kyverno.io/v1beta1
kind: ImageValidatingPolicy
metadata:
  name: ivpol-registry-egress-literal
spec:
  validationActions:
  - Deny
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      resources:
      - pods
    objectSelector:
      matchLabels:
        test.kyverno.io/registry-egress-literal: 'true'
  validations:
  # The reference is written into the policy rather than read from the Pod. The guard runs
  # where the image is fetched, so this is blocked just like a workload image would be.
  - expression: getImageData('169.254.169.254/author/image:v1') != null
  matchImageReferences:
  - glob: '*'
  validationConfigurations:
    mutateDigest: false
    verifyDigest: false
    required: false
  attestors: []
