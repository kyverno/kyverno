apiVersion: policies.kyverno.io/v1beta1
kind: ImageValidatingPolicy
metadata:
  name: ivpol-keyed-secret
spec:
  webhookConfiguration:
    timeoutSeconds: 30
  failurePolicy: Fail
  validationActions:
    - Deny
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  matchImageReferences:
    - glob: ghcr.io/kyverno/test-verify-image:*
  validationConfigurations:
    mutateDigest: true
    verifyDigest: true
    required: true
  attestors:
    - name: signer
      cosign:
        key:
          expression: >-
            string(base64.decode(resource.get('v1', 'secrets', object.metadata.namespace, 'testsecret').data['cosign.pub']))
        ctlog:
          url: https://rekor.sigstore.dev
          insecureIgnoreTlog: true
  validations:
    - expression: >-
        images.containers.size() > 0 && images.containers.all(image, verifyImageSignatures(image, [attestors.signer])
        > 0)
      message: image signature verification failed
