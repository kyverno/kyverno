apiVersion: policies.kyverno.io/v1beta1
kind: ImageValidatingPolicy
metadata:
  name: ivpol-keyless-attestations-multiple-subjects-1
spec:
  webhookConfiguration:
    timeoutSeconds: 30
  failurePolicy: Fail
  validationActions:
    - Deny
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  matchImageReferences:
    - glob: ghcr.io/kyverno/zulu*
  validationConfigurations:
    mutateDigest: true
    verifyDigest: true
    required: true
  attestors:
    - name: signer0
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subject: https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@refs/heads/main
        ctlog:
          url: https://rekor.sigstore.dev
          insecureIgnoreSCT: true
  validations:
    - expression: >-
        images.containers.size() > 0 && images.containers.all(image, verifyAttestationSignatures(image, attestations.provenance,
        [attestors.signer0]) >= 1)
      message: image attestor threshold not satisfied
    - expression: >-
        images.containers.all(image, extractPayload(image, attestations.provenance).predicate.builder.id.matches('^https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@refs/heads/main'))
      message: attestation predicate does not match the expected value
  attestations:
    - name: provenance
      intoto:
        type: https://slsa.dev/provenance/v0.2
