apiVersion: policies.kyverno.io/v1beta1
kind: ImageValidatingPolicy
metadata:
  name: ivpol-keyed-basic-namespace-selector
spec:
  webhookConfiguration:
    timeoutSeconds: 30
  failurePolicy: Fail
  validationActions:
    - Deny
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: signed
          operator: In
          values:
            - 'true'
  matchImageReferences:
    - glob: ghcr.io/kyverno/test-verify-image:*
  validationConfigurations:
    mutateDigest: true
    verifyDigest: true
    required: true
  attestors:
    - name: signer
      cosign:
        key:
          data: |-
            -----BEGIN PUBLIC KEY-----
            MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE8nXRh950IZbRj8Ra/N9sbqOPZrfM
            5/KAQN0/KjHcorm/J5yctVd7iEcnessRQjU917hmKO6JWVGHpDguIyakZA==
            -----END PUBLIC KEY-----
        ctlog:
          url: https://rekor.sigstore.dev
          insecureIgnoreTlog: true
  validations:
    - expression: >-
        images.containers.size() > 0 && images.containers.all(image, verifyImageSignatures(image, [attestors.signer])
        > 0)
      message: image signature verification failed
