# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: nomutatedigest-verifydigest-norequired
spec:
  concurrent: false
  steps:
  - name: create policy
    use:
      template: ../../../_step-templates/create-policy.yaml
      with:
        bindings:
        - name: file
          value: policy.yaml
  - name: wait for admission policy readiness
    try:
    - assert:
        resource:
          apiVersion: policies.kyverno.io/v1beta1
          kind: ImageValidatingPolicy
          metadata:
            name: ivpol-nomutatedigest-verifydigest-norequired
          status:
            conditionStatus:
              (conditions[?type == 'WebhookConfigured']):
              - message: Webhook configured.
                reason: Succeeded
                status: "True"
                type: WebhookConfigured
              (conditions[?type == 'RBACPermissionsGranted']):
              - message: Background scanning disabled; reporting permissions not required.
                reason: Succeeded
                status: "True"
                type: RBACPermissionsGranted
              ready: true
  - name: require digest without verifying signatures
    try:
    - create:
        file: pod.yaml
    - assert:
        file: pod.yaml
  - name: reject update that removes the digest
    try:
    - script:
        content: |-
          if output=$(kubectl -n "$NAMESPACE" patch pod testpod --type=json \
            -p='[{"op":"replace","path":"/spec/containers/0/image","value":"ghcr.io/kyverno/test-verify-image:signed-keyless"}]' 2>&1); then
            echo "Expected an image update without a digest to be denied" >&2
            exit 1
          fi
          echo "$output"
          case "$output" in
            *"Policy ivpol-nomutatedigest-verifydigest-norequired failed: image ghcr.io/kyverno/test-verify-image:signed-keyless does not have a digest"*) ;;
            *) exit 1 ;;
          esac
    - assert:
        file: pod.yaml
    - create:
        file: badpod.yaml
        expect:
        - check:
            ($error != null): true
            "($error != null && contains($error, 'Policy ivpol-nomutatedigest-verifydigest-norequired failed: image ghcr.io/kyverno/test-verify-image:signed-keyless does not have a digest'))": true
    - error:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: testpod-no-digest
    - assert:
        file: pod.yaml
