apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    admissions.enforcer/disabled: "true"
  labels:
    webhook.kyverno.io/managed-by: kyverno
  name: kyverno-resource-validating-webhook-cfg
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: kyverno-svc
      namespace: kyverno
      path: /ivpol/validate/check-signed-images-basic
      port: 443
  failurePolicy: Fail
  matchPolicy: Equivalent
  name: ivpol.validate.kyverno.svc-fail
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: NotIn
      values:
      - kube-system
    - key: kubernetes.io/metadata.name
      operator: NotIn
      values:
      - kyverno
  objectSelector: {}
  rules:
  - apiGroups:
    - ""
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - pods
    scope: '*'
  - apiGroups:
    - apps
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - daemonsets
    - deployments
    - replicasets
    - statefulsets
    scope: '*'
  - apiGroups:
    - batch
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - cronjobs
    scope: '*'
  - apiGroups:
    - batch
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - jobs
    scope: '*'
  sideEffects: NoneOnDryRun
  timeoutSeconds: 10
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: kyverno-svc
      namespace: kyverno
      path: /ivpol/validate/check-signed-images-finegrained
      port: 443
  failurePolicy: Fail
  matchConditions:
  - expression: '!((request.kind.group == '''' && request.kind.version == ''v1'' && request.kind.kind == ''Pod'')) || (has(object.metadata.labels) && has(object.metadata.labels.prod) && object.metadata.labels.prod == ''true'')'
    name: autogen-check-prod-label
  - expression: '!((request.kind.group == ''batch'' && request.kind.version == ''v1'' && request.kind.kind == ''CronJob'')) || (has(object.spec.jobTemplate.spec.template.metadata.labels) && has(object.spec.jobTemplate.spec.template.metadata.labels.prod) && object.spec.jobTemplate.spec.template.metadata.labels.prod == ''true'')'
    name: autogen-cronjobs-check-prod-label
  - expression: '!((request.kind.group == ''apps'' && request.kind.version == ''v1'' && request.kind.kind == ''DaemonSet'') || (request.kind.group == ''apps'' && request.kind.version == ''v1'' && request.kind.kind == ''Deployment'') || (request.kind.group == ''apps'' && request.kind.version == ''v1'' && request.kind.kind == ''ReplicaSet'') || (request.kind.group == ''apps'' && request.kind.version == ''v1'' && request.kind.kind == ''StatefulSet'') || (request.kind.group == ''batch'' && request.kind.version == ''v1'' && request.kind.kind == ''Job'')) || (has(object.spec.template.metadata.labels) && has(object.spec.template.metadata.labels.prod) && object.spec.template.metadata.labels.prod == ''true'')'
    name: autogen-defaults-check-prod-label
  matchPolicy: Equivalent
  name: ivpol.validate.kyverno.svc-fail-finegrained-check-signed-images-finegrained
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: NotIn
      values:
      - kube-system
    - key: kubernetes.io/metadata.name
      operator: NotIn
      values:
      - kyverno
  objectSelector: {}
  rules:
  - apiGroups:
    - ""
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - pods
    scope: '*'
  - apiGroups:
    - apps
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - daemonsets
    - deployments
    - replicasets
    - statefulsets
    scope: '*'
  - apiGroups:
    - batch
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - cronjobs
    scope: '*'
  - apiGroups:
    - batch
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - jobs
    scope: '*'
  sideEffects: NoneOnDryRun
  timeoutSeconds: 10
- name: protect-generation-labels.kyverno.svc

---

