# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: rollback-image-verification
spec:
  concurrent: false
  timeouts:
    delete: 2m
  steps:
  - name: create policy
    use:
      template: ../../../_step-templates/create-policy.yaml
      with:
        bindings:
        - name: file
          value: policy.yaml
  - name: wait-image-validating-policy-ready
    use:
      template: ../../../_step-templates/image-validating-policy-ready.yaml
      with:
        bindings:
        - name: name
          value: ivpol-rollback-image-verification
  - name: check autogen policy
    try:
    - assert:
        file: check-autogen.yaml
  - name: create then update the deployment
    try:
    - apply:
        file: deployment_old.yaml
    - apply:
        file: deployment_new.yaml
    - assert:
        file: deployment-assert.yaml
  - name: roll back the deployment
    try:
    - script:
        content: kubectl -n ivpol-rollback-verification rollout undo deployment nginx-deployment
  - name: assert the rollback reverted to the first, already-verified image
    try:
    - assert:
        file: chainsaw-step-04-assert-1.yaml
