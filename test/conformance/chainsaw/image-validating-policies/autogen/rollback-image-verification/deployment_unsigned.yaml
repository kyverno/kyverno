# Same Deployment, same container name — applying this is an UPDATE, exercising the
# identical admission path the rollback takes. The image is unsigned, so the policy
# must deny it. Without this case, "the rollback was not denied" would also hold if
# verification silently did nothing.
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nginx
  name: nginx-deployment
  namespace: ivpol-rollback-verification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - image: ghcr.io/kyverno/test-verify-image:unsigned
        name: nginx
        resources: {}
