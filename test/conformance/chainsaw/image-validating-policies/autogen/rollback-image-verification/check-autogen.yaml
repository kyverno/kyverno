apiVersion: policies.kyverno.io/v1beta1
kind: ImageValidatingPolicy
metadata:
    name: ivpol-rollback-image-verification
status:
  autogen:
    configs:
      defaults:
        spec:
          attestors:
          - name: cosign
            cosign:
              key:
                data: |-
                  -----BEGIN PUBLIC KEY-----
                  MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEfnYaFSrs2pLp4ShcWBgMLJM6Gki/
                  1tC5ZWN2IuJTe2RbyVrDEn1qLBXNzGKhIXbsUyO5+BuIfgMdek1pDYFZGQ==
                  -----END PUBLIC KEY-----
              ctlog:
                insecureIgnoreTlog: true
          autogen:
            podControllers:
              controllers:
              - deployments
          matchImageReferences:
          - glob: ghcr.io/kyverno/test-verify-image-rollback:*
          matchConstraints:
            resourceRules:
            - apiGroups:
              - apps
              apiVersions:
              - v1
              operations:
              - CREATE
              - UPDATE
              resources:
              - deployments
          validationActions:
          - Deny
          validations:
          - expression: images.containers.map(image, verifyImageSignatures(image,
              [attestors.cosign])).all(e, e > 0)
            message: failed to verify image with cosign key
          validationConfigurations:
            mutateDigest: true
            required: false
            verifyDigest: false
          webhookConfiguration:
            timeoutSeconds: 30
