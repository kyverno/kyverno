# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: autogen-deployments-cronjobs
spec:
  concurrent: false
  steps:
  - name: create policy
    use:
      template: ../../../_step-templates/create-policy.yaml
      with:
        bindings:
        - name: file
          value: policy.yaml
  - name: wait-image-validating-policy-ready
    use:
      template: ../../../_step-templates/image-validating-policy-ready.yaml
      with:
        bindings:
        - name: name
          value: ivpol-autogen-sample
  - name: check autogen policy
    try:
    - assert:
        file: check-autogen.yaml
  # This test usually runs first in its shard, right after Kyverno starts, and the policy can
  # report ready a moment before admission requests are actually checked against it.
  - name: wait-webhook
    try:
    - sleep:
        duration: 5s
  - name: create good deployment
    try:
    - create:
        file: good-deployment.yaml
  - name: create bad deployment
    try:
    - create:
        file: bad-deployment.yaml
        expect:
          - check:
              ($error != null): true
