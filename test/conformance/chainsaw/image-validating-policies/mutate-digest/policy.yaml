apiVersion: policies.kyverno.io/v1beta1
kind: ImageValidatingPolicy
metadata:
  name: ivpol-mutate-digest
spec:
  webhookConfiguration:
    timeoutSeconds: 20
  failurePolicy: Fail
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchImageReferences:
    - glob: ghcr.io/**
  validationConfigurations:
    mutateDigest: true
    verifyDigest: false
    required: false
  attestors: []
  validations:
    - expression: "true"
