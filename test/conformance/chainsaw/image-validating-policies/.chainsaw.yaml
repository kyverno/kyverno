# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/configuration-chainsaw-v1alpha2.json
apiVersion: chainsaw.kyverno.io/v1alpha2
kind: Configuration
metadata:
  name: configuration
spec:
  cleanup:
    delayBeforeCleanup: 1s
  discovery:
    fullName: true
  execution:
    failFast: true
    forceTerminationGracePeriod: 1s
  namespace:
    fastDelete: true
  timeouts:
    # As long as the policies' webhook timeoutSeconds (up to 30s), so a slow image
    # verification that the webhook still allows doesn't fail the create first.
    apply: 30s
