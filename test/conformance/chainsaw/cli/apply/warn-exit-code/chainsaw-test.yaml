# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: warn-exit-code
spec:
  concurrent: false
  steps:
    - try:
      - script:
          # --audit-warn does not apply to ValidatingPolicy yet (#16485), so an audit failure
          # still exits 1. Expect exit status 3 here once that is fixed.
          content: |
            kyverno apply policy.yaml --resource resource.yaml --audit-warn --warn-exit-code 3
          check:
            ($error): "exit status 1"
