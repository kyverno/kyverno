# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: resolve-rejects-invalid-reference
spec:
  concurrent: false
  steps:
    - try:
      - script:
          content: |
            kyverno oci resolve -i "not a ref"
          check:
            ($error != null): true
            (contains($stderr, 'parsing image reference')): true
            ($stdout): ""
