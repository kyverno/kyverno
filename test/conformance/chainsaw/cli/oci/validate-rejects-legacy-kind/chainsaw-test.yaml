# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: validate-rejects-legacy-kind
spec:
  concurrent: false
  steps:
    - try:
      - script:
          # A single file, not ".", so Assemble's single-file branch runs: chainsaw-test.yaml
          # itself (which also matches *.yaml) never becomes part of what gets validated.
          content: |
            kyverno oci validate policy.yaml
          check:
            ($error != null): true
            (contains($stderr, 'kyverno.io/v1')): true
