# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: validate-policy-with-exception
spec:
  concurrent: false
  steps:
    - try:
      - script:
          # bundle/ holds only policy.yaml and exception.yaml: validating "." here would also
          # pick up this chainsaw-test.yaml, which is not bundle content.
          content: |
            kyverno oci validate bundle
          check:
            ($error): ~
