apiVersion: policies.kyverno.io/v1beta1
kind: MutatingPolicy
metadata:
  name: mpol-http-post
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          cel.bind(apiResponse, http.post(
            "http://test-api-service.default.svc.cluster.local/",
            {"labels": object.metadata.labels.app},{"Content-Type": "application/json"}),
            Object{
              metadata: Object.metadata{
                labels: Object.metadata.labels{
                  env: 'received' in apiResponse ? apiResponse.received : 'unknown'
                }
              }
            })
