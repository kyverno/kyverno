apiVersion: apps/v1
kind: Deployment
metadata:
  generateName: trusted-deployment-
  labels:
    app: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      containers:
      - name: test
        image: public.ecr.aws/docker/library/nginx:latest
