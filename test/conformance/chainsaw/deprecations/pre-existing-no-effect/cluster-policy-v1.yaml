apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: deprecations-pre-existing-no-effect
spec:
  rules:
  - name: check-labels
    match:
      resources:
        kinds:
        - Pod
    validate:
      message: "label app is required"
      pattern:
        metadata:
          labels:
            app: "?*"
