apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: vpol-http-post-token
spec:
  validationActions:
    - Deny
  matchConstraints:
    objectSelector:
      matchLabels:
        token-test: good
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        operations: ["CREATE"]
  variables:
    - name: response
      expression: >-
       http.post(
        "http://test-api-token-service.default.svc.cluster.local/",
        {"labels": object.metadata.labels},{"Content-Type": "application/json"})
  validations:
    - expression: variables.response.tokenValid == true
      messageExpression: >-
       'CEL http.post did not present a token the API server accepts for the kyverno-svc.kyverno.io audience: tokenValid=' + string(variables.response.tokenValid)
