# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: apicall-http-post
  
spec:
  concurrent: false
  steps:
  - try:
    - apply:
        file: http-pod.yaml
    - apply:
        file: service.yaml
    - assert:
        timeout: 120s
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: test-api
            namespace: default
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
  - name: create policy
    use:
      template: ../../../../_step-templates/create-policy.yaml
      with:
        bindings:
        - name: file
          value: policy.yaml
  - name: wait-validating-policy-ready
    use:
      template: ../../../../_step-templates/validating-policy-ready.yaml
      with:
        bindings:
        - name: name
          value: vpol-http-post
  - try:
    - apply: 
        file: good-pod.yaml
    - create:
        file: bad-pod.yaml
        expect:
          - check:
              ($error): >-
                admission webhook "vpol.validate.kyverno.svc-fail" denied the request: Policy vpol-http-post failed: External POST call did not return the expected response prod
