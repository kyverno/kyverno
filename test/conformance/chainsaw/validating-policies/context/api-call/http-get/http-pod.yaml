apiVersion: v1
kind: Pod
metadata:
  namespace: default
  name: test-api
  labels:
    app: test-api
spec:
  containers:
  - name: test-api
    image: mirror.gcr.io/library/python:3.9-slim
    command: [python3, -c]
    args:
    - |
      import http.server, json
      class H(http.server.BaseHTTPRequestHandler):
          def do_GET(self):
              self.send_response(200)
              self.send_header('Content-Type', 'application/json')
              self.end_headers()
              self.wfile.write(json.dumps({'metadata': {'labels': {'app': 'test'}}}).encode())
          def log_message(self, *a): pass
      http.server.HTTPServer(('', 5000), H).serve_forever()
    ports:
    - containerPort: 5000
    readinessProbe:
      httpGet:
        path: /
        port: 5000
      initialDelaySeconds: 1
      periodSeconds: 2
      failureThreshold: 15
