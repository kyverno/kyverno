# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: globalreference-missing-graceful
spec:
  description: |
    This test verifies that ValidatingPolicies gracefully handle missing GlobalContextEntries
    instead of failing hard. When a GlobalContextEntry referenced by globalContext.get()
    doesn't exist, the policy should continue evaluation with null values rather than
    blocking admission.
  steps:
  - name: create namespace
    try:
    - apply:
        file: namespace.yaml
  - name: create validating policy without globalcontextentry
    try:
    - apply:
        file: policy-missing-gctx.yaml
    - assert:
        file: policy-missing-gctx.yaml
  - name: wait policy ready
    use:
      template: ../../../_step-templates/validating-policy-ready.yaml
      with:
        bindings:
        - name: name
          value: vpol-missing-gctx-graceful
        - name: namespace
          value: default
  - name: create pod with missing globalcontext - should succeed gracefully
    try:
    - apply:
        file: pod-test.yaml
    - assert:
        file: pod-test.yaml
  - name: now create the globalcontextentry
    try:
    - apply:
        file: gctxentry.yaml
    - assert:
        file: gctxentry.yaml
  - name: wait for globalcontextentry to be ready
    try:
    - sleep:
        duration: 5s
  - name: create policy that should work with existing gctx
    try:
    - apply:
        file: policy-with-gctx.yaml
    - assert:
        file: policy-with-gctx.yaml
  - name: wait policy ready
    use:
      template: ../../../_step-templates/validating-policy-ready.yaml
      with:
        bindings:
        - name: name
          value: vpol-with-gctx-works
        - name: namespace
          value: default
  - name: create pod with existing globalcontext - should work normally
    try:
    - apply:
        file: pod-test-2.yaml
    - assert:
        file: pod-test-2.yaml
  - name: verify jmespath deprecation warning
    # gctxentry.yaml deliberately still uses jmesPath (not expression), so this repo keeps
    # exercising the deprecation path here. kubectl apply computes a client-side merge patch
    # and skips the request entirely when nothing changed, so re-applying the unchanged file
    # would not reach the webhook; delete and recreate via script to force a real CREATE that
    # the webhook sees, and capture the warning it returns on stderr. Chainsaw already tracks
    # this GlobalContextEntry's name for cleanup from the apply step above, so recreating it
    # under the same name here doesn't change ownership of that cleanup.
    try:
    - script:
        content: |
          kubectl delete -f gctxentry.yaml --ignore-not-found
          kubectl apply -f gctxentry.yaml
        check:
          (contains($stderr, 'spec.projections[0].jmesPath is deprecated and will be removed in 1.21')): true
    - assert:
        file: gctxentry.yaml
  - name: cleanup
    try:
    - delete:
        ref:
          apiVersion: v1
          kind: Pod
          name: test-pod-missing-gctx
          namespace: test-globalcontext-missing
    - delete:
        ref:
          apiVersion: v1
          kind: Pod
          name: test-pod-with-gctx
          namespace: test-globalcontext-missing
