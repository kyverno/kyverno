apiVersion: policies.kyverno.io/v1beta1
kind: PolicyException
metadata:
  name: ns-b-own-exception
  namespace: ns-b
spec:
  namespaces:
  - ns-b
  policyRefs:
  - name: require-team-label
    kind: NamespacedValidatingPolicy
  matchConditions:
  - name: only-our-build-pods
    expression: "object.metadata.name.startsWith('build-')"
