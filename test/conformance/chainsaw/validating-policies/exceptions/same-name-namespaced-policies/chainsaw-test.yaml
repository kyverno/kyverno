# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: same-name-namespaced-policies
spec:
  concurrent: false
  steps:
  - name: create namespaces
    try:
    - create:
        file: namespace-a.yaml
    - create:
        file: namespace-b.yaml
  - name: create policy in ns-a
    use:
      template: ../../../_step-templates/create-policy.yaml
      with:
        bindings:
        - name: file
          value: policy-a.yaml
  - name: create policy in ns-b
    use:
      template: ../../../_step-templates/create-policy.yaml
      with:
        bindings:
        - name: file
          value: policy-b.yaml
  - name: wait-namespaced-validating-policy-ready-ns-a
    use:
      template: ../../../_step-templates/namespaced-validating-policy-ready.yaml
      with:
        bindings:
        - name: name
          value: require-team-label
        - name: namespace
          value: ns-a
  - name: wait-namespaced-validating-policy-ready-ns-b
    use:
      template: ../../../_step-templates/namespaced-validating-policy-ready.yaml
      with:
        bindings:
        - name: name
          value: require-team-label
        - name: namespace
          value: ns-b
  - name: ns-b denies the unlabelled pod before the exception exists
    try:
    - create:
        file: pod-ns-b.yaml
        expect:
        - check:
            (contains($error, 'pods in ns-b must carry a team label')): true
  - name: ns-b exception does not leak into ns-a
    try:
    - create:
        file: exception-b.yaml
    - sleep:
        duration: 5s
    - create:
        file: pod-ns-a.yaml
        expect:
        - check:
            (contains($error, 'pods in ns-a must carry a team label')): true
  - name: ns-b exception still applies within ns-b
    try:
    - create:
        file: pod-ns-b.yaml
