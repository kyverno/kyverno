apiVersion: v1
kind: Pod
metadata:
  name: skipped-pod-1
spec:
  # Only admission is under test. The gate keeps the pod off the node so its
  # images are never pulled and cleanup does not wait on the pulls.
  schedulingGates:
  - name: kyverno.io/admission-only
  containers:
  - name: container01
    image: public.ecr.aws/docker/library/nginx:latest
    securityContext:
      allowPrivilegeEscalation: true
      runAsNonRoot: true
  - name: container02
    image: public.ecr.aws/docker/library/ubuntu:latest
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
---
