# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: priority-override-on-highest-only
spec:
  concurrent: false
  steps:
    - name: create-exceptions
      try:
        - create:
            file: exception-high-priority-override.yaml
        - create:
            file: exception-low-priority-override.yaml
        - sleep:
            duration: 10s

    - name: create-policy
      use:
        template: ../../../_step-templates/create-policy.yaml
        with:
          bindings:
            - name: file
              value: policy.yaml

    - name: wait-validating-policy-ready
      use:
        template: ../../../_step-templates/validating-policy-v1-ready.yaml
        with:
          bindings:
            - name: name
              value: require-team-label

    - name: pod-admitted-via-audit-override
      try:
        - apply:
            file: pod.yaml
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: test-pod

    - name: check-report-shows-fail
      try:
        - sleep:
            duration: 30s
        - assert:
            file: fail-report-assert.yaml
