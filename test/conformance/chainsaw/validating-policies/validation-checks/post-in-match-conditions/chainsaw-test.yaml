# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: post-in-match-conditions
spec:
  concurrent: false
  steps:
  - name: Apply the policy
    try:
    - script:
        content: kubectl apply -f policy.yaml
        check:
          ($error != null): true
          (contains($stderr, 'admission webhook "validate-policy.kyverno.svc" denied the request')): true
          "(contains($stderr, 'spec.matchConditions[0].expression: Forbidden: resource.post is only allowed in validations, mutations or generate expressions'))": true
