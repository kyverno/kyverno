# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: generatename-exclusion
spec:
  concurrent: false
  steps:
  - name: create policy
    use:
      template: ../../../_step-templates/create-policy.yaml
      with:
        bindings:
        - name: file
          value: policy.yaml
  - name: wait-validating-policy-ready
    use:
      template: ../../../_step-templates/validating-policy-ready.yaml
      with:
        bindings:
        - name: name
          value: check-deployment-generatename-exclusion
  - name: attempt-bypass-with-generatename
    try:
    - script:
        content: kubectl create -n "$NAMESPACE" -f deployment-bypass-attempt.yaml
        check:
          ($error != null): true
          (contains($stderr, 'check-deployment-generatename-exclusion')): true
          (contains($stderr, 'Deployment labels must be env=prod')): true
  - name: create-legitimate-excluded-deployment
    try:
    - create:
        file: deployment-legitimate.yaml
