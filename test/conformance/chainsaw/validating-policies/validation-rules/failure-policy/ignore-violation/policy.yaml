apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: check-team-label
spec:
  failurePolicy: Ignore
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
    - apiGroups:   [""]
      apiVersions: [v1]
      operations:  [CREATE]
      resources:   [pods]
  validations:
    - expression: >-
        has(object.metadata.labels) && 'team' in object.metadata.labels
      message: >-
        team label is required
