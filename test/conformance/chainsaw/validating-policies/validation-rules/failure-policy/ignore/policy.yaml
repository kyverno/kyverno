apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: check-team-label
spec:
  failurePolicy: Ignore
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
    - apiGroups:   [""]
      apiVersions: [v1]
      operations:  [CREATE]
      resources:   [pods]
  validations:
    - expression: >-
        object.metadata.labels.team == 'platform'
      message: >-
        team label must be platform
