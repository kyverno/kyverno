# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: fail
spec:
  concurrent: false
  steps:
  - name: create policy
    use:
      template: ../../../../_step-templates/create-policy.yaml
      with:
        bindings:
        - name: file
          value: policy.yaml
  - name: wait-validating-policy-ready
    use:
      template: ../../../../_step-templates/validating-policy-ready.yaml
      with:
        bindings:
        - name: name
          value: check-team-label
  - name: create pod
    try:
    - create:
        file: pod.yaml
        expect:
          - check:
              ($error): >-
                admission webhook "vpol.validate.kyverno.svc-fail" denied the request: Policy check-team-label error: error: no such key: team
