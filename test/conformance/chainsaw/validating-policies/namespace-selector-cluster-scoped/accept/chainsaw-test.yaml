# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: namespace-selector-cluster-scoped-accept
spec:
  # Verifies that when a ValidatingPolicy's namespaceSelector does NOT match
  # the own labels of a cluster-scoped resource, the policy is skipped and
  # the resource is admitted regardless of any validation rules.
  concurrent: false
  steps:
  - name: create policy
    use:
      template: ../../../_step-templates/create-policy.yaml
      with:
        bindings:
        - name: file
          value: policy.yaml
  - name: wait-validating-policy-ready
    use:
      template: ../../../_step-templates/validating-policy-ready.yaml
      with:
        bindings:
        - name: name
          value: require-team-label-on-cluster-scoped
  - name: create clusterrole with non-matching label
    try:
    - create:
        file: clusterrole.yaml
