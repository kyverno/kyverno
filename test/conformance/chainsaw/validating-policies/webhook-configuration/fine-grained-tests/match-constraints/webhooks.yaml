apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    admissions.enforcer/disabled: "true"
  labels:
    webhook.kyverno.io/managed-by: kyverno
  name: kyverno-resource-validating-webhook-cfg
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: kyverno-svc
      namespace: kyverno
      path: /protect-generation-labels
      port: 443
  failurePolicy: Fail
  matchPolicy: Equivalent
  name: protect-generation-labels.kyverno.svc
  objectSelector:
    matchExpressions:
    - key: generate.kyverno.io/policy-name
      operator: Exists
  rules:
  - apiGroups:
    - '*'
    apiVersions:
    - '*'
    operations:
    - CREATE
    - UPDATE
    resources:
    - '*/*'
    scope: '*'
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: kyverno-svc
      namespace: kyverno
      path: /vpol/check-deployment-labels
      port: 443
  failurePolicy: Fail
  matchPolicy: Exact
  name: vpol.validate.kyverno.svc-fail-finegrained-check-deployment-labels
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: NotIn
      values:
      - kube-system
    - key: kubernetes.io/metadata.name
      operator: NotIn
      values:
      - kyverno
    matchLabels:
       environment: staging
  objectSelector: 
     matchLabels:
        app: test     
  rules:
  - apiGroups:
    - apps
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - deployments
    scope: '*'
  sideEffects: NoneOnDryRun
  timeoutSeconds: 10