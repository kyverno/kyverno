apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: block-ephemeral-containers
status:
  conditionStatus:
    (conditions[?type == 'WebhookConfigured']):
    - message: Webhook configured.
      reason: Succeeded
      status: "True"
    # The reports controller cannot read pods/ephemeralcontainers by default, so the
    # RBAC condition is expected to fail. Match on the resource rather than the full
    # message, whose wording depends on whether the policy has autogen targets.
    (conditions[?type == 'RBACPermissionsGranted']):
    - reason: Failed
      status: "False"
      (contains(message, 'Resource=pods/ephemeralcontainers')): true
    # ready: true
