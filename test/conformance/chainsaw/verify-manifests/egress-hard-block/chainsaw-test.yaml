# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: manifest-egress-hard-block
spec:
  concurrent: false
  steps:
  - name: create policy
    use:
      template: ../../_step-templates/create-policy.yaml
      with:
        bindings:
        - name: file
          value: policy.yaml
  - name: wait policy ready
    use:
      template: ../../_step-templates/cluster-policy-ready.yaml
      with:
        bindings:
        - name: name
          value: manifest-egress-hard-block
  - name: deny key-loopback before network access
    try:
    - create:
        file: key-loopback-service.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'verify-key-loopback')): true
            (contains($error, 'connection blocked to network host')): true
            (contains($error, '127.0.0.1')): true
  - name: deny key-metadata before network access
    try:
    - create:
        file: key-metadata-service.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'verify-key-metadata')): true
            (contains($error, 'connection blocked to network host')): true
            (contains($error, '169.254.169.254')): true
  - name: deny bundle-loopback before network access
    try:
    - create:
        file: bundle-loopback-service.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'verify-bundle-loopback')): true
            (contains($error, 'connection blocked to network host')): true
            (contains($error, '127.0.0.1')): true
  - name: deny bundle-metadata before network access
    try:
    - create:
        file: bundle-metadata-service.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'verify-bundle-metadata')): true
            (contains($error, 'connection blocked to network host')): true
            (contains($error, '169.254.169.254')): true
