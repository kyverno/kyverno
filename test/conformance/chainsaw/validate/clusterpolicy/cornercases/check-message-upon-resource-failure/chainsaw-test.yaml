# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: check-message-upon-resource-failure
spec:
  concurrent: false
  steps:
  - name: create policy
    use:
      template: ../../../../_step-templates/create-policy.yaml
      with:
        bindings:
        - name: file
          value: policy-1.yaml
  - name: wait policy ready
    use:
      template: ../../../../_step-templates/cluster-policy-ready.yaml
      with:
        bindings:
        - name: name
          value: require-ns-owner-label
  - name: create policy
    use:
      template: ../../../../_step-templates/create-policy.yaml
      with:
        bindings:
        - name: file
          value: policy-2.yaml
  - name: wait policy ready
    use:
      template: ../../../../_step-templates/cluster-policy-ready.yaml
      with:
        bindings:
        - name: name
          value: preconditions-check
  - name: step-03
    try:
    - script:
       content: kubectl apply -f resource.yaml
       check:
         ($error != null): true
         (contains($stderr, 'denied the request')): true
         (contains($stderr, 'require-ns-owner-label')): true
         (contains($stderr, 'uw.systems/owner')): true
         (contains($stderr, 'preconditions-check')): false
