apiVersion: v1
kind: Namespace
metadata:
  name: clone-source-tenant
---
apiVersion: v1
kind: Namespace
metadata:
  name: clone-source-other
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: source
  namespace: clone-source-tenant
data:
  value: tenant
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: source
  namespace: clone-source-other
data:
  value: other
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno-clone-source-test
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
- apiGroups: [""]
  resources: [configmaps]
  verbs: [get, list, watch, create, update, patch, delete]
