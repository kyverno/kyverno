# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: clone-kind-cleanup
spec:
  concurrent: false
  timeouts:
    exec: 30s
    assert: 1m
    error: 1m
  steps:
  - name: prepare clone sources and controller permissions
    try:
    - apply:
        file: permissions.yaml
    - apply:
        file: sources.yaml
  - name: create policy with kind-only cloneList entries
    use:
      template: ../../../../_step-templates/create-policy.yaml
      with:
        bindings:
        - name: file
          value: policy.yaml
  - name: wait policy ready
    use:
      template: ../../../../_step-templates/cluster-policy-ready.yaml
      with:
        bindings:
        - name: name
          value: clone-kind-cleanup
  - name: generate direct and foreach targets
    try:
    - apply:
        file: trigger.yaml
    - assert:
        file: targets.yaml
  - name: prepare unsigned downstream candidates
    try:
    - script:
        content: bash prepare-unsigned.sh
    - assert:
        file: survivors.yaml
  - name: delete the direct cloneList rule
    try:
    - command:
        entrypoint: kubectl
        args:
        - patch
        - clusterpolicy
        - clone-kind-cleanup
        - --type=json
        - '--patch=[{"op":"test","path":"/spec/rules/0/name","value":"direct"},{"op":"remove","path":"/spec/rules/0"}]'
    - error:
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: direct-source
            namespace: clone-kind-cleanup-target
    - assert:
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: foreach-source
            namespace: clone-kind-cleanup-target
            annotations:
              (starts_with("generate.kyverno.io/provenance" || '', 'v1:')): true
          data:
            value: foreach
    - assert:
        file: survivors.yaml
  - name: delete the policy containing the foreach cloneList rule
    try:
    - delete:
        ref:
          apiVersion: kyverno.io/v1
          kind: ClusterPolicy
          name: clone-kind-cleanup
    - error:
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: foreach-source
            namespace: clone-kind-cleanup-target
    - assert:
        file: survivors.yaml
