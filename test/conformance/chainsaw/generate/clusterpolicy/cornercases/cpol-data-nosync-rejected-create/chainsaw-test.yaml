# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cpol-data-nosync-rejected-create
spec:
  concurrent: false
  steps:
  - name: step-01
    try:
    - apply:
        file: permissions.yaml
    - apply:
        file: setup-ns.yaml
  - name: step-02
    try:
    - apply:
        file: policy.yaml
  - name: wait policy ready
    use:
      template: ../../../../_step-templates/cluster-policy-ready.yaml
      with:
        bindings:
        - name: name
          value: cpol-rejected-create
  - name: step-03
    try:
    - apply:
        file: ur.yaml
    # The background controller only processes Pending update requests; the webhook
    # sets this status when it creates one, so do the same here.
    - script:
        content: >-
          kubectl patch updaterequest ur-phantom-rejected-create -n kyverno
          --subresource=status --type=merge -p '{"status":{"state":"Pending"}}'
  - name: step-04
    try:
    # Each attempt fails because the trigger UID is not live, and the request is
    # deleted once it runs out of retries.
    - error:
        file: ur-removed.yaml
  - name: step-06
    try:
    - error:
        file: downstream-not-created.yaml
