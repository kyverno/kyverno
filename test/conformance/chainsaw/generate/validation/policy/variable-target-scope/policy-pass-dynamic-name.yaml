apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: generate-dynamic-name
  namespace: default
spec:
  rules:
  - name: generate-configmap
    match:
      any:
      - resources:
          kinds:
          - ConfigMap
    generate:
      apiVersion: v1
      kind: ConfigMap
      name: "{{request.object.metadata.name}}-generated"
      namespace: default
      data:
        data:
          source: policy
