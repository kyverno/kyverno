apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: legacy-inventory
spec:
  exceptions:
    - policyName: missing-cluster-policy
      ruleNames: [missing-rule]
    - policyName: missing-cluster-policy
      ruleNames: [another-rule]
    - policyName: other/missing-policy
      ruleNames: [missing-rule]
  match:
    any:
      - resources:
          kinds: [ConfigMap]
---
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: retained-legacy-inventory
spec:
  exceptions:
    - policyName: retained-legacy-policy
      ruleNames: [missing-rule]
  match:
    any:
      - resources:
          kinds: [ConfigMap]
