# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: background-subresource
spec:
  concurrent: false
  steps:
  - name: unresolved Scale is accepted with a warning
    try:
    - script:
        content: kubectl create --dry-run=server --namespace "$NAMESPACE" -f policy-1.yaml
        check:
          ($error == null): true
          (contains($stderr, 'unable to convert GVK to GVR for kinds Scale,')): true
  - name: nonexistent Pod scale is accepted with a warning
    try:
    - script:
        content: kubectl create --dry-run=server --namespace "$NAMESPACE" -f policy-2.yaml
        check:
          ($error == null): true
          (contains($stderr, 'unable to convert GVK to GVR for kinds Pod/scale,')): true
  - name: step-03
    try:
    - create:
        expect:
        - check:
            (contains($error, 'background scan enabled with subresource Pod/*')): true
        file: policy-3.yaml
  - name: step-04
    try:
    - create:
        expect:
        - check:
            (contains($error, 'background scan enabled with subresource */*')): true
        file: policy-4.yaml
  - name: step-05
    try:
    - create:
        expect:
        - check:
            (contains($error, 'background scan enabled with subresource */status')): true
        file: policy-5.yaml
  - name: resolvable Deployment scale is rejected
    try:
    - create:
        expect:
        - check:
            (contains($error, 'background scan enabled with subresource apps/v1/Deployment/scale')): true
        file: policy-6.yaml
