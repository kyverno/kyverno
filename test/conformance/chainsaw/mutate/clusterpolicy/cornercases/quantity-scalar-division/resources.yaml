apiVersion: v1
kind: Pod
metadata:
  name: quantity-integer
  labels:
    test.kyverno.io/quantity-scalar-division: "true"
spec:
  nodeSelector:
    test.kyverno.io/unschedulable: "true"
  containers:
  - name: app
    image: registry.k8s.io/pause:3.10
    resources:
      requests:
        cpu: "1"
---
apiVersion: v1
kind: Pod
metadata:
  name: quantity-decimal
  labels:
    test.kyverno.io/quantity-scalar-division: "true"
spec:
  nodeSelector:
    test.kyverno.io/unschedulable: "true"
  containers:
  - name: app
    image: registry.k8s.io/pause:3.10
    resources:
      requests:
        cpu: "1.0"
---
apiVersion: v1
kind: Pod
metadata:
  name: quantity-milli
  labels:
    test.kyverno.io/quantity-scalar-division: "true"
spec:
  nodeSelector:
    test.kyverno.io/unschedulable: "true"
  containers:
  - name: app
    image: registry.k8s.io/pause:3.10
    resources:
      requests:
        cpu: "1000m"
