# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: mpol-cel-regex-replace
spec:
  concurrent: false
  steps:
  - name: create-mutating-policy
    try:
    - apply:
        file: policy.yaml
  - name: wait-for-webhook
    try:
    - assert:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: MutatingPolicy
          metadata:
            name: rewrite-image-registry
          status:
            conditionStatus:
              (conditions[?type == 'WebhookConfigured']):
              - status: "True"
  - name: verify-image-rewritten
    try:
    # WebhookConfigured may precede API-server registration; wait for an
    # effective mutation before treating an unchanged dry-run as a failure.
    - script:
        timeout: 45s
        content: |
          for i in $(seq 1 30); do
            image=$(kubectl create -n "$NAMESPACE" -f pod.yaml \
              --dry-run=server --request-timeout=5s \
              -o jsonpath='{.spec.containers[0].image}') || exit 1
            if [ "$image" = "myregistry.io/nginx:latest" ]; then
              exit 0
            fi
            sleep 1
          done
          echo "MutatingPolicy rewrite-image-registry is not yet rewriting pod images"
          exit 1
