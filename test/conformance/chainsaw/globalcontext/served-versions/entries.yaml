apiVersion: kyverno.io/v2
kind: GlobalContextEntry
metadata:
  name: version-compat-v2
spec:
  kubernetesResource:
    version: v1
    resource: configmaps
    namespace: default
  projections:
  - name: names
    jmesPath: '[].metadata.name'
---
apiVersion: kyverno.io/v2beta1
kind: GlobalContextEntry
metadata:
  name: version-compat-v2beta1
spec:
  kubernetesResource:
    version: v1
    resource: configmaps
    namespace: default
  projections:
  - name: names
    jmesPath: '[].metadata.name'
---
apiVersion: kyverno.io/v2alpha1
kind: GlobalContextEntry
metadata:
  name: version-compat-v2alpha1
spec:
  kubernetesResource:
    version: v1
    resource: configmaps
    namespace: default
  projections:
  - name: names
    jmesPath: '[].metadata.name'
