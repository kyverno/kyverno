---
# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: projection-exactly-one
spec:
  concurrent: false
  steps:
    - name: step-01-both-set-rejected
      try:
        - apply:
            file: both-set.yaml
            expect:
              # contains, not an exact match: the apiserver's wording for a failed CRD validation
              # rule differs across Kubernetes versions (1.34 includes `Invalid value: "object":`).
              - check:
                  ($error != null): true
                  (contains($error, 'projection-both-set')): true
                  (contains($error, 'spec.projections[0]')): true
                  (contains($error, 'exactly one of jmesPath or expression must be set')): true
    - name: step-02-neither-set-rejected
      try:
        - apply:
            file: neither-set.yaml
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'projection-neither-set')): true
                  (contains($error, 'spec.projections[0]')): true
                  (contains($error, 'exactly one of jmesPath or expression must be set')): true
    - name: step-03-expression-only-accepted
      try:
        - apply:
            file: expression-only.yaml
        - assert:
            file: expression-only-assert.yaml
