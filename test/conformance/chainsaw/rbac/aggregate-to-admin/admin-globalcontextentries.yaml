apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:rbac:admin:globalcontextentries
  labels:
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
  - apiGroups:
      - kyverno.io
    resources:
      - globalcontextentries
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
