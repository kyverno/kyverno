# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: authorize-service-accounts
spec:
  description: >-
    The authorization config sends service accounts outside kube-system and
    kyverno to Kyverno, so a serviceAccount subject selector applies to them.
    A kube-system service account is excluded by matchConditions, so the same
    policy never applies to it.
  concurrent: false
  steps:
    - name: create policy
      try:
        - apply:
            file: policy.yaml
    - name: serviceAccount selectors apply to service accounts
      try:
        - script:
            timeout: 2m
            content: |
              set -e
              . ../_lib/authz.sh
              expect_allowed "list configmaps as default/chainsaw-sa-reader (serviceAccount Allow)" \
                kubectl -n "$NAMESPACE" get configmaps --as system:serviceaccount:default:chainsaw-sa-reader
              expect_forbidden "list configmaps as kube-system/chainsaw-sa-reader (excluded by matchConditions)" \
                kubectl -n "$NAMESPACE" get configmaps --as system:serviceaccount:kube-system:chainsaw-sa-reader
              expect_forbidden "list configmaps as an unlisted service account" \
                kubectl -n "$NAMESPACE" get configmaps --as system:serviceaccount:default:chainsaw-other
