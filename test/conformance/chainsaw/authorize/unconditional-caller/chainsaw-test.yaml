# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: authorize-unconditional-caller
spec:
  description: >-
    chainsaw-legacy-user is served by the kyverno-unconditional webhook, which
    has no conditionsReview, so kube-apiserver does not advertise conditional
    decisions. Kyverno must answer unconditionally and fail closed: Deny when a
    Deny condition remains, otherwise NoOpinion. Metadata-only rules still work.
  concurrent: false
  steps:
    - name: create policy
      try:
        - apply:
            file: policy.yaml
    - name: object-dependent writes are never granted
      try:
        - script:
            timeout: 2m
            content: |
              set -e
              . ../_lib/authz.sh
              as="--as chainsaw-legacy-user"
              expect_allowed "list configmaps (metadata-only Allow)" \
                kubectl -n "$NAMESPACE" get configmaps $as
              f=$(configmap owned owner=chainsaw-legacy-user | tofile)
              expect_forbidden "create a configmap the conditions would allow (residual Deny exists: Deny)" \
                kubectl -n "$NAMESPACE" create -f "$f" $as
              test "$(sar chainsaw-legacy-user create configmaps "$NAMESPACE")" = "allowed=false denied=true"
    - name: without the Deny rule the answer is NoOpinion
      try:
        - patch:
            resource:
              apiVersion: policies.kyverno.io/v1alpha1
              kind: AuthorizingPolicy
              metadata:
                name: chainsaw-unconditional-caller
              spec:
                rules:
                  - name: list
                    effect: Allow
                    expression: "request.resourceAttributes.verb == 'list'"
                  - name: owner-creates
                    effect: Allow
                    expression: "request.resourceAttributes.verb == 'create' && has(object.metadata.labels) && object.metadata.labels['owner'] == request.user"
        - script:
            timeout: 2m
            content: |
              set -e
              . ../_lib/authz.sh
              for i in $(seq 1 30); do
                out=$(sar chainsaw-legacy-user create configmaps "$NAMESPACE")
                [ "$out" = "allowed=false denied=false" ] && break
                sleep 2
              done
              echo "SubjectAccessReview API: $out"
              test "$out" = "allowed=false denied=false"
              f=$(configmap owned owner=chainsaw-legacy-user | tofile)
              expect_forbidden "create a configmap the conditions would allow (NoOpinion; RBAC does not allow)" \
                kubectl -n "$NAMESPACE" create -f "$f" --as chainsaw-legacy-user
