apiVersion: policies.kyverno.io/v1beta1
kind: ImageValidatingPolicy
metadata:
  name: compiled-context
spec:
  attestors: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  matchConditions:
    - name: context-ready
      expression: resource.get("v1", "configmaps", "default", "settings").data.enabled == "true"
  validations:
    - expression: "true"
