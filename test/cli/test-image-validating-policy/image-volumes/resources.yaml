apiVersion: v1
kind: Pod
metadata:
  name: trusted-volume
spec:
  containers:
    - name: app
      image: ghcr.io/kyverno/app:v1
      volumeMounts:
        - name: model
          mountPath: /model
  volumes:
    - name: model
      image:
        reference: ghcr.io/kyverno/model:v1
    - name: config
      configMap:
        name: app-config
---
apiVersion: v1
kind: Pod
metadata:
  name: untrusted-volume
spec:
  containers:
    - name: app
      image: ghcr.io/kyverno/app:v1
      volumeMounts:
        - name: model
          mountPath: /model
  volumes:
    - name: model
      image:
        reference: registry.example.com/model:v1
---
apiVersion: v1
kind: Pod
metadata:
  name: no-image-volume
spec:
  containers:
    - name: app
      image: ghcr.io/kyverno/app:v1
  volumes:
    - name: scratch
      emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: untrusted-volume-deployment
spec:
  selector:
    matchLabels:
      app: untrusted-volume-deployment
  template:
    metadata:
      labels:
        app: untrusted-volume-deployment
    spec:
      containers:
        - name: app
          image: ghcr.io/kyverno/app:v1
      volumes:
        - name: model
          image:
            reference: registry.example.com/model:v1
---
apiVersion: v1
kind: Pod
metadata:
  name: null-volumes
spec:
  containers:
    - name: app
      image: ghcr.io/kyverno/app:v1
  volumes: null
