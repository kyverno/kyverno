# Reads a Secret into a variable and decodes it into another: --explain must not print either
# value, but still prints the team label, which does not come from the Secret.
apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: check-password
spec:
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE"]
      resources: ["pods"]
  variables:
  - name: password
    expression: "resource.Get('v1', 'secrets', 'kyverno', 'db-credentials').data.password"
  - name: decoded
    expression: "string(base64.decode(variables.password))"
  - name: team
    expression: "object.metadata.?labels.?team.orValue('')"
  validations:
  - expression: "variables.team == 'payments' && variables.decoded.size() > 32"
    message: "the password is too short"
