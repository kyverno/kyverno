apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: deny-connect
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
    - apiGroups:   [""]
      apiVersions: [v1]
      operations:  [CONNECT]
      resources:   ["pods/exec"]
  validations:
    - expression: "!('sh' in object.command)"
      message: "executing sh is forbidden"
---
apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: require-env-label
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
    - apiGroups:   [""]
      apiVersions: [v1]
      operations:  [CREATE]
      resources:   ["pods/exec"]
  validations:
    - expression: >-
        has(object.metadata.labels) && 'env' in object.metadata.labels
      message: "connect options must have an env label"
