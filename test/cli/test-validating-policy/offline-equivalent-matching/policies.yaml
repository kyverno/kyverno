apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: offline-equivalent
spec:
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
    - apiGroups: [apps]
      apiVersions: [v1beta1]
      operations: [CREATE]
      resources: [deployments]
  validations:
  - expression: "true"
---
apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: offline-equivalent-exclusion
spec:
  matchConstraints:
    resourceRules:
    - apiGroups: [apps]
      apiVersions: [v1]
      operations: [CREATE]
      resources: [deployments]
    excludeResourceRules:
    - apiGroups: [apps]
      apiVersions: [v1beta1]
      operations: [CREATE]
      resources: [deployments]
  validations:
  - expression: "false"
