apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: disallow-capabilities-strict
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:   [""]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["pods"]
  validations:
    # Windows pods are exempt: the Pod API rejects securityContext.capabilities when
    # spec.os.name is windows, so PSA admits them with capabilities unset.
    - expression: >-
        object.spec.?os.?name.orValue('') == 'windows' ||
        (!has(object.spec.containers) || object.spec.containers.all(c,
          !has(c.securityContext) ||
          !has(c.securityContext.capabilities) ||
          ((!has(c.securityContext.capabilities.drop) || 'ALL' in c.securityContext.capabilities.drop) &&
           (!has(c.securityContext.capabilities.add) || c.securityContext.capabilities.add.all(cap, cap == 'NET_BIND_SERVICE'))))) &&
        (!has(object.spec.initContainers) || object.spec.initContainers.all(c,
          !has(c.securityContext) ||
          !has(c.securityContext.capabilities) ||
          ((!has(c.securityContext.capabilities.drop) || 'ALL' in c.securityContext.capabilities.drop) &&
           (!has(c.securityContext.capabilities.add) || c.securityContext.capabilities.add.all(cap, cap == 'NET_BIND_SERVICE'))))) &&
        (!has(object.spec.ephemeralContainers) || object.spec.ephemeralContainers.all(c,
          !has(c.securityContext) ||
          !has(c.securityContext.capabilities) ||
          ((!has(c.securityContext.capabilities.drop) || 'ALL' in c.securityContext.capabilities.drop) &&
           (!has(c.securityContext.capabilities.add) || c.securityContext.capabilities.add.all(cap, cap == 'NET_BIND_SERVICE')))))
      message: >-
        Containers must drop `ALL` capabilities and may only add `NET_BIND_SERVICE`.
        Windows Pods are exempt.
