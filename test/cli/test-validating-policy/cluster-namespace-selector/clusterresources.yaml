apiVersion: cli.kyverno.io/v1alpha1
kind: ClusterResource
metadata:
  name: cluster-namespaces
spec:
  resources:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: prod-ns
      labels:
        env: production
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: dev-ns
      labels:
        env: development
