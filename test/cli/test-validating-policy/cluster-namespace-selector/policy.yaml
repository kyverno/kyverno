apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: enforce-prod-pod-labels
spec:
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
    namespaceSelector:
      matchLabels:
        env: production
  validations:
  - expression: "has(object.metadata.labels) && 'app' in object.metadata.labels"
    message: "Production pods must have an 'app' label."
