apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: deny-all
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["configmaps"]
    objectSelector:
      matchExpressions:
        - key: skip
          operator: NotIn
          values: ["true"]
  validations:
    - expression: "false"
      message: "should never be evaluated for skip=true"
