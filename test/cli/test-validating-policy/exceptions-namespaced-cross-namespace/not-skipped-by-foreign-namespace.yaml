apiVersion: apps/v1
kind: Deployment
metadata:
  name: not-skipped-by-foreign-namespace
  namespace: tenant-a
  labels:
    app: nginx
    env: testing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest
