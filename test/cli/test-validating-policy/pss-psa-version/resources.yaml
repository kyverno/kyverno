# Pods that test the PSA behavior changes from v1.25 to v1.37.
# Each version directory renders the chart with that podSecurityVersion.
apiVersion: v1
kind: Pod
metadata:
  name: compliant
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  containers:
  - name: nginx
    image: nginx
---
# Allowed from v1.27.
apiVersion: v1
kind: Pod
metadata:
  name: sysctl-v1-27
spec:
  securityContext:
    sysctls:
    - name: net.ipv4.ip_local_reserved_ports
      value: "8080"
  containers:
  - name: nginx
    image: nginx
---
# Allowed from v1.29.
apiVersion: v1
kind: Pod
metadata:
  name: sysctl-v1-29
spec:
  securityContext:
    sysctls:
    - name: net.ipv4.tcp_keepalive_time
      value: "600"
  containers:
  - name: nginx
    image: nginx
---
# Allowed from v1.32.
apiVersion: v1
kind: Pod
metadata:
  name: sysctl-v1-32
spec:
  securityContext:
    sysctls:
    - name: net.ipv4.tcp_rmem
      value: "4096 87380 6291456"
  containers:
  - name: nginx
    image: nginx
---
# Allowed from v1.37.
apiVersion: v1
kind: Pod
metadata:
  name: sysctl-v1-37
spec:
  securityContext:
    sysctls:
    - name: net.ipv4.tcp_notsent_lowat
      value: "16384"
  containers:
  - name: nginx
    image: nginx
---
# Allowed from v1.31.
apiVersion: v1
kind: Pod
metadata:
  name: selinux-container-engine-t
spec:
  containers:
  - name: nginx
    image: nginx
    securityContext:
      seLinuxOptions:
        type: container_engine_t
---
# Checked from v1.34.
apiVersion: v1
kind: Pod
metadata:
  name: probe-host
spec:
  containers:
  - name: nginx
    image: nginx
    readinessProbe:
      httpGet:
        host: 10.0.0.1
        port: 80
---
# The user namespace Pods below are allowed from v1.35, with podSecurityUserNamespaces.
apiVersion: v1
kind: Pod
metadata:
  name: proc-mount-host-users-false
spec:
  hostUsers: false
  containers:
  - name: nginx
    image: nginx
    securityContext:
      procMount: Unmasked
---
apiVersion: v1
kind: Pod
metadata:
  name: run-as-root-allowed-host-users-false
spec:
  hostUsers: false
  containers:
  - name: nginx
    image: nginx
---
apiVersion: v1
kind: Pod
metadata:
  name: run-as-user-0-host-users-false
spec:
  hostUsers: false
  securityContext:
    runAsUser: 0
  containers:
  - name: nginx
    image: nginx
---
# Never relaxed: hostUsers is unset.
apiVersion: v1
kind: Pod
metadata:
  name: proc-mount-host-users-unset
spec:
  containers:
  - name: nginx
    image: nginx
    securityContext:
      procMount: Unmasked
---
# Pods below are Restricted-compliant except for the field under test.
# Their expected results come from upstream PSA v0.37.1 for each version.
apiVersion: v1
kind: Pod
metadata:
  name: sysctl-net-ipv4-ip-local-reserved-ports
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
    sysctls:
    - name: net.ipv4.ip_local_reserved_ports
      value: '1'
  containers:
  - name: c
    image: nginx
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
---
