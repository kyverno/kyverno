apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: require-run-as-nonroot
  annotations:
    policies.kyverno.io/title: Require runAsNonRoot
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: "medium"
    policies.kyverno.io/subject: Pod
    kyverno.io/kyverno-version: latest
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kubernetes-version: ">=1.25.0-0"
    kyverno.io/pod-security-version: "latest (v1.25)"
    policies.kyverno.io/description: >-
      Containers must be required to run as non-root users. This policy ensures
      `runAsNonRoot` is set to `true`. A known issue prevents a policy such as this
      using `anyPattern` from being persisted properly in Kubernetes 1.23.0-1.23.2.
  labels:
    app.kubernetes.io/component: kyverno
    app.kubernetes.io/instance: kyverno-policies
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: kyverno-policies
    app.kubernetes.io/part-of: kyverno-policies
    app.kubernetes.io/version: "v0.0.0"
    helm.sh/chart: kyverno-policies-v0.0.0
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [pods]
  variables:
    - name: ctnrs
      expression: >-
        object.spec.containers +
        object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: |-
        object.spec.?hostUsers.orValue(true) == false ||
        object.spec.?securityContext.?runAsNonRoot.orValue(true) == true &&
        variables.ctnrs.all(c,
          c.?securityContext.?runAsNonRoot.orValue(
            object.spec.?securityContext.?runAsNonRoot.orValue(false)) == true)
      message: >-
        Running as root is not allowed. The field spec.securityContext.runAsNonRoot
        must be unset or set to `true`. The fields
        spec.containers[*].securityContext.runAsNonRoot,
        spec.initContainers[*].securityContext.runAsNonRoot, and
        spec.ephemeralContainers[*].securityContext.runAsNonRoot must be unset or set to
        `true` when the pod-level field is `true`, and must be set to `true` when the
        pod-level field is unset.
        This policy does not apply to Pods that set spec.hostUsers to `false`.
  validationActions:
    - Audit
