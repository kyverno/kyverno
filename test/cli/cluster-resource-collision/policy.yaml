apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: require-allowed
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
    - apiGroups: [alpha.example.com, beta.example.com]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [widgets]
  validations:
  - expression: object.spec.allowed == true
    message: widget must be allowed
