apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: evaluate-target-resources
spec:
  validationActions:
  - Deny
  matchConstraints:
    resourceRules:
    - apiGroups: ["*"]
      apiVersions: ["*"]
      operations: [CREATE, UPDATE]
      resources: ["*"]
  validations:
  - expression: >-
      object.kind == 'ConfigMap' &&
      globalContext.get('version-cache', 'names').size() == 2 &&
      'cached-source' in globalContext.get('version-cache', 'names') &&
      'target' in globalContext.get('version-cache', 'names')
    message: GlobalContextEntry inputs must be extracted and loaded before target evaluation.
