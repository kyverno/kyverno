# A ValidatingPolicy and a DeletingPolicy over a pod and a custom resource whose CRD is not given.
# apply runs DeletingPolicies after ValidatingPolicies, and stops on the custom resource, since it
# cannot map its kind: the ValidatingPolicy's decisions are made before that.
apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: require-team
spec:
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE"]
      resources: ["pods"]
  validations:
  - expression: "object.metadata.?labels.?team.orValue('') != ''"
    message: "pods need a team label"
---
apiVersion: policies.kyverno.io/v1beta1
kind: DeletingPolicy
metadata:
  name: delete-unowned
spec:
  conditions:
  - name: no-team
    expression: "!has(object.metadata.labels) || !('team' in object.metadata.labels)"
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: [v1]
      resources: [pods]
  schedule: '*/1 * * * *'
