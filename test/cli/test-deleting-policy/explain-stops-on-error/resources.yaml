apiVersion: v1
kind: Pod
metadata:
  name: with-team
  namespace: prod
  labels:
    team: payments
spec:
  containers:
  - name: web
    image: nginx:1.27
---
apiVersion: v1
kind: Pod
metadata:
  name: no-team
  namespace: prod
spec:
  containers:
  - name: web
    image: nginx:1.27
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: web-tls
  namespace: prod
spec:
  secretName: web-tls
  issuerRef:
    name: letsencrypt
