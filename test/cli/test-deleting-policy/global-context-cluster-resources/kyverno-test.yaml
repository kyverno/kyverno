apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: global-context-cluster-resources
clusterResources:
  - clusterresources.yaml
globalContextEntries:
  - name: retired-widgets
    data:
      retired:
        - old-widget
    projections:
      - name: names
        path: retired
policies:
  - policy.yaml
resources:
  - resources.yaml
results:
  - isDeletingPolicy: true
    kind: Widget
    policy: delete-retired-widgets
    resources:
      - old-widget
    result: pass
  - isDeletingPolicy: true
    kind: Widget
    policy: delete-retired-widgets
    resources:
      - new-widget
    result: fail
