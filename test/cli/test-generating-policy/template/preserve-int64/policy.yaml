apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: template-preserve-int64
spec:
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: [v1]
      operations: [CREATE]
      resources: [namespaces]
  matchConditions:
  - name: test-namespace
    expression: object.metadata.name == 'template-preserve-int64'
  variables:
  - name: revision
    expression: >-
      {
        "apiVersion": "apps/v1",
        "kind": "ControllerRevision",
        "metadata": {"name": "sample", "namespace": object.metadata.name},
        "revision": 9007199254740993,
        "data": {"previous": [9007199254740992], "label": "9007199254740993"}
      }
  generate:
  - template:
      interpolate: cel
      value: |
        (( variables.revision ))
