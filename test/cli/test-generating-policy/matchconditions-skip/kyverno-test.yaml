apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: generating-policy-match-condition-skip
policies:
  - policy.yaml
resources:
  - resources.yaml
results:
  - isGeneratingPolicy: true
    policy: generate-configmap-for-workloads
    resources:
      - workload-namespace
    kind: Namespace
    generatedResource: configmap.yaml
    result: pass
  - isGeneratingPolicy: true
    policy: generate-configmap-for-workloads
    resources:
      - excluded-namespace
    kind: Namespace
    result: skip
