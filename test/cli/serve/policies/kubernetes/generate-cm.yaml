apiVersion: policies.kyverno.io/v1beta1
kind: GeneratingPolicy
metadata:
  name: generate-cm
spec:
  evaluation:
    synchronize:
      enabled: false
  matchConstraints:
    resourceRules:
    - apiGroups:   [""]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["namespaces"]
  variables:
  - name: nsName
    expression: "object.metadata.name"
  - name: configmap
    expression: >-
      [
        {
          "kind": dyn("ConfigMap"),
          "apiVersion": dyn("v1"),
          "metadata": dyn({
            "name": "team-settings",
            "namespace": string(variables.nsName),
          }),
          "data": dyn({
            "owner": "platform"
          })
        }
      ]
  generate:
  - expression: generator.Apply(variables.nsName, variables.configmap)
