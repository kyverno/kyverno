apiVersion: policies.kyverno.io/v1beta1
kind: MutatingPolicy
metadata:
  name: rewrite-image-registry
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:   [""]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["pods"]
  mutations:
  - patchType: ApplyConfiguration
    applyConfiguration:
      expression: >
        Object{
          spec: Object.spec{
            containers: object.spec.containers.map(c, Object.spec.containers{
              name: c.name,
              image: c.image.startsWith("docker.io/") ? "registry.example.com/" + c.image.substring(10) : c.image
            })
          }
        }
