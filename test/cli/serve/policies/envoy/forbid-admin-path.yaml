apiVersion: policies.kyverno.io/v1alpha1
kind: ValidatingPolicy
metadata:
  name: forbid-admin-path
spec:
  evaluation:
    mode: Envoy
  validations:
  - expression: >
      object.attributes.request.http.path.startsWith("/admin")
        ? envoy.Denied(403).Response()
        : envoy.Allowed().Response()
