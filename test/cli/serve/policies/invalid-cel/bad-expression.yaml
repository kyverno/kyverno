# The schema is valid but the CEL expression does not compile, so kyverno serve must refuse it at
# startup instead of failing the first request.
apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: bad-expression
spec:
  matchConstraints:
    resourceRules:
    - apiGroups: [apps]
      apiVersions: [v1]
      operations: [CREATE]
      resources: [deployments]
  validations:
  - expression: "object.metadata.labels.team =="
