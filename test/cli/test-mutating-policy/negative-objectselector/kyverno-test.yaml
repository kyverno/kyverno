apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: mpol-negative-objectselector
policies:
  - policy.yaml
resources:
  - resources.yaml
results:
  - isMutatingPolicy: true
    policy: add-label
    kind: ConfigMap
    resources:
      - opted-out
    result: skip
  - isMutatingPolicy: true
    policy: add-label
    kind: ConfigMap
    resources:
      - selected
    result: pass
