apiVersion: policies.kyverno.io/v1beta1
kind: MutatingPolicy
metadata:
  name: mark-tier-change
spec:
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: [v1]
      operations: [UPDATE]
      resources: [pods]
  matchConditions:
  - name: tier-changed
    expression: "oldObject.metadata.labels.tier != object.metadata.labels.tier"
  mutations:
  - patchType: ApplyConfiguration
    applyConfiguration:
      expression: >
        Object{metadata: Object.metadata{labels: {"tier-changed-from": string(oldObject.metadata.labels.tier)}}}
