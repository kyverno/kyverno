{{- /*
  The policies match pods/ephemeralcontainers, and Kyverno checks that the reports
  controller can read every resource a policy matches. Without this role, each
  policy reports RBACPermissionsGranted=False.
*/ -}}
{{- if and .Values.ephemeralContainersRBAC (ne .Values.podSecurityStandard "privileged") (contains "pods/ephemeralcontainers" (include "kyverno-policies.podResources" .)) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}:reports-controller:ephemeralcontainers
  labels:
    rbac.kyverno.io/aggregate-to-reports-controller: "true"
    {{- include "kyverno-policies.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - pods/ephemeralcontainers
    verbs:
      - get
      - list
      - watch
{{- end }}
