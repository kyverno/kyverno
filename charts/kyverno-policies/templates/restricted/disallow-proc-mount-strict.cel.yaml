{{- $name := "disallow-proc-mount-strict" }}
{{- if and .Values.podSecurityUserNamespaces (eq (include "kyverno-policies.podSecurityRestricted" (merge (dict "name" $name) .)) "true") (eq (include "kyverno-policies.useValidatingPolicy" .) "true") }}
apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: {{ $name }}
  annotations:
    policies.kyverno.io/title: Disallow /proc Mount Type (Strict)
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    {{- with (include "kyverno-policies.policySeverity" (dict "name" $name "values" .Values)) }}
    policies.kyverno.io/severity: {{ . }}
    {{- end }}
    policies.kyverno.io/subject: Pod
    kyverno.io/kyverno-version: {{ default .Chart.AppVersion (include "kyverno-policies.kyvernoVersion" .) }}
    kyverno.io/kubernetes-version: "{{ default .Chart.KubeVersion .Values.kubeVersionOverride }}"
    policies.kyverno.io/description: >-
      The Restricted profile requires the default /proc masks even for Pods that run in a
      user namespace. This policy ensures the `procMount` field is unset or set to `Default`,
      with no `hostUsers` relaxation.
    {{- include "kyverno-policies.customAnnotations" (dict "name" $name "values" .Values) | nindent 4 }}
  labels: {{ include "kyverno-policies.labels" . | nindent 4 }}
spec:
  failurePolicy: {{ .Values.failurePolicy }}
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [pods]
    {{- with (include "kyverno-policies.policyVpolExclude" (dict "name" $name "values" .Values) | fromYaml) }}
    {{- with .excludeResourceRules }}
    excludeResourceRules:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- include "kyverno-policies.vpolExcludeMatchConditions" . | nindent 2 }}
  {{ end }}
  validations:
    # No hostUsers relaxation here. Kubernetes PSA's Restricted procMount check
    # overrides the relaxed Baseline check and stays unconditional.
    - expression: >-
        (!has(object.spec.containers) || object.spec.containers.all(c,
          !has(c.securityContext) ||
          !has(c.securityContext.procMount) ||
          c.securityContext.procMount == 'Default')) &&
        (!has(object.spec.initContainers) || object.spec.initContainers.all(c,
          !has(c.securityContext) ||
          !has(c.securityContext.procMount) ||
          c.securityContext.procMount == 'Default')) &&
        (!has(object.spec.ephemeralContainers) || object.spec.ephemeralContainers.all(c,
          !has(c.securityContext) ||
          !has(c.securityContext.procMount) ||
          c.securityContext.procMount == 'Default'))
      message: >-
        The Restricted profile does not allow a non-default /proc mask, even in a user namespace.
        The fields spec.containers[*].securityContext.procMount,
        spec.initContainers[*].securityContext.procMount, and
        spec.ephemeralContainers[*].securityContext.procMount must be unset or set to `Default`.
  {{- include "kyverno-policies.policyAuditAnnotations" (dict "name" $name "values" .Values) | nindent 2 }}
  {{- $actions := include "kyverno-policies.policyValidationActions" (dict "name" $name "values" .Values) }}
  validationActions: {{ $actions | nindent 4 }}
{{- end }}
