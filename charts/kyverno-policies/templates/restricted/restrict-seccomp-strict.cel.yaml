{{- $name := "restrict-seccomp-strict" }}
{{- if and (eq (include "kyverno-policies.podSecurityRestricted" (merge (dict "name" $name) .)) "true") (eq (include "kyverno-policies.useValidatingPolicy" .) "true") }}
apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: {{ $name }}
  annotations:
    policies.kyverno.io/title: Restrict Seccomp (Strict)
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    {{- with (include "kyverno-policies.policySeverity" (dict "name" $name "values" .Values)) }}
    policies.kyverno.io/severity: {{ . }}
    {{- end }}
    policies.kyverno.io/subject: Pod
    kyverno.io/kyverno-version: {{ default .Chart.AppVersion (include "kyverno-policies.kyvernoVersion" .) }}
    kyverno.io/kubernetes-version: "{{ default .Chart.KubeVersion .Values.kubeVersionOverride }}"
    policies.kyverno.io/description: >-
      The seccomp profile must be explicitly set to `RuntimeDefault` or `Localhost`.
      This policy ensures that seccomp is set to one of these allowed values.
    {{- include "kyverno-policies.customAnnotations" (dict "name" $name "values" .Values) | nindent 4 }}
  labels: {{ include "kyverno-policies.labels" . | nindent 4 }}
spec:
  failurePolicy: {{ .Values.failurePolicy }}
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [pods]
    {{- with (include "kyverno-policies.policyVpolExclude" (dict "name" $name "values" .Values) | fromYaml) }}
    {{- with .excludeResourceRules }}
    excludeResourceRules:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- include "kyverno-policies.vpolExcludeMatchConditions" . | nindent 2 }}
  {{ end }}
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers
        + object.spec.?initContainers.orValue([])
        + object.spec.?ephemeralContainers.orValue([])

  validations:
    - expression: >-
        !object.spec.?securityContext.?seccompProfile.?type.hasValue() ||
        object.spec.securityContext.seccompProfile.type in ['RuntimeDefault', 'Localhost']
      message: >-
        The field spec.securityContext.seccompProfile.type must be unset or
        set to `RuntimeDefault` or `Localhost`.

    - expression: >-
        variables.allContainers.all(c,
          c.?securityContext.?seccompProfile.?type.orValue('') in ['RuntimeDefault', 'Localhost'] ||
          (!c.?securityContext.?seccompProfile.?type.hasValue() &&
           object.spec.?securityContext.?seccompProfile.?type.orValue('') in ['RuntimeDefault', 'Localhost']))
      message: >-
        Containers must set securityContext.seccompProfile.type to `RuntimeDefault`
        or `Localhost`, or inherit a valid pod-level
        spec.securityContext.seccompProfile.type.
  {{- include "kyverno-policies.policyAuditAnnotations" (dict "name" $name "values" .Values) | nindent 2 }}
  {{- $actions := include "kyverno-policies.policyValidationActions" (dict "name" $name "values" .Values) }}
  validationActions: {{ $actions | nindent 4 }}
{{- end }}

