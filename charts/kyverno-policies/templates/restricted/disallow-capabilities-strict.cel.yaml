{{- $name := "disallow-capabilities-strict" }}
{{- if and (eq (include "kyverno-policies.podSecurityRestricted" (merge (dict "name" $name) .)) "true") (eq (include "kyverno-policies.useValidatingPolicy" .) "true") }}
apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: {{ $name }}
  annotations:
    policies.kyverno.io/title: Disallow Capabilities (Strict)
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    {{- with (include "kyverno-policies.policySeverity" (dict "name" $name "values" .Values)) }}
    policies.kyverno.io/severity: {{ . }}
    {{- end }}
    policies.kyverno.io/minversion: 1.6.0
    kyverno.io/kyverno-version: {{ default .Chart.AppVersion (include "kyverno-policies.kyvernoVersion" .) }}
    kyverno.io/kubernetes-version: "{{ default .Chart.KubeVersion .Values.kubeVersionOverride }}"
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Adding capabilities other than `NET_BIND_SERVICE` is disallowed. In addition,
      all containers must explicitly drop `ALL` capabilities.
    {{- include "kyverno-policies.customAnnotations" (dict "name" $name "values" .Values) | nindent 4 }}
  labels: {{ include "kyverno-policies.labels" . | nindent 4 }}
spec:
  failurePolicy: {{ .Values.failurePolicy }}
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [pods]
    {{- with (include "kyverno-policies.policyVpolExclude" (dict "name" $name "values" .Values) | fromYaml) }}
    {{- with .excludeResourceRules }}
    excludeResourceRules:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- include "kyverno-policies.vpolExcludeMatchConditions" . | nindent 2 }}
  {{ end }}
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers +
        object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.allContainers.all(c,
          'ALL' in c.?securityContext.?capabilities.?drop.orValue([]) &&
          c.?securityContext.?capabilities.?add.orValue([]).all(cap, cap == 'NET_BIND_SERVICE'))
      message: >-
        Containers must drop `ALL` capabilities and may only add `NET_BIND_SERVICE`.
        The fields spec.containers[*].securityContext.capabilities.drop,
        spec.initContainers[*].securityContext.capabilities.drop, and
        spec.ephemeralContainers[*].securityContext.capabilities.drop must include `ALL`,
        and the matching capabilities.add fields must be unset or contain only `NET_BIND_SERVICE`.
  {{- include "kyverno-policies.policyAuditAnnotations" (dict "name" $name "values" .Values) | nindent 2 }}
  {{- $actions := include "kyverno-policies.policyValidationActions" (dict "name" $name "values" .Values) }}
  validationActions: {{ $actions | nindent 4 }}
{{- end }}

