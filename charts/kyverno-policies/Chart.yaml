apiVersion: v2
type: application
name: kyverno-policies
version: v0.0.0  # VERSION
appVersion: latest
icon: https://github.com/kyverno/kyverno/raw/main/img/logo.png
description: Kubernetes Pod Security Standards implemented as Kyverno policies
keywords:
  - kubernetes
  - policy agent
  - validating webhook
  - admissions controller
home: https://kyverno.io/policies/
sources:
  - https://github.com/kyverno/policies
maintainers:
  - name: kyverno-maintainers
    email: cncf-kyverno-maintainers@lists.cncf.io
kubeVersion: ">=1.25.0-0"
annotations:
  # Pod Security Admission versions that podSecurityVersion accepts. Keep in sync with psaMinVersion and psaMaxVersion.
  kyverno.io/pod-security-versions: v1.25-v1.37
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/changes: |
    - kind: removed
      description: Removed the policyType chart value; the built-in PSS templates now render only ValidatingPolicy (policies.kyverno.io) types
    - kind: removed
      description: Remove spec.validationFailureAction field from policies as it is deprecated
    - kind: added
      description: Add spec.validate[*].failureAction field to policies
    - kind: fixed
      description: Fix the merging of policyExclude customizations to avoid wrong overrides
    - kind: added
      description: Add spec.validate[*].allowExistingViolations field to policies
    - kind: added
      description: Add the podSecurityVersion value to match a Kubernetes Pod Security Admission version, from v1.25 to v1.37
